# cargo-audit ignore list — kept in sync with deny.toml's [advisories] ignore
# and the CI cargo-audit step. The release preflight runs bare `cargo audit`,
# which reads THIS file (not deny.toml), so the allowlist must live here too.
[advisories]
ignore = [
    # wasmtime — two low-severity advisories (RUSTSEC-2026-0222 CVSS 3.8,
    # RUSTSEC-2026-0223 CVSS 2.0) in the WASM plugin engine. Both require an
    # attacker-controlled module; Tune only loads first-party plugins in the
    # sandbox, and there is no drop-in wasmtime bump today. Revisit at the next
    # wasmtime upgrade. (Completes #1066, which missed the preflight path.)
    "RUSTSEC-2026-0222",
    "RUSTSEC-2026-0223",
]
