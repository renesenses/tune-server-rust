# Cargo build configuration.
#
# Windows: link the C runtime statically so the produced .exe does not
# require the user to install the "Microsoft Visual C++ Redistributable"
# separately. Without this flag, vcruntime140.dll / msvcp140.dll are
# loaded dynamically at startup, and Windows users whose system lacks
# the runtime see "tune-server.exe a cessé de fonctionner" with no
# message — exactly the symptom on forum bugs #23 (Bilou v0.8.10) and
# #26 (bluevelvet v0.8.x). Confirmed prereq diagnosis by tester
# dimitrios in #9 ("ok resolu : faut installer visuel c++").
#
# Static linking adds ~1 MB to the .exe but removes the prerequisite
# entirely. This is the recommended distribution shape for end-user
# Windows binaries built with the MSVC toolchain.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Cible musl arm64 : `-lc` en FIN de ligne de lien (#3621).
#
# Sur cette cible, rustc lie en `-static` et la libc musl est parcourue une
# seule fois, AVANT les bibliotheques natives des caisses. `libasound.a` (la
# sortie audio locale, `local-audio` -> cpal -> alsa-sys) arrive donc apres, et
# les symboles de libc que rien d'autre ne tirait restent sans definition :
# `strncasecmp`, `strtod`, `scandir`, `semop`, `getgrnam_r`… — mesure le
# 19/09/2026 sur Shrek. Un second `-lc`, en queue, les resout ; sans
# `local-audio` il ne fait rien (la libc est deja la). Voir Cross.toml pour la
# recette complete de la cible.
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-lc"]

# CMake < 3.5 compatibility shim.
#
# CMake 4.x (macOS/Windows GitHub runners, modern dev machines) removed
# compatibility with projects declaring `cmake_minimum_required` below 3.5,
# aborting the configure step with:
#
#   CMake Error: Compatibility with CMake < 3.5 has been removed from CMake.
#
# `CMAKE_POLICY_VERSION_MINIMUM` is read from the environment as a *floor* on
# the policy version: a project declaring a HIGHER minimum keeps its own, so
# this only ever rescues the projects that declare a lower one.
#
# ## Pourquoi c'est toujours là après #2251
#
# Ce réglage était posé pour la libopus embarquée d'`audiopus_sys 0.2.2`, dont
# le `CMakeLists.txt` déclarait un minimum antérieur à 3.5. Cette crate a été
# remplacée par `opus` / `opusic-sys`, dont la libopus 1.6.1 déclare
# `cmake_minimum_required(VERSION 3.16)` : pour libopus, la variable est
# désormais **sans effet**.
#
# Elle reste néanmoins ici, car libopus n'est pas la seule dépendance native
# construite par CMake dans ce dépôt (le `Dockerfile` installe `cmake`/`clang`
# pour librespot et airplay-daemon). La retirer serait un changement à la
# portée non mesurée, sans bénéfice : sur un projet qui déclare déjà ≥ 3.5 elle
# ne fait rien.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
