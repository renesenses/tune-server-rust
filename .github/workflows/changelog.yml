name: Changelog

# Phase 3 of release autonomy (docs/RELEASE-AUTONOMY-v0.9.50.md).
# Generates the CHANGELOG.md from conventional commits using
# git-cliff. Ce workflow est un outil manuel de prévisualisation. La pose du
# tag ne déclenche plus de workflow parallèle au contrôleur de release.
#
# release.yml will consume the generated changelog body as the
# GitHub Release body once phase 4 (full release pipeline) is wired.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to generate changelog for (e.g. v0.8.30)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so git-cliff sees every commit

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: changelog-tools

      - name: Install git-cliff
        # The third-party orhun/git-cliff-action@v3 uses a Debian buster
        # base image which is EOL — its apt repos return 404. Install
        # the binary ourselves from cargo to avoid the dependency.
        run: cargo install git-cliff --locked

      - name: Generate changelog for this tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git-cliff --tag "$RELEASE_TAG" --latest \
            --output RELEASE_NOTES.md
          echo "── Release notes ──"
          cat RELEASE_NOTES.md
          {
            echo "## Release notes for $RELEASE_TAG"
            echo
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ inputs.tag }}
          path: RELEASE_NOTES.md
          retention-days: 30
