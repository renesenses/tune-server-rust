name: CI

on:
  push:
    branches: [main]
  # Toutes les PR, y compris les PR empilees dont la base est une branche de
  # travail. L'ancien filtre main/release laissait ces PR avec PostgreSQL seul.
  pull_request:
    # Poser `ci:full` sur une PR de lot doit relancer immediatement le routage.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  # Un nouveau SHA rend tous les resultats de l'ancien SHA inutiles. Sans
  # annulation, trois matrices completes de la meme PR occupaient les runners
  # simultanement et la bonne execution attendait derriere les obsoletes.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Une PR qui ne touche que la documentation ou les garde-fous GitHub ne
  # gagne rien a compiler Rust sur Linux, macOS et Windows. #2428 l'a mesure :
  # 29 min 44 de runners et 9 min 38 de mur pour deux fichiers shell/YAML.
  #
  # La classification est fail-closed : seul un petit ensemble explicite prend
  # la voie rapide. Tout chemin inconnu garde la batterie complete. Un push
  # non-Rust peut lui aussi reutiliser la validation du PR ; un lancement
  # manuel reste toujours complet.
  impact:
    name: Impact et garde-fous légers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classer.outputs.rust }}
      full: ${{ steps.classer.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classer le diff
        id: classer
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE_REF_CI: ${{ github.base_ref }}
          HEAD_REF_CI: ${{ github.head_ref }}
          FORCER_COMPLET: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AVANT_SHA: ${{ github.event.before }}
          SHA_COURANT: ${{ github.sha }}
        run: |
          # Le seul verdict qui ouvre la voie rapide est la sortie exacte
          # `rapide`. Script absent, erreur ou sortie inconnue => complet.
          PROFIL_CI="$(
            EVENEMENT="$EVENEMENT" \
            BASE_REF="$BASE_REF_CI" \
            FORCER_COMPLET="$FORCER_COMPLET" \
            bash scripts/determiner-profil-ci.sh
          )" || PROFIL_CI=complet
          if [ "$PROFIL_CI" = rapide ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "PR de correctif vers $BASE_REF_CI : noyau CI rapide"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "profil complet : $EVENEMENT vers ${BASE_REF_CI:-sans-base}"
          fi

          # Une promotion RC -> main valide toujours le serveur entier, meme
          # si le dernier diff ne touche que la CI ou les versions.
          if [ "$EVENEMENT" = pull_request ] && [ "$BASE_REF_CI" = main ] && [[ "$HEAD_REF_CI" = rc/* ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "promotion $HEAD_REF_CI -> main : batterie complete"
            exit 0
          fi

          case "$EVENEMENT" in
            pull_request)
              DEBUT="$BASE_SHA"
              FIN="$HEAD_SHA"
              ;;
            push)
              # Un premier push (SHA avant rempli de zeros) n'a pas de base
              # fiable : fail-closed, comme un chemin inconnu.
              if printf '%s\n' "$AVANT_SHA" | grep -qE '^0{40}$'; then
                echo "rust=true" >> "$GITHUB_OUTPUT"
                echo "premier push sans base : batterie complete"
                exit 0
              fi
              DEBUT="$AVANT_SHA"
              FIN="$SHA_COURANT"
              ;;
            *)
              echo "rust=true" >> "$GITHUB_OUTPUT"
              echo "lancement manuel : batterie complete"
              exit 0
              ;;
          esac

          if ! git cat-file -e "$DEBUT^{commit}" || ! git cat-file -e "$FIN^{commit}"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "base du diff introuvable : batterie complete"
            exit 0
          fi
          # `--no-renames` rend les deux noms : renommer du Rust en .md ne doit
          # pas cacher le chemin Rust d'origine au classifieur.
          if ! git diff --no-renames --name-only -z "$DEBUT" "$FIN" > /tmp/chemins-ci; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "diff impossible : batterie complete"
            exit 0
          fi
          if bash scripts/detecter-impact-ci.sh < /tmp/chemins-ci; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Contre-épreuves du classifieur
        run: |
          bash scripts/detecter-impact-ci.sh --autotest
          bash scripts/determiner-profil-ci.sh --autotest

      - name: Contre-épreuves des garde-fous d issues
        run: |
          bash scripts/verifier-fermeture.sh --autotest
          bash scripts/verifier-refs-issues.sh --autotest
          python3 scripts/preflight-check.py --self-test
          python3 scripts/measure-compile.py --self-test
          python3 scripts/verser-message-forum.py --self-test
          python3 scripts/synchroniser-release-main.py --self-test

      # Contre-epreuve du critere de selection des rondes de tri (#2910),
      # rejouee hors ligne sur la fenetre reelle du 28 au 30/08/2026 : le
      # critere retire rate les reponses 5922, 5949 et 5958, le critere par
      # message les selectionne, et le fil temoin 1588 reste hors lot des
      # deux cotes. Aucun reseau, aucune ecriture sur le forum.
      - name: Contre-épreuve de la ronde de tri
        run: python3 scripts/nouveautes-forum.py --self-test

      - name: Syntaxe des scripts de garde-fou
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            koalaman/shellcheck-alpine:v0.10.0 shellcheck --severity=warning \
            scripts/detecter-impact-ci.sh \
            scripts/determiner-profil-ci.sh \
            scripts/verifier-fermeture.sh \
            scripts/verifier-refs-issues.sh

      # Les workflows historiques portent quelques remarques shellcheck, mais
      # leur YAML et leurs expressions sont valides. On garde le controle
      # structurel et on ignore seulement ces deux familles connues.
      - name: Syntaxe des workflows GitHub
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            rhysd/actionlint:1.7.7 \
            -shellcheck= \
            -ignore 'constant.expression.*false' \
            -ignore 'label.*macos-15-intel.*is unknown'

  fmt:
    name: Format
    needs: impact
    if: needs.impact.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # fmt — 27 s observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  test:
    name: Test
    needs: impact
    if: needs.impact.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # test — 4 min observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v0.9' }}
      # `-p tune-bridge` et `cloud-relay` : le chemin de l'ecoute distante
      # n'etait couvert par AUCUNE porte. Le relais (`tune-bridge`) n'etait ni
      # teste ni compile ici, et `tune-core/src/cloud/relay.rs` vit derriere
      # `cloud-relay`, absent de tous les jeux de fonctionnalites de la CI.
      # Le relayage des flux y est donc reste un `TODO Phase 2` sans que rien
      # ne rougisse : une requete de flux distante finissait en 504, muette.
      #
      # `-p tune-http-types` et `-p tune-smart-http` : deux caisses extraites
      # par ce lot. Sans elles ici, le decoupage aurait retire du code de la
      # porte au lieu de l'y garder — la liste est un inventaire, pas un
      # echantillon (cf #2865).
      #
      # `bandcamp` : meme motif que `local-audio` cote clippy (#2865).
      # `tune-server/tests/bandcamp_file_de_zone_i2702.rs`
      # vit derriere `#![cfg(feature = "bandcamp")]` parce que la caisse
      # `tune-bandcamp` est une dependance OPTIONNELLE
      # (`bandcamp = ["dep:tune-bandcamp"]`) : sans la fonctionnalite, ni le
      # service ni son inscription dans `state.rs` n'existent. La retirer
      # d'ici ne rendrait pas ces cinq essais rouges — elle les rendrait
      # INVISIBLES, et #2702/#2778 redeviendraient verts contre rien. Ils ne
      # tourneraient alors que dans `test-shipped-features`, differe jusqu'a
      # `full`, donc JAMAIS sur une PR vers `batch/*`.
      #
      # La fonctionnalite est dans le `default` de `tune-server` et dans TOUS
      # les binaires publies ; c'est `--no-default-features` qui la retirait
      # ici. Elle ne tire aucune caisse audio ni systeme
      # (`plugins/tune-bandcamp/Cargo.toml` : axum, serde, reqwest, tokio,
      # tracing) : rien de plus a installer sur ce runner.
      #
      # Garde : `le_job_test_de_la_ci_active_bandcamp`
      # (tune-server/tests/workflows_bornes.rs).
      - run: cargo test --no-fail-fast -p tune-core -p tune-http-types -p tune-smart-http -p tune-stream-http -p tune-streaming-http -p tune-server -p tune-bridge --no-default-features --features oaat,cloud-relay,bandcamp

  # La CI validait `--features oaat` alors que les binaires publies embarquent
  # six fonctionnalites. Neuf tests de greffons echouaient donc en silence
  # depuis au moins la 0.9.61 : `dj_plugin.rs` est derriere
  # `#![cfg(feature = "dj")]`, jamais compile ici, et `plugin_routes.rs`
  # comptait les greffons en supposant qu'aucun n'etait compile (#1427).
  #
  # Ce job execute la suite avec LE JEU LIVRE. Sans lui, ces tests
  # redeviennent invisibles a la premiere occasion.
  test-shipped-features:
    name: Test (jeu de fonctionnalites livre)
    needs: impact
    if: needs.impact.outputs.rust == 'true' && needs.impact.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # test-shipped-features — ~5 min observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v0.9' }}
      # Meme dependance systeme que le job de build : sans elle, la compilation
      # s'arrete sur « Package alsa was not found in the pkg-config ».
      - name: Install ALSA dev (retry — voir release.yml)
        timeout-minutes: 18
        run: |
          for essai in 1 2 3; do
            if timeout 100 sudo apt-get update && timeout 200 sudo apt-get install -y libasound2-dev; then
              exit 0
            fi
            echo "::warning::apt a echoue ou depasse le delai (essai $essai/3)"
            sudo rm -rf /var/lib/apt/lists/*
            sleep 20
          done
          echo "::error::apt injoignable apres 3 essais"
          exit 1
      - run: cargo test --no-fail-fast -p tune-server --no-default-features --features oaat,local-audio,postgres,dj,karaoke,bandcamp,concerts,plugins-wasm,audio-embedding

  # The acoustic Smart Radio pulls `ort` (onnxruntime) behind the opt-in
  # `audio-embedding` feature, now shipped in the release + docker builds. This
  # job compile-checks it in isolation so a break surfaces on the PR rather than
  # only at release time. `load-dynamic` needs no onnxruntime binary at build.
  #
  # Il EXECUTE aussi les tests de `tune-core` derriere cette fonctionnalite —
  # dix-sept a ce jour — que rien ne lancait. Aucune tache ne les couvrait :
  #   `test`                  : --features oaat, donc sans audio-embedding ;
  #   `test-shipped-features` : -p tune-server SEUL, donc pas tune-core ;
  #   ce job                  : `cargo check`, donc compilation sans execution.
  #
  # Le module entier est sous `#[cfg(feature = "audio-embedding")]`
  # (`audio/mod.rs`) : ces tests ne s'executaient donc QUE sur la machine de
  # celui qui pensait a passer la fonctionnalite a la main. Meme motif que
  # `test-shipped-features`, qui existe parce que neuf tests de greffons
  # echouaient en silence depuis la 0.9.61 (#1427).
  #
  # `provision_and_embed` est `#[ignore]` (il telecharge le modele) : il reste
  # hors de cette execution, comme avant.
  audio-embedding:
    name: Audio embedding feature
    needs: impact
    if: needs.impact.outputs.rust == 'true' && needs.impact.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # audio-embedding — ~5 min observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v0.9' }}
      # `audio-embedding` pulls audio crates (via ort/cpal deps) that link ALSA;
      # install it like the main build job does, or the compile-check fails on
      # `Package alsa was not found in the pkg-config`.
      - name: Install ALSA dev (retry — voir release.yml)
        timeout-minutes: 18
        run: |
          for essai in 1 2 3; do
            if timeout 100 sudo apt-get update && timeout 200 sudo apt-get install -y libasound2-dev; then
              exit 0
            fi
            echo "::warning::apt a echoue ou depasse le delai (essai $essai/3)"
            sudo rm -rf /var/lib/apt/lists/*
            sleep 20
          done
          echo "::error::apt injoignable apres 3 essais"
          exit 1
      - run: cargo check -p tune-server --features audio-embedding
      - run: cargo test --no-fail-fast -p tune-core --features audio-embedding

  # Signal Windows sur TOUTE PR qui touche du Rust — plus seulement sur une PR
  # « complete » (#3123).
  #
  # Ce que la condition `full` a coute, mesure : le commit 93186f81 (#3074)
  # appelait `rand_core::OsRng` depuis `tune-core/src/db/album_repo.rs`, du code
  # sans garde de plateforme, alors que `rand_core` n'est declare que sous
  # `[target.'cfg(unix)'.dependencies]`. Une PR vers `batch/*` ne porte pas
  # `full` : le defaut a traverse SA PROPRE PR, puis le lot, puis la RC sans
  # qu'aucune compilation Windows ne l'ait vu. La promotion `rc/v0.9.130 -> main`
  # (#3112) est la premiere a porter `full` : elle est partie rouge, et le train
  # de la 0.9.130 s'est arrete.
  #
  # Le cout est un `cargo check`, pas une matrice de livraison. Mesure sur les
  # executions du 01/09/2026 qui ont reellement lance ces deux jobs (#3112 et
  # les trois promotions rc/v0.9.130) : `windows-pr` 7 min 55 / 9 min 45 /
  # 10 min 20 / 10 min 34, `macos-pr` 3 min 19 / 5 min 19 / 5 min 22 / 6 min 08.
  # Les jobs sont paralleles : sur une PR de lot, le mur passe de ~5 min 40 (le
  # job `test`, le plus long aujourd'hui) a ~10 min 40, et `macos-pr` reste sous
  # le mur existant. Le depot est PUBLIC : ces minutes de runner ne sont pas
  # facturees.
  #
  # Deliberement PAS la piste « poser `ci:full` quand un Cargo.toml change » :
  # #3074 ne touchait aucun manifeste — la caisse etait deja declaree sous son
  # `cfg(unix)`, seul l'APPEL etait neuf. Ce garde-la n'aurait rien vu.
  windows-pr:
    name: Windows + ASIO (compilation PR)
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
          rustflags: ""
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          # Meme partition que le build de livraison : la PR restaure ses
          # dependances deja compilees, mais `save-if: false` l'empeche de
          # remplacer ce cache de confiance.
          key: x86_64-pc-windows-msvc
          save-if: false
      - name: Windows livré sans ASIO
        run: cargo check --package tune-server --target x86_64-pc-windows-msvc --no-default-features --features oaat,postgres,dj,karaoke,bandcamp,plugins-wasm
      - name: Download ASIO SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive -Path asiosdk.zip -DestinationPath asiosdk -Force
          $sdkDir = Get-ChildItem -Path asiosdk -Directory | Select-Object -First 1
          echo "CPAL_ASIO_DIR=$($sdkDir.FullName)" >> $env:GITHUB_ENV
      - name: ASIO
        run: cargo check --package tune-server --target x86_64-pc-windows-msvc --no-default-features --features oaat,local-audio,asio,postgres,dj,karaoke,bandcamp,plugins-wasm

  # Un seul ABI/configuration macOS suffit : les deux architectures partagent le
  # meme cfg Rust. Les deux vrais binaires restent construits au push, puis par
  # le workflow qui fabrique la release taguee.
  #
  # Arme sur toute PR qui touche du Rust, comme `windows-pr` ci-dessus (#3123).
  # `cfg(target_os = "macos")` est l'autre famille de code que Linux ne compile
  # jamais ; la laisser derriere `full` reproduirait exactement le trou de
  # #3074, une plateforme plus loin. Mesure : 3 min 19 a 6 min 08, donc sous le
  # mur deja pose par le job `test` — ce job n'allonge pas la PR.
  macos-pr:
    name: macOS (compilation PR)
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-apple-darwin
          save-if: false
      - run: cargo check --package tune-server --features dj,karaoke,bandcamp,plugins-wasm

  # Matrice de LIVRAISON : elle ne fabrique plus cinq artefacts jetables sur
  # chaque SHA de PR. Elle tourne sur chaque push de main/release (et en lancement
  # manuel), et demarre sans attendre le test Linux. Le workflow `release.yml`
  # reconstruit ensuite ses propres artefacts a partir du tag.
  build:
    name: Build ${{ matrix.target }}
    needs: impact
    if: github.event_name != 'pull_request' && needs.impact.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tune-server-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tune-server-linux-aarch64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: tune-server-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: tune-server-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: tune-server-windows-x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60  # build — 18 min au pire observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v0.9' }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --package tune-server --target ${{ matrix.target }} --no-default-features --features oaat,dj,karaoke,bandcamp,concerts,plugins-wasm

      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux' && !matrix.cross
        timeout-minutes: 18
        run: |
          # Les runners Ubuntu de GitHub ont deux fois bloque cette commande
          # indefiniment (0.9.86 : 6 h avant que le plafond ne tue le job et
          # emporte la release ; 0.9.87 : rebelote). apt n'a pas de delai par
          # defaut et githubstatus ne declare rien : sans garde-fou, une panne
          # de miroir passagere coute une version entiere.
          for essai in 1 2 3; do
            if timeout 100 sudo apt-get update && timeout 200 sudo apt-get install -y libasound2-dev; then
              echo "libasound2-dev installe (essai $essai)"
              exit 0
            fi
            echo "::warning::apt a echoue ou depasse le delai (essai $essai/3) — nouvel essai dans 20 s"
            sudo rm -rf /var/lib/apt/lists/*
            sleep 20
          done
          echo "::error::apt injoignable apres 3 essais — miroir Ubuntu probablement en panne"
          exit 1

      - name: Build (native, Linux with local-audio)
        if: "!matrix.cross && runner.os == 'Linux'"
        run: cargo build --release --package tune-server --target ${{ matrix.target }} --no-default-features --features oaat,local-audio,dj,karaoke,bandcamp,concerts,plugins-wasm,audio-embedding

      - name: Build (native, Windows)
        if: "!matrix.cross && runner.os == 'Windows'"
        run: cargo build --release --package tune-server --target ${{ matrix.target }} --no-default-features --features oaat,postgres,dj,karaoke,bandcamp,concerts,plugins-wasm

      # The `asio` feature (Windows-only, cfg(all(windows, feature="asio"))) is
      # NOT covered by the build above, so ASIO code compiled only at release
      # time — a compile error there (e.g. #803 ASIO stall guardrails) slipped
      # past PR CI and would only surface in the release build. Compile-check it
      # here with the ASIO SDK so the asio path is gated on every PR.
      - name: Download ASIO SDK (Windows)
        if: "!matrix.cross && runner.os == 'Windows'"
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive -Path asiosdk.zip -DestinationPath asiosdk -Force
          $sdkDir = Get-ChildItem -Path asiosdk -Directory | Select-Object -First 1
          echo "CPAL_ASIO_DIR=$($sdkDir.FullName)" >> $env:GITHUB_ENV

      - name: ASIO feature compile-check (Windows)
        if: "!matrix.cross && runner.os == 'Windows'"
        run: cargo check --package tune-server --target ${{ matrix.target }} --no-default-features --features oaat,local-audio,asio,postgres,dj,karaoke,bandcamp,plugins-wasm

      - name: Build (native, macOS with local-audio)
        if: "!matrix.cross && runner.os == 'macOS'"
        run: cargo build --release --package tune-server --target ${{ matrix.target }} --features dj,karaoke,bandcamp,concerts,plugins-wasm

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz tune-server
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip tune-server.exe
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 1
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  # La liste `--features` de cette porte est un INVENTAIRE, pas un echantillon :
  # avec `--no-default-features`, une feature absente d'ici n'est lue par AUCUN
  # lint. Le test `toute_feature_declaree_est_activee_par_une_porte_clippy`
  # (tune-server/tests/workflows_bornes.rs) refuse desormais toute feature
  # declaree qui n'y figure pas — ou qui n'est pas inscrite avec sa raison.
  #
  # Mesure du 31/08/2026 (#2865), avant cet elargissement — quatre features
  # nues : `local-audio` (16 fichiers, dont `outputs/local.rs` et ses 10 826
  # lignes), `postgres` (11), `audio-embedding` (3), `asio` (3).
  #
  # L'issue ne citait que `audio-embedding`. Le plus gros trou etait ailleurs :
  # `local-audio` est dans le `default` des deux crates, et c'est precisement
  # `--no-default-features` qui la retirait. Deux agents ont du relancer clippy
  # a la main sur `local.rs` dans la nuit du 30 au 31/08.
  #
  # `asio` reste dehors — `cpal/asio` ne se compile que sous Windows ; le job
  # `windows-pr` la couvre en `cargo check`.
  clippy:
    name: Clippy
    needs: impact
    if: needs.impact.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # clippy — 4 min observe (2 min avant #2865)
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v0.9' }}
      # `local-audio` tire cpal, qui lie ALSA : sans ce paquet la porte s'arrete
      # sur « Package alsa was not found in the pkg-config search path ».
      # Meme boucle de reprises que les autres jobs — cf release.yml.
      - name: Install ALSA dev (retry — voir release.yml)
        timeout-minutes: 18
        run: |
          for essai in 1 2 3; do
            if timeout 100 sudo apt-get update && timeout 200 sudo apt-get install -y libasound2-dev; then
              exit 0
            fi
            echo "::warning::apt a echoue ou depasse le delai (essai $essai/3)"
            sudo rm -rf /var/lib/apt/lists/*
            sleep 20
          done
          echo "::error::apt injoignable apres 3 essais"
          exit 1
      # UNION des deux cotes, jamais un camp. La liste des paquets et celle des
      # features sont deux inventaires, pas des echantillons (#2865) :
      #  - `-p tune-http-types` et `-p tune-smart-http` viennent de ce lot,
      #    deux caisses extraites ; les en sortir retirerait ce code de la
      #    porte en le decoupant — c'est precisement ce que cette porte a
      #    attrape apres la fusion precedente ;
      #  - `concerts` vient de `rc` (#2768, 12987dbd) ; l'en sortir rouvrirait
      #    l'angle mort que ce commit-la venait de fermer, et
      #    `toute_feature_declaree_est_activee_par_une_porte_clippy` rougirait.
      #
      # Croisement du 03/09/2026 sur `origin/main` (0f125653), AVANT cet
      # elargissement. C'est la SEULE ligne `cargo clippy` du depot :
      # `test-postgres.yml` et `widget-ci.yml` n'en portent aucune, et le
      # `cargo check` du job `ffi` n'est pas un lint.
      #
      # QUINZE membres, pas quatorze : `cargo metadata --no-deps` en compte
      # quinze. `tune-output-api` n'est pas dans la liste `members` — il y entre
      # tout seul, parce que `tune-core` le prend en dependance `path`, et que
      # cargo promeut membre toute dependance `path` interne au workspace. Lire
      # `members = [...]` seul le rate.
      #
      # Huit paquets etaient nommes ; sept ne l'etaient pas. Mais MESURE plutot
      # que suppose, le trou n'est pas la ou on le croyait : le code de
      # bibliotheque d'un membre TIRE par un `-p` est deja linte, parce que
      # cargo passe `clippy-driver` a tous les membres du workspace, pas aux
      # seuls `-p`. Preuve : la course a huit `-p` sort deja
      # `plugins/tune-bandcamp/src/lib.rs:175` et `plugins/tune-concerts/
      # src/lib.rs:295`. Ce qui restait vraiment dans le noir :
      #
      #   - `tune-ffi` en ENTIER : aucun membre n'en depend, donc il n'etait pas
      #     meme compile par cette porte ;
      #   - les cibles NON-lib des six autres — modules `#[cfg(test)]`, bancs,
      #     exemples : `--all-targets` ne construit ces cibles-la que pour les
      #     paquets designes par `-p`.
      #
      # Mesure du 03/09/2026, apres elargissement : ZERO avertissement
      # `clippy::correctness` sort des sept caisses neuves — la porte reste
      # verte. Deux avertissements apparaissent, tous deux dans `tune-ffi`
      # (`collapsible_if`, `field_reassign_with_default`), aucun n'est
      # `correctness`, donc aucun ne rougit.
      #
      # Cout mesure sur Shrek, dossier cible VIDE avant CHAQUE course, huit
      # courses a froid. Au seul moment calme de la soiree (charge 4) :
      # 156 s a huit `-p`, 162 s a quinze — six secondes, moins de 4 %. Les six
      # autres courses sont tombees sous la charge de deux autres agents et ne
      # separent rien : la MEME commande a huit `-p` a mis 156, 198, 247 puis
      # 327 s, quand celle a quinze mettait 162, 185, 193 et 234 s. Le cout de
      # l'elargissement est sous le plancher de bruit de la machine ; il n'est
      # pas mesurable, et surement pas de l'ordre de la minute.
      #
      # Meme famille que #1427 (greffons non compiles), #2865 (features nues) et
      # #3266 (caisses jamais executees) : une porte dont la portee est plus
      # etroite que ce qu'on croit rend un vert qui ne couvre pas ce qu'on pense.
      #
      # Garde : `toute_caisse_du_workspace_est_nommee_par_une_porte_clippy`
      # (tune-server/tests/workflows_bornes.rs).
      - run: cargo clippy -p tune-core -p tune-http-types -p tune-smart-http -p tune-stream-http -p tune-streaming-http -p tune-server -p tune-cli -p tune-bridge -p tune-ffi -p tune-output-api -p tune-plugin-runtime-wasm -p tune-dj -p tune-karaoke -p tune-bandcamp -p tune-concerts --all-targets --no-default-features --features oaat,cloud-relay,local-audio,postgres,audio-embedding,dj,karaoke,bandcamp,concerts,plugins-wasm -- -D clippy::correctness

  audit:
    name: Security Audit
    needs: impact
    if: needs.impact.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # audit — 10 s observe
    # Blocking: a security advisory must fail CI, not be swallowed. The wasmtime
    # advisories that forced continue-on-error are fixed (bump to 47.0.3).
    #
    # `denyWarnings: true` etend ce blocage aux avis INFORMATIFS (#2251). Par
    # defaut `cargo audit` affiche un `informational = "unmaintained"` puis sort
    # en 0 : mesure sur release/v0.9 (e608df16), « warning: 3 allowed warnings
    # found », code de sortie 0. RUSTSEC-2026-0150 (audiopus_sys abandonne) est
    # donc apparu le 21/05/2026 sans jamais rougir ici, alors meme que
    # `deny.toml` le connaissait deja. Un avis informatif ne peut plus arriver
    # en silence : soit il est corrige, soit il est inscrit dans la liste
    # ci-dessous AVEC sa raison et sa date.
    #
    # La liste doit rester identique a celle de `deny.toml` et de
    # `.cargo/audit.toml` (le preflight de release lance `cargo audit` nu, qui
    # ne lit que ce dernier). C'est precisement cette derive qui a rendu
    # RUSTSEC-2026-0150 invisible ; le test
    # `les_trois_listes_dexceptions_rustsec_sont_identiques` la refuse
    # desormais.
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1
        with:
          denyWarnings: true
          # Avis « unmaintained » sans correctif disponible, chacun justifie
          # dans .cargo/audit.toml : paste et instant, tous deux transitifs et
          # hors du chemin d'execution.
          #
          # RUSTSEC-2026-0150 (audiopus_sys) a quitte cette liste : la
          # dependance a ete remplacee par `opus` / `opusic-sys`, maintenus
          # (#2251). Il n'y a plus d'avis a taire.
          ignore: RUSTSEC-2024-0436,RUSTSEC-2024-0384

  ffi:
    name: FFI mobile (compilation)
    needs: impact
    if: needs.impact.outputs.rust == 'true'
    # `tune-ffi` prend `tune-server` en `default-features = false` : c'est la
    # SEULE configuration du depot ou la feature `oaat` est absente. Les sept
    # cibles de release.yml l'activent toutes, `cargo test --workspace` aussi.
    # Personne ne compilait donc cette combinaison.
    #
    # Resultat : b557a96f (reparation des durees MP3, livre en 0.9.93) a insere
    # sa fonction ENTRE un `#[cfg(feature = "oaat")]` et la fonction que cet
    # attribut protegeait. L'attribut s'est reporte sur la mauvaise, et
    # `spawn_mp3_duration_repair` a disparu de toute build sans `oaat`.
    # Le .so Android n'a plus compile pendant deux versions ; son propre
    # garde-fou (#1751) a refuse le tag, correctement, mais le signal n'est
    # jamais remonte jusqu'ici.
    #
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android
          cache-save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v0.9' }}
      # 16 et pas 6 : la boucle fait au pire 3 x (100 + 200) + 2 x 20 = 940 s.
      # A 6 min la marche se fait tuer PENDANT le deuxieme essai — on paie le
      # cout de la reprise sans en avoir le benefice, et le message d'erreur
      # final ne s'affiche meme pas. C'est ce qui a tue la 0.9.89 a 6 min 07.
      # `le_plafond_de_letape_apt_laisse_passer_les_trois_essais` le verifie —
      # et il lit les 400 premiers caracteres qui SUIVENT le `- name:`, donc ce
      # commentaire reste ici, au-dessus, ou il ne compte pas dans la fenetre.
      - name: Install ALSA dev
        timeout-minutes: 16
        run: |
          for essai in 1 2 3; do
            if timeout 100 sudo apt-get update && timeout 200 sudo apt-get install -y libasound2-dev; then
              echo "libasound2-dev installe (essai $essai)"
              exit 0
            fi
            echo "::warning::apt a echoue ou depasse le delai (essai $essai/3) — nouvel essai dans 20 s"
            sudo rm -rf /var/lib/apt/lists/*
            sleep 20
          done
          echo "::error::apt injoignable apres 3 essais — miroir Ubuntu probablement en panne"
          exit 1
      # RUSTFLAGS vide, deliberement. Ce job compile la SEULE configuration du
      # depot sans `oaat` ni les features par defaut, et cette configuration n'a
      # JAMAIS ete lintee : `-D warnings` y promeut en erreurs du code mort
      # (vivant ailleurs), des `mut` inutiles et des blocs `unsafe` superflus.
      # Au premier essai j'ai cru qu'un `-A dead_code` suffirait ; la fournee
      # suivante a rendu `unused_mut` et `unused_unsafe`. Chasser les lints un
      # par un revenait a bloquer toute la file de PR sur du bruit.
      #
      # Ce job s'appelle « compilation » et ne cherche que cela : la CASSE — le
      # E0425 qui a fige le moteur Android deux versions durant. Une erreur de
      # compilation reste une erreur sans `-D warnings` ; c'est exactement ce
      # qu'on veut attraper, et rien de plus. Les autres jobs gardent
      # `-D warnings` entier, donc les lints restent tenus la ou ils comptent.
      #
      # Nettoyer les lints de la configuration mobile est un chantier a part.
      - run: cargo check -p tune-ffi --all-targets
        env:
          RUSTFLAGS: ""
      # Le check hote ci-dessus ne compile pas les branches `cfg(android)`.
      # C'est ainsi que le `statfs.f_fstypename` reserve a Darwin a bloque les
      # .so Android de la 0.9.125 (#2780) sans rougir ici. Une seule ABI suffit
      # a tenir le contrat de compilation conditionnelle ; la release Flutter
      # construit ensuite les trois ABI.
      - name: Vérifier FFI Android ARM64
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ ! -d "$NDK" ]; then
            echo "::error::NDK Android introuvable sur le runner"
            exit 1
          fi
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_NDK_ROOT="$NDK"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          cargo check -p tune-ffi --target aarch64-linux-android
        env:
          RUSTFLAGS: ""

  # Check unique exige sur main. Les PR unitaires vers rc/* gardent le profil
  # rapide ; seule une RC peut atteindre main et elle doit rendre toute la
  # batterie complete ci-dessus en succes. PostgreSQL reste un required check
  # separe, porte par test-postgres.yml.
  release-gate:
    name: release-gate
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    needs:
      - impact
      - fmt
      - test
      - test-shipped-features
      - audio-embedding
      - windows-pr
      - macos-pr
      - clippy
      - audit
      - ffi
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuser une branche autre qu'une RC
        if: startsWith(github.head_ref, 'rc/') == false
        run: |
          echo "::error::main n'accepte que les promotions rc/*"
          exit 1

      - name: Refuser un job absent, ignore ou rouge
        if: >-
          needs.impact.result != 'success' ||
          needs.fmt.result != 'success' ||
          needs.test.result != 'success' ||
          needs.test-shipped-features.result != 'success' ||
          needs.audio-embedding.result != 'success' ||
          needs.windows-pr.result != 'success' ||
          needs.macos-pr.result != 'success' ||
          needs.clippy.result != 'success' ||
          needs.audit.result != 'success' ||
          needs.ffi.result != 'success'
        run: |
          echo "::error::la batterie complete n'est pas entierement verte"
          exit 1

      - name: Confirmer la promotion
        run: echo "RC verte, eligible a la promotion vers main"
