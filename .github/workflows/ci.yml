name: CI

on:
  push:
    # La ligne de release doit etre couverte comme main : c'est d'elle que
    # sortent les tags v0.9.x. Sans cela, une PR vers release/v0.9 n'etait
    # verifiee que par test-postgres.yml (seul workflow dont le trigger
    # pull_request n'a pas de filtre de branche) — donc ni fmt, ni clippy, ni
    # cargo test, ni compilation. Trois defauts sont passes ainsi le 8 aout
    # 2026 et n'ont ete revels qu'en construisant la branche elle-meme : un
    # test OAAT instable (#1358), une migration PG non declaree (#1364), et
    # l'incident #875 en juillet avait deja le meme mecanisme.
    branches: [main, release/v0.9]
  pull_request:
    branches: [main, release/v0.9]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15  # fmt — 27 s observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45  # test — 4 min observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p tune-core -p tune-server --no-default-features --features oaat

  # La CI validait `--features oaat` alors que les binaires publies embarquent
  # six fonctionnalites. Neuf tests de greffons echouaient donc en silence
  # depuis au moins la 0.9.61 : `dj_plugin.rs` est derriere
  # `#![cfg(feature = "dj")]`, jamais compile ici, et `plugin_routes.rs`
  # comptait les greffons en supposant qu'aucun n'etait compile (#1427).
  #
  # Ce job execute la suite avec LE JEU LIVRE. Sans lui, ces tests
  # redeviennent invisibles a la premiere occasion.
  test-shipped-features:
    name: Test (jeu de fonctionnalites livre)
    runs-on: ubuntu-latest
    timeout-minutes: 45  # test-shipped-features — ~5 min observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Meme dependance systeme que le job de build : sans elle, la compilation
      # s'arrete sur « Package alsa was not found in the pkg-config ».
      - name: Install ALSA dev (retry — voir release.yml)
        timeout-minutes: 18
        run: |
          for essai in 1 2 3; do
            if timeout 100 sudo apt-get update && timeout 200 sudo apt-get install -y libasound2-dev; then
              exit 0
            fi
            echo "::warning::apt a echoue ou depasse le delai (essai $essai/3)"
            sudo rm -rf /var/lib/apt/lists/*
            sleep 20
          done
          echo "::error::apt injoignable apres 3 essais"
          exit 1
      - run: cargo test -p tune-server --no-default-features --features oaat,local-audio,postgres,dj,karaoke,bandcamp,plugins-wasm,audio-embedding

  # The acoustic Smart Radio pulls `ort` (onnxruntime) behind the opt-in
  # `audio-embedding` feature, now shipped in the release + docker builds. This
  # job compile-checks it in isolation so a break surfaces on the PR rather than
  # only at release time. `load-dynamic` needs no onnxruntime binary at build.
  #
  # Il EXECUTE aussi les tests de `tune-core` derriere cette fonctionnalite —
  # dix-sept a ce jour — que rien ne lancait. Aucune tache ne les couvrait :
  #   `test`                  : --features oaat, donc sans audio-embedding ;
  #   `test-shipped-features` : -p tune-server SEUL, donc pas tune-core ;
  #   ce job                  : `cargo check`, donc compilation sans execution.
  #
  # Le module entier est sous `#[cfg(feature = "audio-embedding")]`
  # (`audio/mod.rs`) : ces tests ne s'executaient donc QUE sur la machine de
  # celui qui pensait a passer la fonctionnalite a la main. Meme motif que
  # `test-shipped-features`, qui existe parce que neuf tests de greffons
  # echouaient en silence depuis la 0.9.61 (#1427).
  #
  # `provision_and_embed` est `#[ignore]` (il telecharge le modele) : il reste
  # hors de cette execution, comme avant.
  audio-embedding:
    name: Audio embedding feature
    runs-on: ubuntu-latest
    timeout-minutes: 45  # audio-embedding — ~5 min observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `audio-embedding` pulls audio crates (via ort/cpal deps) that link ALSA;
      # install it like the main build job does, or the compile-check fails on
      # `Package alsa was not found in the pkg-config`.
      - name: Install ALSA dev (retry — voir release.yml)
        timeout-minutes: 18
        run: |
          for essai in 1 2 3; do
            if timeout 100 sudo apt-get update && timeout 200 sudo apt-get install -y libasound2-dev; then
              exit 0
            fi
            echo "::warning::apt a echoue ou depasse le delai (essai $essai/3)"
            sudo rm -rf /var/lib/apt/lists/*
            sleep 20
          done
          echo "::error::apt injoignable apres 3 essais"
          exit 1
      - run: cargo check -p tune-server --features audio-embedding
      - run: cargo test -p tune-core --features audio-embedding

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tune-server-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tune-server-linux-aarch64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: tune-server-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: tune-server-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: tune-server-windows-x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60  # build — 18 min au pire observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --package tune-server --target ${{ matrix.target }} --no-default-features --features oaat,dj,karaoke,bandcamp,plugins-wasm

      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux' && !matrix.cross
        timeout-minutes: 18
        run: |
          # Les runners Ubuntu de GitHub ont deux fois bloque cette commande
          # indefiniment (0.9.86 : 6 h avant que le plafond ne tue le job et
          # emporte la release ; 0.9.87 : rebelote). apt n'a pas de delai par
          # defaut et githubstatus ne declare rien : sans garde-fou, une panne
          # de miroir passagere coute une version entiere.
          for essai in 1 2 3; do
            if timeout 100 sudo apt-get update && timeout 200 sudo apt-get install -y libasound2-dev; then
              echo "libasound2-dev installe (essai $essai)"
              exit 0
            fi
            echo "::warning::apt a echoue ou depasse le delai (essai $essai/3) — nouvel essai dans 20 s"
            sudo rm -rf /var/lib/apt/lists/*
            sleep 20
          done
          echo "::error::apt injoignable apres 3 essais — miroir Ubuntu probablement en panne"
          exit 1

      - name: Build (native, Linux with local-audio)
        if: "!matrix.cross && runner.os == 'Linux'"
        run: cargo build --release --package tune-server --target ${{ matrix.target }} --no-default-features --features oaat,local-audio,dj,karaoke,bandcamp,plugins-wasm,audio-embedding

      - name: Build (native, Windows)
        if: "!matrix.cross && runner.os == 'Windows'"
        run: cargo build --release --package tune-server --target ${{ matrix.target }} --no-default-features --features oaat,postgres,dj,karaoke,bandcamp,plugins-wasm

      # The `asio` feature (Windows-only, cfg(all(windows, feature="asio"))) is
      # NOT covered by the build above, so ASIO code compiled only at release
      # time — a compile error there (e.g. #803 ASIO stall guardrails) slipped
      # past PR CI and would only surface in the release build. Compile-check it
      # here with the ASIO SDK so the asio path is gated on every PR.
      - name: Download ASIO SDK (Windows)
        if: "!matrix.cross && runner.os == 'Windows'"
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive -Path asiosdk.zip -DestinationPath asiosdk -Force
          $sdkDir = Get-ChildItem -Path asiosdk -Directory | Select-Object -First 1
          echo "CPAL_ASIO_DIR=$($sdkDir.FullName)" >> $env:GITHUB_ENV

      - name: ASIO feature compile-check (Windows)
        if: "!matrix.cross && runner.os == 'Windows'"
        run: cargo check --package tune-server --target ${{ matrix.target }} --no-default-features --features oaat,local-audio,asio,postgres,dj,karaoke,bandcamp,plugins-wasm

      - name: Build (native, macOS with local-audio)
        if: "!matrix.cross && runner.os == 'macOS'"
        run: cargo build --release --package tune-server --target ${{ matrix.target }} --features dj,karaoke,bandcamp,plugins-wasm

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz tune-server
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip tune-server.exe
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 1
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  test-postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # test-postgres — 4 min observe

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tune
          POSTGRES_PASSWORD: tune
          POSTGRES_DB: tune_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tune -d tune_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://tune:tune@localhost:5432/tune_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tune-core-postgres
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests with postgres feature
        run: cargo test -p tune-core --no-default-features --features postgres,oaat

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30  # clippy — 2 min observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p tune-core -p tune-server --all-targets --no-default-features --features oaat,dj,karaoke,bandcamp,plugins-wasm -- -D clippy::correctness

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15  # audit — 10 s observe
    # Blocking: a security advisory must fail CI, not be swallowed. The wasmtime
    # advisories that forced continue-on-error are fixed (bump to 47.0.3).
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1
        with:
          # Only the unmaintained-warning advisories with no available fix are
          # ignored (paste, instant — transitive, no runtime path). Kept in sync
          # with deny.toml. Every vulnerability, wasmtime included, now blocks.
          ignore: RUSTSEC-2024-0436,RUSTSEC-2024-0384

  widget:
    name: Widget (compilation)
    # tune-widget echappait a TOUT filet : le Cargo.toml racine l'exclut du
    # workspace (exclusion voulue — sans elle, cargo fmt --all remonte les deps
    # GUI/webkit et casse la CI Linux headless), et widget.yml ne se declenche
    # que sur un tag widget-v*. Aucun tag de ce genre n'ayant jamais existe, ce
    # workflow n'avait jamais tourne : au premier tag, le 12 aout 2026, il a
    # echoue des l'installation du CLI Tauri sur une rouille invisible depuis
    # des mois. Ce job compile le widget a chaque PR pour que le prochain tag
    # ne soit plus le premier essai.
    #
    # macOS et pas ubuntu : le widget ne livre que des DMG (cf la matrice de
    # widget.yml), et Tauri y compile sans les paquets webkit d'apt.
    runs-on: macos-latest
    timeout-minutes: 30  # widget — 4 min observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tune-widget/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --release
        working-directory: tune-widget/src-tauri
      # Le widget porte des tests unitaires depuis le seuil de disposition mini
      # (`parse_version`), mais personne ne les executait : `cargo test` a la
      # racine ne voit pas une crate exclue du workspace. Ils passaient donc
      # pour verifies sans l'avoir jamais ete.
      - run: cargo test
        working-directory: tune-widget/src-tauri
