name: Paquet Debian (.deb)

# Ce workflow est DÉLIBÉRÉMENT séparé de release.yml.
#
# release.yml est le cœur du train de publication : il construit, signe,
# notarise et publie treize artefacts. Y greffer l'empaquetage Debian aurait
# fait porter à toute la release le risque d'un `dpkg-deb` qui échoue. Ici,
# le .deb se construit APRÈS coup, à partir des archives déjà publiées : si ce
# workflow tombe, la release reste intacte et le paquet se rejoue seul par
# `workflow_dispatch`.
#
# Corollaire : le .deb n'apparaît pas dans SHA256SUMS (produit par release.yml
# avant que ce workflow existe). Il porte son propre SHA256SUMS.deb.

on:
  # ⚠️ CE DÉCLENCHEUR N'A JAMAIS TIRÉ, ET NE TIRERA PAS DEPUIS LE TRAIN.
  # GitHub ne déclenche aucun workflow depuis un événement produit avec le
  # `GITHUB_TOKEN` par défaut (anti-récursion) — or c'est bien ce jeton qui
  # publie la release, dans `promote-release.yml`. Mesuré : aucun run `release`
  # dans tout l'historique de deb.yml, jamais. Le paquet partait donc à la main
  # après chaque promotion, quand quelqu'un y pensait.
  #
  # On le GARDE quand même : il tire si un humain publie la release depuis
  # l'interface web. Ce qui rend le paquet automatique, c'est `workflow_call`
  # ci-dessous — la promotion appelle ce workflow dans SON PROPRE run, où
  # aucune règle d'anti-récursion ne s'applique.
  release:
    types: [published]

  # Appelé par `promote-release.yml`, juste après le basculement de la release
  # en public. C'est le chemin qui remplace le déclencheur mort ci-dessus.
  workflow_call:
    inputs:
      tag:
        description: "Tag de release (ex. v0.9.126)"
        required: true
        type: string
      publish:
        description: "Attacher les .deb à la release"
        required: false
        default: true
        type: boolean

  # Rejeu manuel sur n'importe quel tag déjà publié.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release (ex. v0.9.126)"
        required: true
        type: string
      publish:
        description: "Attacher les .deb à la release"
        required: false
        default: true
        type: boolean

  # Sur une PR qui touche la recette : on construit ET on installe pour de
  # vrai, sans rien publier. C'est la contre-épreuve du paquet.
  pull_request:
    paths:
      - "packaging/deb/**"
      - "scripts/build-deb.sh"
      - "scripts/attacher-deb-release.sh"
      - ".github/workflows/deb.yml"

permissions:
  contents: write

jobs:
  build:
    name: Construire le .deb (${{ matrix.arch }})
    # ubuntu-22.04 comme release.yml : le paquet doit être fabriqué sur la même
    # base que les binaires qu'il contient, sinon les hypothèses de
    # compatibilité (glibc 2.35) ne sont plus vérifiables ici.
    runs-on: ubuntu-22.04
    # Un job sans plafond tourne SIX HEURES avant que GitHub ne le tue. Ce
    # workflow fait maintenant partie du train (appelé par la promotion) : un
    # `apt-get` qui pend y bloquerait la publication du paquet toute une
    # après-midi. Cf. tune-server/tests/workflows_bornes.rs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux-x86_64
          - arch: arm64
            platform: linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer le tag source
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ⚠️ Appelé par `uses:` depuis promote-release.yml, `github.event_name`
          # est celui du workflow APPELANT (`workflow_dispatch` de la
          # promotion), jamais `workflow_call`. On ne s'y fie donc que pour
          # distinguer les deux cas qui n'ont pas d'entrée `tag` : la release
          # publiée à la main, et la PR. Partout ailleurs, le tag est une
          # ENTRÉE explicite — dispatch manuel comme appel par la promotion.
          case "${{ github.event_name }}" in
            release)      TAG="${{ github.event.release.tag_name }}" ;;
            pull_request)
              # Sur une PR il n'y a pas de tag associé : on prend la dernière
              # release publiée. On ne teste alors pas « ce commit », on teste
              # la RECETTE — c'est bien ce que la PR modifie.
              TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
              ;;
            *)            TAG="${{ inputs.tag }}" ;;
          esac
          [ -n "$TAG" ] || { echo "::error::aucun tag source : entrée 'tag' vide"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "--- source : ${TAG} ---"

      - name: Télécharger l'archive Linux publiée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "tune-server-${{ steps.tag.outputs.tag }}-${{ matrix.platform }}.tar.gz" \
            --dir dist
          ls -la dist

      - name: Construire le paquet
        run: |
          set -euo pipefail
          scripts/build-deb.sh \
            --tarball "dist/tune-server-${{ steps.tag.outputs.tag }}-${{ matrix.platform }}.tar.gz" \
            --version "${{ steps.tag.outputs.version }}" \
            --arch "${{ matrix.arch }}" \
            --outdir dist

      - name: Contenu du paquet
        run: |
          set -euo pipefail
          DEB="dist/tune-server_${{ steps.tag.outputs.version }}_${{ matrix.arch }}.deb"
          echo "::group::control"
          dpkg-deb --info "$DEB"
          echo "::endgroup::"
          # La liste est écrite dans un fichier avant d'être filtrée : un
          # `dpkg-deb --contents | grep -q` ferme le tube dès la première
          # correspondance, tar prend un SIGPIPE, et `pipefail` fait échouer
          # l'étape alors que le paquet est parfaitement valide.
          dpkg-deb --contents "$DEB" > contents.txt
          echo "::group::contenu"
          cat contents.txt
          echo "::endgroup::"
          # Garde : un paquet sans binaire, sans unité systemd ou sans client
          # web s'installe très bien et ne sert à rien. On refuse ici.
          for required in ./opt/tune/tune-server ./opt/tune/web/index.html \
                          ./lib/systemd/system/tune-server.service \
                          ./etc/default/tune-server ./usr/bin/tune-server; do
            # Le chemin est suivi soit d'une fin de ligne, soit de la cible du
            # lien symbolique (`./usr/bin/tune-server -> /opt/tune/tune-server`).
            grep -qE " ${required}( ->.*)?\$" contents.txt \
              || { echo "::error::absent du paquet : ${required}"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          retention-days: 7

  verify-install:
    name: Installer et démarrer (amd64)
    needs: build
    # Un runner GitHub est une VM complète avec un vrai systemd : l'unité est
    # réellement chargée, démarrée, et le serveur répond. Une simple extraction
    # `dpkg-deb -x` ne prouverait rien de tout ça.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: dist

      - name: apt install
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # `apt-get install ./fichier.deb` résout les dépendances déclarées,
          # là où `dpkg -i` les laisserait manquantes. C'est la commande que
          # l'utilisateur tapera.
          sudo apt-get install -y ./dist/tune-server_*_amd64.deb

      - name: Le paquet a posé ce qu'il annonce
        run: |
          set -euo pipefail
          dpkg -L tune-server
          test -x /opt/tune/tune-server
          test -f /opt/tune/web/index.html
          test -L /usr/bin/tune-server
          test -f /etc/default/tune-server
          getent passwd tune
          id tune | grep -q audio
          # /opt/tune doit appartenir à `tune` : c'est ce qui permet à la mise
          # à jour intégrée de réécrire son propre binaire.
          test "$(stat -c %U /opt/tune/tune-server)" = tune
          test "$(stat -c %U /var/lib/tune)" = tune

      - name: L'unité est activée, valide et le service tourne
        run: |
          set -euo pipefail
          systemd-analyze verify /lib/systemd/system/tune-server.service
          systemctl is-enabled tune-server
          for i in $(seq 1 30); do
            if systemctl is-active --quiet tune-server; then break; fi
            sleep 1
          done
          systemctl is-active tune-server
          systemctl show tune-server -p User -p WorkingDirectory -p AmbientCapabilities

      - name: Le serveur répond
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8888/api/v1/system/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8888/api/v1/system/health
          echo
          curl -fsS http://127.0.0.1:8888/api/v1/system/version
          echo
          # Le client web est bien servi depuis /opt/tune/web.
          curl -fsS http://127.0.0.1:8888/ | head -c 200
          echo

      - name: Journal du service (pour diagnostic)
        if: always()
        run: sudo journalctl -u tune-server --no-pager -n 80 || true

      - name: apt purge — /opt/tune part, les données restent
        run: |
          set -euo pipefail
          sudo apt-get purge -y tune-server
          test ! -e /opt/tune || { echo "::error::/opt/tune survit au purge"; exit 1; }
          test ! -e /lib/systemd/system/tune-server.service
          test ! -e /etc/default/tune-server
          # Décision assumée (cf. packaging/deb/postrm) : la bibliothèque
          # indexée n'est JAMAIS effacée par un purge.
          test -d /var/lib/tune || { echo "::error::/var/lib/tune effacé par le purge"; exit 1; }
          ! systemctl is-active --quiet tune-server

  publish:
    name: Attacher les .deb à la release
    needs: [build, verify-install]
    # Jamais depuis une PR — c'est la seule chose que cette condition garde.
    # `inputs.publish` couvre le rejeu manuel COMME l'appel par la promotion :
    # sous `workflow_call`, `github.event_name` reste celui de l'appelant, on
    # ne peut donc pas le nommer ici.
    if: >-
      github.event_name == 'release' ||
      (github.event_name != 'pull_request' && inputs.publish)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # L'envoi passe par `scripts/attacher-deb-release.sh` : sans checkout, le
      # script n'existe pas dans ce job.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: Sommes de contrôle
        run: |
          set -euo pipefail
          cd dist
          # ⚠️ `./*.deb` est développé AVANT que la redirection ne crée
          # SHA256SUMS.deb : le fichier ne se liste donc pas lui-même. Le
          # `-not -name` explicite dirait la même chose ; ce commentaire évite
          # qu'on « corrige » un jour ce qui marche.
          sha256sum ./*.deb > SHA256SUMS.deb
          cat SHA256SUMS.deb

      - name: Envoi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          # Un fichier à la fois, les empreintes en dernier, et le verdict rendu
          # par l'inventaire de la release — pas par le code de sortie de `gh`.
          #
          # L'envoi unique d'avant nommait SHA256SUMS.deb DEUX FOIS (le glob
          # `dist/*.deb` le couvre déjà), d'où le `HTTP 404` du run 33536592140,
          # et il l'envoyait EN PREMIER, avant les paquets qu'il annonce. Au
          # premier passage de la v0.9.130, `amd64` manquait alors que
          # SHA256SUMS.deb, publié, le listait.
          #
          # Le détail et les contre-épreuves sont dans le script (`--autotest`).
          bash scripts/attacher-deb-release.sh "$TAG" dist
