name: Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version sans le prefixe v
        required: true
        type: string
      publish:
        description: Publier les tags Docker versionne et latest
        required: true
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: renesenses/tune
  TUNE_VERSION: ${{ inputs.version }}

jobs:
  build-and-push:
    name: Build & Push (multi-arch)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verifier la ref et lire le manifeste
        id: train
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"
          [ "$GITHUB_REF" = "refs/tags/v$VERSION" ] || {
            echo "::error::ce workflow doit etre lance sur refs/tags/v$VERSION"
            exit 1
          }
          PLAN=".release/v$VERSION.json"
          test -f "$PLAN" || { echo "::error::manifeste absent: $PLAN"; exit 1; }
          WEB_SHA="$(jq -r '.components.web.sha' "$PLAN")"
          [[ "$WEB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA web invalide"; exit 1; }
          {
            echo "version=v$VERSION"
            echo "web_sha=$WEB_SHA"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: renesenses/tune-web-client
          ref: ${{ steps.train.outputs.web_sha }}
          path: _web

      # Compile the binaries on the host, not inside an emulated arm64 image:
      # amd64 native + arm64 via `cross` (same proven path as release.yml). QEMU
      # is only needed for the light apt/pip runtime steps in Dockerfile.dist.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-gnu
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: docker-multiarch
      - name: Install cross
        uses: taiki-e/install-action@cross

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build web client
        run: |
          cd _web && npm ci && npm run build && cd ..
          rm -rf web && mv _web/dist web
          rm -rf _web

      # tune-server: same feature set as the previous container image (SQLite,
      # no local-audio — a container has no sound card).
      #
      # The amd64 build uses a SEPARATE target dir. Otherwise it writes the
      # host build-script binaries (linked against ubuntu-22.04 glibc 2.35) into
      # the shared target/, and the arm64 `cross` build — which runs inside an
      # older-glibc container — then tries to run those and dies with
      # "GLIBC_2.xx not found". release.yml avoids this by building each arch in
      # a separate job; we build both in one job, so isolate the target dirs.
      - name: Build tune-server (amd64, native)
        env:
          CARGO_TARGET_DIR: target-amd64
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          cargo build --release --package tune-server --no-default-features --features oaat,dj,karaoke,plugins-wasm,audio-embedding
          mkdir -p dist/amd64 && cp target-amd64/release/tune-server dist/amd64/tune-server

      # Party (WASM) plugin — arch-independent, staged once and COPYied into the
      # image next to /app/tune-server so the plugins-wasm runtime loads it.
      # Sourced from the committed fixture; the wasm is not rebuilt.
      - name: Stage Party plugin (WASM)
        run: |
          mkdir -p dist/plugins/party
          cp tune-server/tests/fixtures/plugins/party/main.wasm dist/plugins/party/
          cp tune-server/tests/fixtures/plugins/party/manifest.json dist/plugins/party/

      - name: Build tune-server (arm64, cross)
        run: |
          cross build --release --package tune-server \
            --target aarch64-unknown-linux-gnu --no-default-features --features oaat,dj,karaoke,plugins-wasm,audio-embedding
          mkdir -p dist/arm64 && cp target/aarch64-unknown-linux-gnu/release/tune-server dist/arm64/tune-server

      # librespot (Spotify Connect): real binary on amd64, empty placeholder on
      # arm64 (best-effort — the previous image also fell back to an empty file).
      - name: Build librespot (amd64)
        run: |
          if cargo install librespot --no-default-features --features alsa-backend --root /tmp/lr; then
            cp /tmp/lr/bin/librespot dist/amd64/librespot
          else
            touch dist/amd64/librespot
          fi
          touch dist/arm64/librespot

      # airplay-daemon (AirPlay 2 sender): real binary on amd64, empty placeholder
      # on arm64 for now (AirPlay 2 falls back to legacy AirPlay 1 there). Fixes
      # #700 — without this the Docker image has no AirPlay 2 path, so AirPlay-2-
      # only speakers (Devialet Phantom) got no sound. GPL-2.0, built from a pinned
      # rev of our fork and shipped as a standalone subprocess binary (mere
      # aggregation). amd64 is a HARD requirement: if it fails to build, the
      # release fails loudly rather than silently shipping a placeholder.
      - name: Build airplay-daemon (amd64)
        run: |
          # Le `sudo apt-get update` NON BORNE qui precedait la boucle annulait
          # tout le garde-fou : si le miroir pend, on pend la, avant d'avoir
          # arme le moindre `timeout`. La boucle fait deja l'update, bornee.
          for essai in 1 2 3; do
            if timeout 100 sudo apt-get update && timeout 200 sudo apt-get install -y --no-install-recommends cmake clang libasound2-dev pkg-config; then
              break
            fi
            if [ "$essai" = "3" ]; then
              echo "::error::apt injoignable apres 3 essais"
              exit 1
            fi
            echo "::warning::apt a echoue ou depasse le delai (essai $essai/3)"
            sudo rm -rf /var/lib/apt/lists/*
            sleep 20
          done
          cargo install --git https://github.com/renesenses/airplay2-rs \
            --rev a7d7ad6637507eaedd61de7461574adfb7b0a987 \
            airplay-daemon --root /tmp/ap --locked
          cp /tmp/ap/bin/airplay-daemon dist/amd64/airplay-daemon
          touch dist/arm64/airplay-daemon

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.train.outputs.version }}
            ${{ !contains(github.ref_name, '-') && format('{0}:latest', env.IMAGE_NAME) || '' }}
          labels: |
            org.opencontainers.image.title=Tune Server
            org.opencontainers.image.description=Music server for audiophiles — DLNA, Chromecast, streaming services
            org.opencontainers.image.vendor=Mozaik Labs
            org.opencontainers.image.source=https://github.com/renesenses/tune-server-rust
            org.opencontainers.image.version=${{ steps.train.outputs.version }}
          cache-from: type=gha,scope=docker-v2
          cache-to: type=gha,scope=docker-v2,mode=max
