name: Moissonneur Roon

# Construit `moissonneur-roon` (tools/moissonneur-roon, HORS workspace — il
# garde son propre Cargo.lock) et publie ses archives sur SA PROPRE release,
# `moissonneur-<tag>` — jamais sur celle du serveur (voir le travail `publish`).
#
# Il tourne à côté du Core Roon, pas de Tune : c'est un outil du testeur, pas
# une pièce du serveur. D'où un workflow à part, qui ne touche ni au train
# (`release.yml`) ni à ses gardes.
#
# Il ne touche plus à la release du serveur : il n'a donc plus à en attendre le
# brouillon (`release.yml`, ~30 min). Sa propre release naît ici, tout de suite.
#
# Signature macOS : Developer ID + runtime durci + horodatage, avec les mêmes
# secrets que l'archive `tune-server` de `release.yml`. Comme cette archive-là,
# le binaire n'est PAS notarisé : un binaire nu téléchargé par un navigateur
# garde l'attribut de quarantaine (`xattr -d com.apple.quarantine`, voir
# docs/pont-roon.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release où attacher les archives (vide = artefacts du run seulement)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: moissonneur-roon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Moissonneur ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            platform: macos-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            platform: macos-x86_64
          # musl : binaire statique, aucune dépendance glibc (NAS, vieilles distributions).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            platform: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # Moissonneur ${{ matrix.platform }} — ~1 min de compilation
    env:
      ARCHIVE: moissonneur-roon-${{ inputs.tag || github.ref_name }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/moissonneur-roon
          key: moissonneur-${{ matrix.target }}

      - name: Outils musl
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        run: cargo build --release --locked --manifest-path tools/moissonneur-roon/Cargo.toml --target ${{ matrix.target }}

      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then echo "No certificate, skipping"; exit 0; fi
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm /tmp/certificate.p12

      - name: Package
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          SORTIE=tools/moissonneur-roon/target/${{ matrix.target }}/release
          mkdir -p package
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$SORTIE/moissonneur-roon.exe" package/
            cp docs/pont-roon.md package/
            7z a "$ARCHIVE.zip" ./package/*
            echo "FICHIER=$ARCHIVE.zip" >> "$GITHUB_ENV"
            exit 0
          fi
          cp "$SORTIE/moissonneur-roon" package/
          cp docs/pont-roon.md package/
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_TEAM_ID" ]; then
            IDENTITY="Developer ID Application: Bertrand Clech ($APPLE_TEAM_ID)"
            # Même reprise que release.yml : sans réponse du serveur
            # d'horodatage, codesign rend 0 sans horodatage et --verify rejette.
            ok=0
            for i in 1 2 3 4 5; do
              if codesign --force --options runtime --timestamp \
                   --identifier fr.mozaiklabs.moissonneur-roon \
                   --sign "$IDENTITY" package/moissonneur-roon \
                 && codesign --verify --strict --verbose=2 package/moissonneur-roon; then
                ok=1; break
              fi
              echo "::warning::codesign a echoue (essai $i/5) — nouvelle tentative dans $((i * 15)) s"
              sleep $((i * 15))
            done
            [ "$ok" = 1 ] || { echo "::error::codesign a echoue 5 fois"; exit 1; }
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "::warning::APPLE_TEAM_ID absent — binaire macOS signé ad hoc seulement."
          fi
          tar -czf "$ARCHIVE.tar.gz" -C package .
          echo "FICHIER=$ARCHIVE.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.FICHIER }}
          if-no-files-found: error

  publish:
    name: Publier le moissonneur
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: moissonneur-roon-*
          path: archives
          merge-multiple: true
      # 🔴 SA PROPRE release, plus jamais celle du serveur.
      #
      # FabienM, 17/09/2026 : « la 153 ne s'installe pas sur mon serveur
      # Linux ». Pour se mettre à jour, le serveur retient le PREMIER fichier
      # de la release qui porte son système et son architecture — et GitHub les
      # rend par ordre alphabétique. `moissonneur-roon-v0.9.153-linux-x86_64.tar.gz`
      # (2,6 Mo) passait donc devant `tune-server-v0.9.153-linux-x86_64.tar.gz`
      # (43 Mo). L'installation échouait à la vérification de signature — le
      # moissonneur n'est pas dans `SHA256SUMS` —, et c'est cette garde qui a
      # évité que Tune se remplace par un outil qui n'est pas lui.
      #
      # Les CINQ archives couvraient linux x86_64 et aarch64, macOS arm64 et
      # x86_64, Windows : toutes les plateformes étaient touchées, et les
      # serveurs DÉJÀ installés le restaient — leur binaire lit la release
      # telle qu'elle est publiée. Le filtre posé côté serveur (l'archive doit
      # s'appeler `tune-server…`) ne protège que les versions à venir : la
      # séparation des releases, elle, protège tout le monde tout de suite.
      #
      # Le tag `moissonneur-<tag serveur>` est neuf à chaque version, ne porte
      # aucun fichier `tune-server*`, et n'est donc jamais consulté par un
      # serveur qui cherche sa mise à jour.
      - name: Publier sur la release du moissonneur
        run: |
          ls -l archives
          RELEASE="moissonneur-$TAG"
          if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" \
              --title "Moissonneur Roon $TAG" \
              --notes "Outil du testeur, publié à part du serveur : une archive \`moissonneur-roon-*\` sur la release de Tune était prise pour l'archive du serveur par la mise à jour automatique (17/09/2026)." \
              --latest=false
          fi
          gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" --clobber archives/*
      # Garde : la release du SERVEUR ne doit porter aucune archive du
      # moissonneur. Un `upload` égaré s'y verrait immédiatement.
      - name: Vérifier que la release du serveur est intacte
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
               --jq '[.assets[].name] | .[]' 2>/dev/null | grep -q '^moissonneur-roon-'; then
            echo "::error::la release $TAG porte des archives du moissonneur — la mise à jour automatique des serveurs installés choisira la mauvaise"
            exit 1
          fi
          echo "release $TAG : aucune archive du moissonneur"

