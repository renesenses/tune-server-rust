name: Notes de version Watch — versions publiees sans fil forum

# Surveille qu'une version publiee sur GitHub finit par avoir son fil de notes
# sur le forum mozaiklabs, et ouvre une issue quand ce n'est pas le cas.
#
# Pourquoi (#2328) : le job « Announce on mozaiklabs forum » de `release.yml` est
# eteint par `if: false` depuis le 03/06/2026, deliberement — les notes du forum
# sont ecrites a la main, mieux redigees que le changelog de git-cliff. Le choix
# tient ; ce qui manquait, c'est le filet. Rien ne signalait qu'une version etait
# sortie sans annonce : le job saute, la CI est verte, et le premier a s'en
# apercevoir etait un testeur — qui a annonce le 24/08/2026 qu'il n'utiliserait
# plus la mise a jour integree faute de savoir ce qu'il installait.
#
# Cette sonde ne poste RIEN sur le forum. Elle constate, et elle echoue
# bruyamment. La redaction reste humaine.
#
# Secrets utilises :
# - FORUM_TOKEN : jeton bearer de l'API forum mozaiklabs

on:
  schedule:
    # Toutes les heures a la 25e minute — decale de `forum-watch` (*/30) et de
    # `uptime-watch` (*/15) pour ne pas concourir avec eux sur l'API forum.
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      delai_de_grace_minutes:
        description: "Age minimal d'une version avant de la signaler (minutes)"
        type: string
        default: "90"
      sans_issue:
        description: "Diagnostic seul — n'ouvre aucune issue"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/scripts/notes-de-version-watch.sh"
      - ".github/scripts/forme-des-notes.awk"
      - "scripts/test-notes-de-version-watch.sh"
      - "scripts/test-forme-des-notes.sh"
      - ".github/workflows/notes-de-version-watch.yml"
      # Le lecteur awk est une copie gardee de `parse_release_body` : une
      # retouche du Rust doit rejouer la comparaison des tables.
      - "tune-server/src/routes/system/update.rs"

permissions:
  contents: read
  issues: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # La contre-épreuve (#4461). Le périmètre de la sonde — les versions de Tune,
  # pas les releases du moissonneur Roon — est une règle qu'on ne voit pas
  # tenir : elle se démontre en regardant la sonde se taire sur un tag
  # `moissonneur-*` ET rougir, dans le même décor, sur un `v0.9.x` sans fil.
  # Sans cette seconde moitié, un filtre trop large passerait pour un succès.
  # ───────────────────────────────────────────────────────────────────────────
  contre-epreuve:
    name: Contre-épreuve du périmètre
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rejouer le décor du 20/09/2026
        run: bash scripts/test-notes-de-version-watch.sh

  # ───────────────────────────────────────────────────────────────────────────
  # La contre-épreuve de la FORME (#4190). Un fil qui existe ne prouve pas
  # qu'on y lit quelque chose : le 23/09/2026, les vingt entrées du panneau de
  # mise à jour étaient réduites à « Release 0.9.x », toutes annoncées, toutes
  # vertes pour la sonde. Le banc montre le rouge sur une note en prose et le
  # vert sur la même note en puces — même décor, même fil, seul le corps
  # change — et vérifie que les tables de mots-clés du lecteur `awk` n'ont pas
  # dérivé de celles du serveur.
  # ───────────────────────────────────────────────────────────────────────────
  forme:
    name: Contre-épreuve de la forme des notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prose refusée, puces acceptées
        run: bash scripts/test-forme-des-notes.sh

  veille:
    name: Versions publiees sans note de version
    # Sur une PR, seule la contre-épreuve a un sens : le forum réel n'a pas
    # changé, et une lacune préexistante ferait échouer une PR qui n'y est pour
    # rien. La veille garde ses déclencheurs d'origine.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rapprocher les versions publiees et les fils de notes
        env:
          FORUM_TOKEN: ${{ secrets.FORUM_TOKEN }}
          # `GITHUB_REPOSITORY` est deja fourni par Actions — le redefinir ici
          # serait au mieux redondant, au pire refuse.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELAI_DE_GRACE_MINUTES: ${{ inputs.delai_de_grace_minutes || '90' }}
          SANS_ISSUE: ${{ inputs.sans_issue && '1' || '0' }}
        run: bash .github/scripts/notes-de-version-watch.sh
