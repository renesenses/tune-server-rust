name: Plugin SDK contracts

on:
  pull_request:
    paths:
      - 'sdk/**'
      - 'docs/plugins/premium-sdk*'
      - '.github/workflows/plugin-sdk.yml'
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'docs/plugins/premium-sdk*'
      - '.github/workflows/plugin-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: SDK source contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/sdk/target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cargo fmt --manifest-path sdk/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path sdk/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path sdk/Cargo.toml --workspace --locked
      - run: cargo build --manifest-path sdk/Cargo.toml -p cargo-tune-plugin --locked
      - name: External projects and actual generated tests
        shell: bash
        run: |
          binary="$CARGO_TARGET_DIR/debug/cargo-tune-plugin"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          python sdk/scripts/verify_scaffolding.py --binary "$binary"
      - run: python sdk/scripts/verify_matrix.py
