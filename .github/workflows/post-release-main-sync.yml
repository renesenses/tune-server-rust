name: Post-release — synchroniser le tag vers main

# La branche par défaut avait dérivé de plus de 800 commits : les crons ajoutés
# à release/v0.9 existaient sur disque mais GitHub ne les enregistrait jamais.
# Ce workflow vit donc sur main et observe la fin du workflow Release. Il ouvre
# (ou vérifie à la relance) une PR dédiée depuis le tag publié, sans jamais la
# fusionner. La résolution et la batterie restent une décision humaine.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag stable publié à synchroniser (ex. v0.9.126)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: post-release-main-sync-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  preparer-pr:
    name: Préparer ou vérifier la PR tag → main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Résoudre le tag et le SHA du run
        id: release
        env:
          EVENEMENT: ${{ github.event_name }}
          TAG_DU_RUN: ${{ github.event.workflow_run.head_branch }}
          SHA_DU_RUN: ${{ github.event.workflow_run.head_sha }}
          TAG_MANUEL: ${{ inputs.tag }}
        run: |
          if [ "$EVENEMENT" = workflow_run ]; then
            printf 'tag=%s\nrun_sha=%s\n' "$TAG_DU_RUN" "$SHA_DU_RUN" >> "$GITHUB_OUTPUT"
          else
            printf 'tag=%s\nrun_sha=\n' "$TAG_MANUEL" >> "$GITHUB_OUTPUT"
          fi

      - name: Contre-épreuves du garde-fou
        run: python3 scripts/synchroniser-release-main.py --self-test

      - name: Préparer ou vérifier la PR sans la fusionner
        env:
          # MAIN_SYNC_TOKEN est optionnel : il sert uniquement si le dépôt
          # interdit au GITHUB_TOKEN de créer des PR. Le repli conserve le
          # comportement natif dès que ce réglage GitHub est autorisé.
          GH_TOKEN: ${{ secrets.MAIN_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/synchroniser-release-main.py
          --repo "$GITHUB_REPOSITORY"
          --tag "${{ steps.release.outputs.tag }}"
          --run-sha "${{ steps.release.outputs.run_sha }}"
