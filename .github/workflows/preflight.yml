name: Preflight

# Phase 1 of release autonomy (docs/RELEASE-AUTONOMY-v0.9.50.md).
#
# Runs the pre-release checks before any build kicks off. Release appelle ce
# workflow comme sa premiere dependance ; workflow_dispatch reste disponible
# pour les essais a blanc. Un echec rend donc les jobs de construction
# ineligibles, au lieu de seulement poser un check rouge independant.
#
# Checks performed (each independently pass/fail):
# - semver: tag follows vMAJOR.MINOR.PATCH[-PRE]
# - version_bump: tag > Cargo.toml workspace version
# - release_identity: bump author/committer do not mix known maintainers'
#   names and addresses
# - no_p0_issues: no blocking P0 issue open; merged fixes awaiting release
#   verification (release:verification-pending) are reported but do not create
#   a release/closure deadlock, and P0 suspended for want of field information
#   (bloque:terrain) are exempted — LOUDLY: each one is named, with its
#   number, in the job summary, not only in the log
# - no_release_todos: no TODO(release) markers in source code (excl. docs/)
# - cahier_de_recette: a cahier-recette-v{major}.{minor}*.md file exists
# - cargo_audit: no high-severity CVE in the dependency tree
# - cargo_deny: licenses and duplicate-dep checks pass
# - web_api_contract: le client web n'appelle aucune route que le serveur
#   ne sert pas (scripts/preflight-web-contract.py, lu depuis main)
# - ci_status: all check-runs on the commit are green (skipped for
#   workflow_dispatch on a branch that hasn't had CI yet)

on:
  workflow_call:
    inputs:
      version:
        description: "Release version to check"
        required: false
        default: ""
        type: string
      skip_ci_check:
        description: "Skip the CI status check"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to check (e.g. v0.8.30)"
        required: true
        type: string
      skip_ci_check:
        description: "Skip the CI status check (useful for dry runs)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: read
  checks: read

jobs:
  preflight:
    name: Pre-release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: preflight-tools

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked || echo "cargo-audit install failed, will be reported as skipped"
          cargo install cargo-deny --locked || echo "cargo-deny install failed, will be reported as skipped"

      - name: Resolve target version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "skip_ci=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "skip_ci=${{ inputs.skip_ci_check }}" >> "$GITHUB_OUTPUT"
          fi

      # Le web et le serveur sortent dans la MÊME version, mais rien ne
      # vérifiait leur contrat : deux fois en trois jours, un écran web
      # fusionné a failli partir en appelant une route serveur encore en PR
      # (Dynamic Range en 0.9.82, Oxygen/Helium en 0.9.84). Le manifeste
      # identifie désormais le commit web exact construit par la release.
      - name: Lire le SHA web du manifeste
        id: web
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          PLAN=".release/$RELEASE_VERSION.json"
          test -f "$PLAN" || { echo "::error::manifeste absent: $PLAN"; exit 1; }
          WEB_SHA="$(jq -r '.components.web.sha' "$PLAN")"
          [[ "$WEB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA web invalide"; exit 1; }
          echo "sha=$WEB_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout web client
        uses: actions/checkout@v4
        with:
          repository: renesenses/tune-web-client
          ref: ${{ steps.web.outputs.sha }}
          path: .web-client

      - name: Contrat d'API web ↔ serveur
        run: |
          python3 scripts/preflight-web-contract.py --self-test
          python3 scripts/preflight-web-contract.py --web .web-client

      - name: Run preflight checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/preflight-check.py --self-test
          ARGS="--version ${{ steps.resolve.outputs.version }}"
          if [ "${{ steps.resolve.outputs.skip_ci }}" = "true" ]; then
            ARGS="$ARGS --no-ci-check"
          fi
          python3 scripts/preflight-check.py $ARGS
