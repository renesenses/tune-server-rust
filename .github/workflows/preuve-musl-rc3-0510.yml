# Branche jetable : prouve que la cible aarch64-unknown-linux-musl de release.yml
# compile sur rc/v1.0.0 + batch/feat-rc3-20261002 (répétition 05/10) avant de taguer. La CI des PR ne construit pas musl. À supprimer.
name: Preuve musl v1.0.0-rc3
on:
  push:
    branches: ["test/preuve-musl-rc3-0510"]
permissions:
  contents: read
jobs:
  musl:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TUNE_VERSION: 1.0.0-rc3
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-musl
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ubuntu-22.04-aarch64-unknown-linux-musl
      - uses: taiki-e/install-action@cross
      - name: Build (cross) — ligne identique à release.yml
        run: cross build --release --package tune-server --target aarch64-unknown-linux-musl --no-default-features --features oaat,cloud-relay,local-audio,plugins-wasm,audio-embedding,dj,karaoke,bandcamp,concerts,pont-roon,cd,circle,entree-audio
      - run: file target/aarch64-unknown-linux-musl/release/tune-server
      - name: Le binaire se declare 1.0.0-rc3 (Cross.toml transmet TUNE_VERSION)
        run: |
          n=$(strings target/aarch64-unknown-linux-musl/release/tune-server | grep -c '1\.0\.0-rc3' || true)
          echo "occurrences de 1.0.0-rc3 : $n"
          test "$n" -gt 0
