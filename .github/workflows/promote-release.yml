name: Promote staged release

run-name: Promote v${{ inputs.version }}${{ inputs.dry_run && ' (dry-run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version sans le prefixe v
        required: true
        type: string
      dry_run:
        description: Verifier sans deplacer de canal public
        required: true
        default: true
        type: boolean

concurrency:
  group: release-promotion
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  promote:
    name: Verify once, promote once
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.dry_run && 'release-dry-run' || 'release-promotion' }}
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      PLAN: .release/v${{ inputs.version }}.json
      APPLY: ${{ !inputs.dry_run }}
      CONTROLLER_TOKEN: ${{ secrets.RELEASE_CONTROLLER_TOKEN }}
      OS_TOKEN: ${{ secrets.TUNE_OS_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verifier le train staged et ses quatre tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::lancer depuis main"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version invalide"; exit 1; }
          [ -f "$PLAN" ] || { echo "::error::manifeste absent"; exit 1; }
          jq -e --arg version "$VERSION" '.version == $version and .ready == true' "$PLAN" >/dev/null \
            || { echo "::error::manifeste non pret"; exit 1; }
          [ -n "$CONTROLLER_TOKEN" ] || { echo "::error::RELEASE_CONTROLLER_TOKEN absent"; exit 1; }
          [ -n "$OS_TOKEN" ] || { echo "::error::TUNE_OS_DISPATCH_TOKEN absent"; exit 1; }

          tag_target() {
            local repo="$1" tag="$2" object type
            object="$(GH_TOKEN="$CONTROLLER_TOKEN" gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)"
            type="$(GH_TOKEN="$CONTROLLER_TOKEN" gh api "repos/$repo/git/ref/tags/$tag" --jq .object.type)"
            if [ "$type" = tag ]; then
              GH_TOKEN="$CONTROLLER_TOKEN" gh api "repos/$repo/git/tags/$object" --jq .object.sha
            else
              printf '%s\n' "$object"
            fi
          }

          while IFS=$'\t' read -r name repo sha tag; do
            [ "$sha" != self ] || sha="$(git rev-list -n1 "$TAG")"
            actual="$(tag_target "$repo" "$tag")"
            [ "$actual" = "$sha" ] || { echo "::error::$name: $tag pointe sur $actual, attendu $sha"; exit 1; }
          done < <(jq -r '.components | to_entries[] | [.key,.value.repository,.value.sha,.value.tag] | @tsv' "$PLAN")

          git merge-base --is-ancestor "$TAG" origin/main \
            || { echo "::error::$TAG n'est pas contenu dans main"; exit 1; }
          git show "$TAG:$PLAN" > /tmp/tag-plan.json
          cmp -s "$PLAN" /tmp/tag-plan.json \
            || { echo "::error::le manifeste de main differe de celui du tag"; exit 1; }

          DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          [ "$DRAFT" = true ] || { [ "$APPLY" = true ] && [ "$DRAFT" = false ]; } \
            || { echo "::error::release serveur absente ou deja publique"; exit 1; }
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for asset in \
            "tune-server-$TAG-linux-x86_64.tar.gz" \
            "tune-server-$TAG-linux-aarch64.tar.gz" \
            "tune-server-$TAG-macos-x86_64.tar.gz" \
            "tune-server-$TAG-macos-x86_64.dmg" \
            "tune-server-$TAG-macos-aarch64.tar.gz" \
            "tune-server-$TAG-macos-aarch64.dmg" \
            "tune-server-$TAG-windows-x86_64.zip" \
            "tune-server-$TAG-windows-x86_64-setup.exe" \
            SHA256SUMS SHA256SUMS.minisig; do
            grep -qx "$asset" <<<"$ASSETS" || { echo "::error::actif serveur absent: $asset"; exit 1; }
          done

          OS_TAG="$(jq -r .components.os.tag "$PLAN")"
          OS_DRAFT="$(GH_TOKEN="$OS_TOKEN" gh api "repos/renesenses/tune-os/releases/tags/$OS_TAG" --jq .draft)"
          [ "$OS_DRAFT" = true ] || { [ "$APPLY" = true ] && [ "$OS_DRAFT" = false ]; } \
            || { echo "::error::release OS absente ou deja publique"; exit 1; }
          OS_ASSETS="$(GH_TOKEN="$OS_TOKEN" gh api "repos/renesenses/tune-os/releases/tags/$OS_TAG" --jq '.assets[].name')"
          grep -Eq 'x86_64.*\.iso$' <<<"$OS_ASSETS" || { echo "::error::ISO OS absente"; exit 1; }
          grep -Eq 'x86_64-image.*\.raw\.xz$' <<<"$OS_ASSETS" || { echo "::error::image OS x86 absente"; exit 1; }
          grep -Eq 'aarch64.*\.raw\.xz$' <<<"$OS_ASSETS" || { echo "::error::image OS ARM absente"; exit 1; }
          [ "$(grep -Ec '\.sha256$' <<<"$OS_ASSETS")" -ge 3 ] || { echo "::error::checksums OS incomplets"; exit 1; }

          docker buildx imagetools inspect "renesenses/tune:staging-$TAG" >/dev/null \
            || { echo "::error::image Docker staged absente"; exit 1; }

      - name: Telecharger les checksums avant publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern SHA256SUMS --output /tmp/SHA256SUMS --clobber

      - uses: actions/checkout@v4
        with:
          repository: renesenses/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Preparer la formule Homebrew depuis les checksums staged
        working-directory: homebrew-tap
        shell: bash
        run: |
          set -euo pipefail
          F=Formula/tune-server.rb
          checksum() {
            local asset="$1"
            awk -v wanted="$asset" '{ name=$2; sub(/^.*\//, "", name); if (name == wanted) print $1 }' /tmp/SHA256SUMS
          }
          MAC_ARM="$(checksum "tune-server-$TAG-macos-aarch64.tar.gz")"
          MAC_X86="$(checksum "tune-server-$TAG-macos-x86_64.tar.gz")"
          LIN_ARM="$(checksum "tune-server-$TAG-linux-aarch64.tar.gz")"
          LIN_X86="$(checksum "tune-server-$TAG-linux-x86_64.tar.gz")"
          for sha in "$MAC_ARM" "$MAC_X86" "$LIN_ARM" "$LIN_X86"; do
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::checksum Homebrew absent"; exit 1; }
          done
          awk -v version="$VERSION" -v mac_arm="$MAC_ARM" -v mac_x86="$MAC_X86" \
              -v lin_arm="$LIN_ARM" -v lin_x86="$LIN_X86" '
            /^  version "/ { sub(/"[^"]+"/, "\"" version "\"") }
            /url "/ {
              gsub(/v[0-9]+\.[0-9]+\.[0-9]+/, "v" version)
              if ($0 ~ /macos-aarch64/) pending=mac_arm
              else if ($0 ~ /macos-x86_64/) pending=mac_x86
              else if ($0 ~ /linux-aarch64/) pending=lin_arm
              else if ($0 ~ /linux-x86_64/) pending=lin_x86
            }
            /sha256 "/ && pending != "" { sub(/sha256 "[^"]+"/, "sha256 \"" pending "\""); pending="" }
            { gsub(/Tune Server v[0-9]+\.[0-9]+\.[0-9]+/, "Tune Server v" version); print }
          ' "$F" > "$F.new"
          mv "$F.new" "$F"
          grep -q "version \"$VERSION\"" "$F"
          [ "$(grep -c "sha256 \"" "$F")" -eq 4 ]
          git diff --check
          git diff -- "$F" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuser une promotion non armee
        if: ${{ !inputs.dry_run }}
        run: |
          [ "${{ vars.RELEASE_PROMOTION_ENABLED }}" = true ] || {
            echo "::error::RELEASE_PROMOTION_ENABLED doit valoir true"
            exit 1
          }

      - name: Promouvoir tous les canaux stables
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          # Aucune reconstruction : les deux tags publics recopient le digest
          # exact construit sous staging-vX.Y.Z.
          docker buildx imagetools create \
            --tag "renesenses/tune:$TAG" --tag renesenses/tune:latest \
            "renesenses/tune:staging-$TAG"

          OS_TAG="$(jq -r .components.os.tag "$PLAN")"
          if [ "$(GH_TOKEN="$OS_TOKEN" gh api "repos/renesenses/tune-os/releases/tags/$OS_TAG" --jq .draft)" = true ]; then
            GH_TOKEN="$OS_TOKEN" gh release edit "$OS_TAG" --repo renesenses/tune-os --draft=false --latest=false
          fi

          cd homebrew-tap
          git config user.email "renesenses-bot@users.noreply.github.com"
          git config user.name "renesenses-bot"
          git add Formula/tune-server.rb
          if ! git diff --cached --quiet; then
            git commit -m "tune-server v$VERSION"
            git push origin HEAD
          fi
          cd ..

          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false --latest
          fi

          [ -n "$WEBHOOK_SECRET" ] || { echo "::error::WEBHOOK_SECRET absent"; exit 1; }
          RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          BODY="$(jq -n --arg action published --argjson release "$RELEASE" \
            --arg name tune-server-rust --arg full "$GITHUB_REPOSITORY" \
            '{action:$action,release:$release,repository:{name:$name,full_name:$full}}')"
          SIGNATURE="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: release' -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$BODY" https://mozaiklabs.fr/webhooks/github/release

          {
            echo "## v$VERSION promue"
            echo
            echo "- GitHub Release serveur publique"
            echo "- release Tune OS publique"
            echo "- Docker $TAG et latest sur le digest staged"
            echo "- Homebrew mis a jour"
            echo "- site notifie"
            echo "- Android inchange : absent du manifeste a quatre composants"
          } >> "$GITHUB_STEP_SUMMARY"
