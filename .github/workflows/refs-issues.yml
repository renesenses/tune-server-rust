name: Références d'issues

# Rendre visible, et actionnable, ce qu'une PR declare corriger.
#
# Le probleme mesure le 20/08/2026 : 27 issues corrigees ET LIVREES etaient
# restees ouvertes, la plus ancienne depuis la v0.9.63. Le suivi mentait d'un
# mois, au point de faire classer en tete d'un bilan une perte de donnees
# (#1943) deja reparee.
#
# Un mot-cle reste inerte sur `release/v0.9`, puis devient actif lorsque le tag
# publie rejoint la branche par defaut. Le 29/08, GitHub a donc ferme #1897 en
# lisant « does not close #1897 » dans un ancien message de commit : la
# negation n'annule pas son parseur (#2785).
#
# Ce controle classe toujours les references et prepare la commande manuelle,
# mais refuse desormais ces formulations negatives avant qu'elles atteignent
# main. Il lit le titre/corps filtre ET les messages bruts des commits propres
# a la PR ; une citation du corps est ignoree, jamais une citation historique.
#
# La logique et ses cas de preuve vivent dans scripts/verifier-refs-issues.sh,
# qui porte son propre --autotest. Il est joue A CHAQUE FOIS, avant l'analyse :
# un garde-fou dont la contre-epreuve ne tourne pas finit par repondre vert sur
# le defaut qu'il devait attraper (deux fois cette semaine dans ce depot).

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: refs-issues-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refs:
    name: Issues déclarées corrigées
    runs-on: ubuntu-latest
    # Sans plafond, un blocage tourne SIX HEURES avant que GitHub ne le tue.
    # Trois releases l'ont paye (0.9.86, 0.9.87, 0.9.88).
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Contre-épreuve du garde-fou
        run: bash scripts/verifier-refs-issues.sh --autotest

      - name: Analyser le titre, le corps et les commits propres à la PR
        env:
          # Le corps passe par l'ENVIRONNEMENT, jamais par une interpolation
          # ${{ }} dans `run:` — un corps de PR est du texte fourni par
          # l'exterieur, et l'interpoler directement dans le shell permettrait
          # d'y injecter des commandes.
          CORPS: ${{ github.event.pull_request.body }}
          TITRE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git log --format='%B%n--- fin du commit ---%n' \
            "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/messages-commits"
          printf '%s\n%s\n' "$TITRE" "$CORPS" \
            | bash scripts/verifier-refs-issues.sh \
                --commits "$RUNNER_TEMP/messages-commits"
