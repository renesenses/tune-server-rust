name: Release controller

run-name: Release controller v${{ inputs.version }}${{ inputs.dry_run && ' (dry-run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version sans le prefixe v
        required: true
        default: 0.9.128
        type: string
      dry_run:
        description: Verifier le train sans creer de tag
        required: true
        default: true
        type: boolean

concurrency:
  group: release-controller
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Verifier et taguer le train
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.dry_run && 'release-dry-run' || 'release' }}
    env:
      PLAN: .release/v${{ inputs.version }}.json
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      CONTROLLER_ENABLED: ${{ vars.RELEASE_CONTROLLER_ENABLED }}
    steps:
      # Premiere etape, avant meme le checkout : sans ce secret, aucune suite
      # n'a de sens. `github.token` est limite au depot courant et rend 404
      # sur `tune-os` et `tune-server-universal`, qui sont prives — un repli
      # sur lui ne verifierait que la moitie du train tout en se declarant
      # vert. On refuse ici plutot que de deviner plus loin.
      - name: Exiger le jeton du controleur
        env:
          CONTROLLER_TOKEN: ${{ secrets.RELEASE_CONTROLLER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CONTROLLER_TOKEN" ]; then
            echo "::error::secret RELEASE_CONTROLLER_TOKEN absent."
            echo "::error::Le controleur lit les quatre depots, dont deux prives"
            echo "::error::(tune-os, tune-server-universal). Le jeton d'action ne"
            echo "::error::les voit pas : sans ce secret, le train ne peut etre"
            echo "::error::ni verifie ni tague. Poser un jeton portant 'repo' sur"
            echo "::error::les quatre depots, puis relancer."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Valider et resoudre le manifeste
        env:
          # Pas de repli sur `github.token` : il rend 404 sur les deux depots
          # prives, et la garde « Exiger le jeton du controleur » a deja
          # refuse le cas ou le secret manque.
          GH_TOKEN: ${{ secrets.RELEASE_CONTROLLER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::le controleur doit etre lance depuis main, pas $GITHUB_REF"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version invalide: $VERSION"
            exit 1
          fi
          test -f "$PLAN" || {
            echo "::error::manifeste absent: $PLAN"
            exit 1
          }

          jq -e --arg version "$VERSION" '
            .version == $version and
            (.ready | type == "boolean") and
            (.components | keys | sort == ["os", "server", "universal", "web"]) and
            .components.server.repository == "renesenses/tune-server-rust" and
            .components.server.sha == "self" and
            .components.server.tag == ("v" + $version) and
            .components.web.repository == "renesenses/tune-web-client" and
            (.components.web.sha | test("^[0-9a-f]{40}$")) and
            .components.web.tag == ("v" + $version) and
            .components.os.repository == "renesenses/tune-os" and
            (.components.os.sha | test("^[0-9a-f]{40}$")) and
            .components.os.tag == ("tune-os-rpi-v" + $version) and
            .components.universal.repository == "renesenses/tune-server-universal" and
            (.components.universal.sha | test("^[0-9a-f]{40}$")) and
            .components.universal.tag == ("v" + $version)
          ' "$PLAN" >/dev/null || {
            echo "::error::manifeste invalide ou depot/tag non autorise"
            exit 1
          }

          jq --arg server_sha "$GITHUB_SHA" \
            '.components.server.sha = $server_sha' "$PLAN" \
            > /tmp/release-manifest.json

          while IFS=$'\t' read -r name repo sha tag; do
            # Un 404 nu ici ne dit pas POURQUOI. Les deux causes sont tres
            # differentes : le depot n'existe pas, ou le jeton n'y a pas
            # acces (cas des deux depots prives sous GitHub Free). Le
            # deuxieme est le seul qu'on rencontre en pratique, et il se
            # corrige en posant RELEASE_CONTROLLER_TOKEN.
            if ! main_sha="$(gh api "repos/$repo/branches/main" --jq .commit.sha 2>/dev/null)"; then
              echo "::error::$name: impossible de lire repos/$repo/branches/main."
              echo "::error::Si $repo est prive, le jeton employe n'y a pas acces."
              echo "::error::Poser le secret RELEASE_CONTROLLER_TOKEN (jeton avec 'repo' sur les quatre depots)."
              exit 1
            fi
            merge_base="$(gh api "repos/$repo/compare/$sha...$main_sha" --jq .merge_base_commit.sha)"
            if [ "$merge_base" != "$sha" ]; then
              echo "::error::$name: $sha n'est pas atteignable depuis main ($main_sha)"
              exit 1
            fi
            if [ "$name" = server ] && [ "$main_sha" != "$GITHUB_SHA" ]; then
              echo "::error::main serveur a bouge: $main_sha au lieu de $GITHUB_SHA"
              exit 1
            fi
            printf '%s\t%s\t%s\t%s\n' "$name" "$repo" "$sha" "$tag"
          done < <(jq -r '.components | to_entries[] | [.key, .value.repository, .value.sha, .value.tag] | @tsv' /tmp/release-manifest.json)

          {
            echo "## Train v$VERSION"
            echo
            echo '| composant | dépôt | SHA | tag |'
            echo '|---|---|---|---|'
            jq -r '.components | to_entries[] | "| \(.key) | `\(.value.repository)` | `\(.value.sha)` | `\(.value.tag)` |"' /tmp/release-manifest.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuser un controleur non arme
        if: ${{ !inputs.dry_run }}
        env:
          CONTROLLER_TOKEN: ${{ secrets.RELEASE_CONTROLLER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONTROLLER_ENABLED" != true ]; then
            echo "::error::RELEASE_CONTROLLER_ENABLED doit valoir true"
            exit 1
          fi
          if [ -z "$CONTROLLER_TOKEN" ]; then
            echo "::error::secret RELEASE_CONTROLLER_TOKEN absent"
            exit 1
          fi
          jq -e '.ready == true' "$PLAN" >/dev/null || {
            echo "::error::le manifeste est encore un candidat (ready=false)"
            exit 1
          }

      - name: Creer les quatre tags
        env:
          # Meme jeton en dry-run et en tir reel. Pas de repli sur
          # `github.token` : il rend 404 sur les deux depots prives, et un
          # 404 est indiscernable de « le tag n'existe pas ». Un tag
          # DIVERGENT y serait alors invisible, en silence, dans l'etape
          # meme censee le detecter. La garde en tete de job refuse deja le
          # cas ou le secret manque.
          GH_TOKEN: ${{ secrets.RELEASE_CONTROLLER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # `relire_tag_avec_reprise` : la relecture d'apres-creation, avec
          # quelques tentatives. Le fichier porte le detail de la panne et ses
          # contre-epreuves (`--autotest`).
          source scripts/relire-tag-avec-reprise.sh

          # Trois issues distinctes, jamais confondues :
          #   0  le tag existe, son SHA est ecrit sur la sortie standard
          #   1  le tag n'existe pas, et on a la preuve que le depot est lisible
          #   2  l'API a refuse — on ne sait RIEN, il faut s'arreter
          #
          # Sur un depot prive, GitHub rend 404 aussi bien pour « ce tag
          # n'existe pas » que pour « ce jeton n'a pas acces ». Le seul appel
          # sur la ref ne permet donc pas de conclure : on verifie que le
          # depot lui-meme est lisible avant d'oser dire « aucun tag ».
          cible_tag() {
            local repo="$1" tag="$2" objet type
            if objet="$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
              type="$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.type)"
              if [ "$type" = tag ]; then
                gh api "repos/$repo/git/tags/$objet" --jq .object.sha
              else
                printf '%s\n' "$objet"
              fi
              return 0
            fi
            if ! gh api "repos/$repo" --jq .full_name >/dev/null 2>&1; then
              echo "::error::$repo: depot illisible par RELEASE_CONTROLLER_TOKEN." >&2
              echo "::error::Impossible de dire si $tag existe deja : un tag divergent" >&2
              echo "::error::passerait inapercu. Le jeton doit porter 'repo' sur les" >&2
              echo "::error::quatre depots du train." >&2
              return 2
            fi
            return 1
          }

          assurer_tag() {
            local name="$1" repo="$2" sha="$3" tag="$4" existant relu etat
            existant="$(cible_tag "$repo" "$tag")" && etat=0 || etat=$?
            if [ "$etat" -ge 2 ]; then
              exit 1
            fi
            if [ "$etat" -eq 0 ]; then
              if [ "$existant" != "$sha" ]; then
                echo "::error::$repo:$tag pointe sur $existant au lieu de $sha"
                exit 1
              fi
              echo "$name: $tag existe deja sur $sha"
              return
            fi
            if [ "$DRY_RUN" = true ]; then
              echo "$name: creerait $tag sur $sha"
              return
            fi
            gh api --method POST "repos/$repo/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            # La relecture doit rendre 0 : apres un POST reussi, « absent »
            # (1) comme « illisible » (2) restent des ECHECS DURS.
            #
            # Mais elle ne les constate plus du PREMIER coup. Run 33522674458,
            # v0.9.130 : le tag venait d'etre cree sur `tune-web-client`, la
            # relecture immediate a rendu « neant », et le controleur s'est
            # arrete avant `universal`, `os` et `server`. Le tag existait — relu
            # trente secondes plus tard, sur le bon SHA. L'API GitHub n'est pas
            # coherente en lecture-apres-ecriture a cette echelle de temps.
            #
            # `relire_tag_avec_reprise` distingue donc « absent » de « pas
            # encore visible » : cinq lectures espacees d'une seconde, quatre
            # secondes d'attente au pire. Elle N'AFFAIBLIT PAS la garde — un
            # tag DIVERGENT rend 3 des la premiere lecture, sans reprise.
            relu="$(relire_tag_avec_reprise "$sha" cible_tag "$repo" "$tag")" && etat=0 || etat=$?
            if [ "$etat" -ne 0 ]; then
              echo "::error::$repo:$tag n'est pas verifiable apres creation (etat=$etat, relu=${relu:-neant})"
              exit 1
            fi
            echo "$name: $tag cree sur $sha"
          }

          # Le tag serveur est cree en dernier : lui seul peut declencher le train.
          for name in web universal os server; do
            IFS=$'\t' read -r repo sha tag < <(
              jq -r --arg name "$name" \
                '.components[$name] | [.repository, .sha, .tag] | @tsv' \
                /tmp/release-manifest.json
            )
            if [ "$name" = server ]; then
              main_sha="$(gh api "repos/$repo/branches/main" --jq .commit.sha)"
              [ "$main_sha" = "$sha" ] || {
                echo "::error::main serveur a bouge avant la pose du tag"
                exit 1
              }
            fi
            assurer_tag "$name" "$repo" "$sha" "$tag"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-v${{ inputs.version }}
          path: /tmp/release-manifest.json
          retention-days: 90
