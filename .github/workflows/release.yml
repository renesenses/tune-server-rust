name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# ─── Pourquoi un plafond sur CHAQUE job ────────────────────────────────────
#
# Sans `timeout-minutes`, un job qui se bloque tourne jusqu'au plafond GitHub
# de SIX HEURES, puis meurt en emportant la release. C'est arrive trois fois
# en trois jours (0.9.86, 0.9.87, 0.9.88), toujours sur `apt-get` — mais apt
# n'est qu'un symptome : le trou, c'est qu'aucun job n'etait borne.
#
# #1937 a borne LA COMMANDE qui avait echoue. Ces plafonds bornent la CLASSE
# de panne : un `cargo` qui ne rend pas la main, une notarisation Apple qui
# pend, un `gh api` sans reponse — tout est desormais coupe en dizaines de
# minutes, pas en heures. Un plafond ne peut que faire echouer plus TOT ; il
# ne change aucune logique de build.
#
# Les valeurs sont larges (2 a 20x la duree observee le 19/08) : le but n'est
# pas de serrer au plus juste, c'est d'empecher les six heures.

jobs:
  preflight:
    name: Preflight
    permissions:
      contents: read
      issues: read
      checks: read
    uses: ./.github/workflows/preflight.yml
    with:
      version: ${{ github.ref_name }}
      skip_ci_check: false

  web-client:
    name: Build Web Client
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Build Web Client — <1 min
    steps:
      - uses: actions/checkout@v4
      # Symetrique de « Verify web-client version matches release tag », plus
      # bas. Le client web avait sa garde ; le SERVEUR n'en avait aucune.
      # Vecu sur la v0.9.128 : le tag a ete pose alors que Cargo.toml declarait
      # encore 0.9.127. Les artefacts sont partis, et le binaire repond DEUX
      # versions selon qui demande — `tune_core::version()` lit TUNE_VERSION
      # (pose depuis le tag) et dit 0.9.128, tandis que tout `env!(
      # "CARGO_PKG_VERSION")` dit 0.9.127 : `tune-server --version`,
      # `routes/mediasync.rs` (`server_version`) et les trois greffons. Un
      # testeur annonce alors une version qu'il n'execute pas.
      - name: Verify workspace version matches release tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Meme regle que pour le client : on compare la base X.Y.Z, le
          # suffixe -rcN vit sur le tag git seul.
          TAG_BASE="${TAG_VERSION%%-*}"
          WS_VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [ -n "$WS_VERSION" ] || { echo "::error::version introuvable dans [workspace.package] de Cargo.toml"; exit 1; }
          if [ "$TAG_BASE" != "$WS_VERSION" ]; then
            echo "::error::Cargo.toml [workspace.package] declare $WS_VERSION alors que le tag vaut $TAG_BASE."
            echo "::error::Commiter le bump du workspace AVANT de taguer, puis relancer cette release."
            exit 1
          fi
          echo "workspace version $WS_VERSION == base du tag $TAG_BASE"
      - name: Lire le SHA web du manifeste
        id: web
        shell: bash
        run: |
          PLAN=".release/${GITHUB_REF_NAME}.json"
          test -f "$PLAN" || { echo "::error::manifeste absent: $PLAN"; exit 1; }
          WEB_SHA="$(jq -r '.components.web.sha' "$PLAN")"
          [[ "$WEB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA web invalide"; exit 1; }
          echo "sha=$WEB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: renesenses/tune-web-client
          ref: ${{ steps.web.outputs.sha }}
          path: .web-client
      - name: Verify web-client version matches release tag
        working-directory: .web-client
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Compare the base X.Y.Z only: a pre-release tag (v0.9.0-rc1) ships the
          # 0.9.0 web client — bump-all.sh keeps package.json at plain X.Y.Z, the
          # -rcN suffix lives on the git tag alone.
          TAG_BASE="${TAG_VERSION%%-*}"
          WEB_VERSION="$(grep -m1 '"version"' package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          if [ "$TAG_BASE" != "$WEB_VERSION" ]; then
            echo "::error::tune-web-client package.json is $WEB_VERSION but the release tag base is $TAG_BASE."
            echo "::error::Push the tune-web-client version bump to main BEFORE tagging the server, then re-run this release."
            exit 1
          fi
          echo "web-client version $WEB_VERSION matches release tag base $TAG_BASE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .web-client/package-lock.json
      - run: npm ci
        working-directory: .web-client
      - run: npm run build
        working-directory: .web-client
      - uses: actions/upload-artifact@v4
        with:
          name: web-client
          path: .web-client/dist/
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: web-client
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux-x86_64
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux-aarch64
            ext: tar.gz
            cross: true
            features: oaat,postgres,dj,karaoke,bandcamp,concerts,plugins-wasm,audio-embedding
          # Statically-linked ARM64 build (musl) — zero glibc dependency, runs
          # on old-userland NAS (Synology DSM, etc.) where the gnu build fails
          # with GLIBC_2.xx-not-found. SQLite-only (no postgres/libpq) since NAS
          # installs use SQLite; dropping postgres also avoids libpq static-link.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            platform: linux-aarch64-musl
            ext: tar.gz
            cross: true
            features: oaat,dj,karaoke,bandcamp,concerts,plugins-wasm,audio-embedding
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: macos-x86_64
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-aarch64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x86_64
            ext: zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 75  # Build ${{ matrix.target }} — 26 min au pire, macOS x86_64
    env:
      ARTIFACT: tune-server-${{ github.ref_name }}-${{ matrix.platform }}
      # Exposé au niveau du job pour être lisible depuis un `if:` d'étape : le
      # contexte `secrets` n'y est pas disponible, et un `env:` défini DANS une
      # étape ne l'est pas non plus pour son propre `if:`.
      WIN_SIGN_CERT_BASE64: ${{ secrets.WIN_SIGN_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}-${{ matrix.target }}

      # C'est ICI que web/ apparaît, et nulle part ailleurs : le dossier n'est
      # plus commité (#1690). Tout ce que les étapes suivantes empaquettent
      # sous web/ vient donc du job web-client, c'est-à-dire de
      # tune-web-client. Tant que la copie périmée était versionnée, ses
      # bundles survivaient à ce téléchargement (noms hachés différents) et
      # partaient dans chaque artefact à côté des vrais.
      - uses: actions/download-artifact@v4
        with:
          name: web-client
          path: web

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Set TUNE_VERSION from git tag
        shell: bash
        run: echo "TUNE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # ffmpeg minimal audio-only (#1524) : produit par ffmpeg-minimal.yml,
      # publié sur la release `ffmpeg-minimal` du dépôt, livré à côté de
      # tune-server pour les encodages AAC/ALAC du convertisseur. Absent →
      # warning, pas d'échec : l'artefact part sans ffmpeg et l'endpoint
      # /converter/capabilities grise aac/alac côté interface. Pas de build
      # musl : un binaire gnu n'y tournerait pas (NAS à userland musl).
      - name: Fetch bundled ffmpeg (minimal)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ffbundle"
          if gh release download ffmpeg-minimal --repo "$GITHUB_REPOSITORY" \
               --pattern "ffmpeg-minimal-${{ matrix.platform }}.tar.gz" \
               --dir "$RUNNER_TEMP/ffbundle"; then
            # tar en chemin relatif : le tar GNU de Git-Bash lit « D: » d'un
            # chemin Windows comme un hote distant (rsh) et echoue —
            # « Cannot connect to D: resolve failed » (vecu v0.9.71). Le cd +
            # chemin RELATIF suffit : plus de deux-points, aucun drapeau requis.
            # Surtout pas --force-local : le bsdtar de macOS ne le connait pas
            # et les DEUX jobs macOS sont tombes dessus en v0.9.72.
            (cd "$RUNNER_TEMP/ffbundle" && \
              tar -xzf "ffmpeg-minimal-${{ matrix.platform }}.tar.gz")
            ls -la "$RUNNER_TEMP/ffbundle"
          else
            echo "::warning::ffmpeg-minimal-${{ matrix.platform }} absent de la release ffmpeg-minimal — cet artefact partira sans ffmpeg (aac/alac indisponibles, grisés par /converter/capabilities). Lancer le workflow « FFmpeg minimal »."
          fi

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --package tune-server --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}

      # Garde-fou #1288 : la cible musl n'a d'intérêt que si le binaire est
      # RÉELLEMENT statique (NAS à vieille userland, Alpine ARM). Une dépendance
      # native qui repasse en lien dynamique — comme libopus l'a fait en v0.9.53,
      # cf Cross.toml — casse soit le link, soit le binaire à l'exécution chez
      # l'utilisateur. `file` fonctionne en cross-arch, contrairement à `ldd`.
      - name: Verify musl binary is statically linked
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/tune-server"
          file -b "$BIN"
          # Le critère qui fait foi est l'absence de dépendance partagée (NEEDED)
          # et d'interpréteur dynamique, pas le libellé de `file` : rustc produit
          # des binaires **static-pie** sur musl, que `file` décrit
          # « static-pie linked » et non « statically linked ». `readelf` est
          # indépendant de l'architecture, il lit donc l'ELF arm64 sur un runner
          # x86_64 — contrairement à `ldd`.
          NEEDED="$(readelf -d "$BIN" 2>/dev/null | grep NEEDED || true)"
          INTERP="$(readelf -l "$BIN" 2>/dev/null | grep 'program interpreter' || true)"
          if [ -n "$NEEDED" ] || [ -n "$INTERP" ]; then
            echo "::error::Le binaire musl arm64 n'est pas statique — il dépend de bibliothèques partagées."
            echo "$NEEDED"
            echo "$INTERP"
            exit 1
          fi
          echo "OK — binaire musl arm64 statique (aucun NEEDED, aucun interpréteur dynamique)"

      - name: Install ALSA dev (Linux)
        if: "!matrix.cross && runner.os == 'Linux'"
        timeout-minutes: 18
        run: |
          # Les runners Ubuntu de GitHub ont TROIS fois bloque cette commande
          # indefiniment (0.9.86 : 6 h avant que le plafond ne tue le job et
          # emporte la release ; 0.9.87 : rebelote ; 0.9.88 : encore). apt n'a
          # pas de delai par defaut et githubstatus ne declare rien : sans
          # garde-fou, une panne de miroir passagere coute une version entiere.
          #
          # Le plafond de l'etape vaut 18 min et non 6 : trois essais bornes
          # font au pire 3 x (100 + 200) + 2 x 20 = 940 s, soit 15 min 40. A 6
          # min, la marche se faisait tuer PENDANT le deuxieme essai — on
          # payait le cout de la boucle sans jamais en avoir les trois essais,
          # et le message d'erreur final ci-dessous ne pouvait pas s'afficher.
          # Mesure du 19/08 sur la 0.9.88 : marche tuee a 6 min 07.
          for essai in 1 2 3; do
            if timeout 100 sudo apt-get update && timeout 200 sudo apt-get install -y libasound2-dev; then
              echo "libasound2-dev installe (essai $essai)"
              exit 0
            fi
            echo "::warning::apt a echoue ou depasse le delai (essai $essai/3) — nouvel essai dans 20 s"
            sudo rm -rf /var/lib/apt/lists/*
            sleep 20
          done
          echo "::error::apt injoignable apres 3 essais — miroir Ubuntu probablement en panne"
          exit 1

      - name: Build (native, Linux with local-audio + postgres)
        if: "!matrix.cross && runner.os == 'Linux'"
        run: cargo build --release --package tune-server --target ${{ matrix.target }} --no-default-features --features oaat,local-audio,postgres,dj,karaoke,bandcamp,concerts,plugins-wasm,audio-embedding

      - name: Download ASIO SDK (Windows)
        if: "!matrix.cross && runner.os == 'Windows'"
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive -Path asiosdk.zip -DestinationPath asiosdk -Force
          $sdkDir = Get-ChildItem -Path asiosdk -Directory | Select-Object -First 1
          echo "CPAL_ASIO_DIR=$($sdkDir.FullName)" >> $env:GITHUB_ENV

      - name: Build (native, Windows with local-audio + ASIO + postgres)
        if: "!matrix.cross && runner.os == 'Windows'"
        run: cargo build --release --package tune-server --target ${{ matrix.target }} --no-default-features --features oaat,local-audio,asio,postgres,dj,karaoke,bandcamp,concerts,plugins-wasm,audio-embedding

      - name: Build (native, macOS with local-audio + postgres)
        if: "!matrix.cross && runner.os == 'macOS'"
        run: cargo build --release --package tune-server --target ${{ matrix.target }} --features postgres,dj,karaoke,bandcamp,concerts,plugins-wasm,audio-embedding

      # AirPlay 2 sender daemon (GPL, spawned as a subprocess) bundled next to
      # tune-server so AirPlay 2 works on native installs, not just Docker
      # (#700 / Bilou #1135). Built from a pinned rev of our fork.
      #
      # Best-effort PER TARGET: build the real binary or ship NOTHING — never a
      # placeholder. An empty stub would make daemon_available() return true and
      # route AirPlay to a broken daemon instead of falling back to AirPlay 1.
      # If the build fails (e.g. the vendored C on a given toolchain) the artifact
      # still ships, just without AirPlay 2. Cross targets (arm64 Linux) skipped.
      - name: Build airplay-daemon
        if: "!matrix.cross"
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Meme miroir, meme risque de blocage que « Install ALSA dev » —
            # et ici l'echec n'est pas fatal, le daemon est optionnel. On borne
            # donc sans reprise : si apt pend, on passe sans AirPlay 2 plutot
            # que de retenir la release entiere.
            timeout 200 sudo apt-get install -y --no-install-recommends cmake clang \
              || echo "::warning::apt indisponible — airplay-daemon sera absent de cet artefact"
          fi
          if cargo install --git https://github.com/renesenses/airplay2-rs \
               --rev a7d7ad6637507eaedd61de7461574adfb7b0a987 \
               airplay-daemon --target ${{ matrix.target }} \
               --root "$RUNNER_TEMP/apd" --locked; then
            echo "airplay-daemon built for ${{ matrix.target }}"
          else
            echo "::warning::airplay-daemon failed to build for ${{ matrix.target }} — this artifact will fall back to AirPlay 1"
          fi

      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then echo "No certificate, skipping"; exit 0; fi
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm /tmp/certificate.p12

      - name: Package (unix)
        if: runner.os != 'Windows'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p package/web
          cp target/${{ matrix.target }}/release/tune-server package/
          cp -r web/* package/web/
          # Bundle the Party (WASM) plugin next to the tune-server binary so the
          # plugins-wasm runtime discovers it at startup (plugins/ resolves
          # exe-relative first). Sourced from the committed test fixture — the
          # wasm is NOT rebuilt here.
          mkdir -p package/plugins/party
          cp tune-server/tests/fixtures/plugins/party/main.wasm package/plugins/party/
          cp tune-server/tests/fixtures/plugins/party/manifest.json package/plugins/party/
          # Bundle airplay-daemon next to tune-server if it built for this target.
          DAEMON=""
          if [ -f "$RUNNER_TEMP/apd/bin/airplay-daemon" ]; then
            cp "$RUNNER_TEMP/apd/bin/airplay-daemon" package/
            DAEMON="airplay-daemon"
          fi
          # ffmpeg minimal (#1524) : à côté de tune-server, là où resolve_tool()
          # regarde en premier. Sa licence LGPL voyage avec lui.
          FFMPEG=""
          if [ -f "$RUNNER_TEMP/ffbundle/ffmpeg" ]; then
            cp "$RUNNER_TEMP/ffbundle/ffmpeg" package/
            chmod 755 package/ffmpeg
            FFMPEG="ffmpeg"
            if [ -f "$RUNNER_TEMP/ffbundle/FFMPEG-LICENSE.txt" ]; then
              cp "$RUNNER_TEMP/ffbundle/FFMPEG-LICENSE.txt" package/
              FFMPEG="$FFMPEG FFMPEG-LICENSE.txt"
            fi
          fi
          # Sign the binaries that ship in the tarball (Homebrew installs these).
          #
          # Without this they keep the linker's ad-hoc signature, whose code
          # identity is `tune_server-<hash of the binary>` — it changes on every
          # build. macOS keys the Local Network permission to that identity, so
          # every release silently revoked the user's grant and the kernel then
          # dropped every connection to a DLNA/AirPlay device on the LAN
          # (`tcp drop outgoing ... reason: NECP`, EHOSTUNREACH), surfacing as an
          # unexplained "soap send: error sending request" with no way to recover
          # short of restarting the server.
          #
          # A Developer ID signature with an explicit --identifier gives a
          # designated requirement built from the identifier and the team, not
          # from the binary's hash, so the grant survives upgrades. The .app/.dmg
          # path already signed the same binary; only the tarball was left out.
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_TEAM_ID" ]; then
            IDENTITY="Developer ID Application: Bertrand Clech ($APPLE_TEAM_ID)"
            # `--timestamp` joint le serveur d'horodatage d'Apple. Quand il ne
            # repond pas, codesign rend 0 mais SANS horodatage, et le
            # `--verify --strict` qui suit rejette la signature avec
            # « A timestamp was expected but was not found ». C'est arrive sur
            # la v0.9.119 (x86_64-apple-darwin) : panne d'Apple, rien de local.
            # On reessaie donc, au lieu de perdre le train sur un aleas reseau.
            # #1641 — permission de chargement de bibliothèque. Le runtime
            # durci (`--options runtime`) active la validation de bibliothèque :
            # tune-server ne peut alors charger QUE des dylibs de sa propre Team
            # ID. L'analyse acoustique (CLAP) fait un `dlopen` sur la
            # `libonnxruntime.dylib` de Microsoft, signée adhoc et SANS Team ID —
            # le noyau la refusait, et la jauge restait à 0 % sur tout macOS.
            # Le plist ne porte AUCUN commentaire XML. Un commentaire contenant
            # deux tirets consecutifs est illegal en XML, et AMFI — le lecteur
            # de plist qu'appelle « codesign --entitlements » — refuse alors le
            # FICHIER ENTIER (« AMFIUnserializeXML: syntax error »), codesign
            # sort en erreur, et ce job tombe en plein train de publication.
            # Or toute prose sur ce sujet contient deux tirets consecutifs.
            # L'explication vit donc ici et dans tune-core/src/audio/runtime.rs,
            # jamais dans le plist. Un test la verrouille.
            DROITS="$GITHUB_WORKSPACE/packaging/macos/tune-server.entitlements"
            # Le troisième argument est le fichier de permissions, vide pour les
            # binaires qui n'en ont pas besoin (ffmpeg, airplay-daemon).
            sign_horodate() {
              local cible="$1" identifiant="$2" droits="$3" i
              for i in 1 2 3 4 5; do
                if [ -n "$droits" ]; then
                  codesign --force --options runtime --timestamp \
                    --entitlements "$droits" \
                    --identifier "$identifiant" --sign "$IDENTITY" "$cible" && return 0
                else
                  codesign --force --options runtime --timestamp \
                    --identifier "$identifiant" --sign "$IDENTITY" "$cible" && return 0
                fi
                echo "::warning::codesign --timestamp a echoue sur $cible (essai $i/5) — nouvelle tentative dans $((i * 15)) s"
                sleep $((i * 15))
              done
              echo "::error::codesign --timestamp a echoue 5 fois sur $cible — serveur d'horodatage Apple injoignable"
              return 1
            }
            sign_horodate package/tune-server fr.mozaiklabs.tune-server "$DROITS"
            if [ -n "$DAEMON" ]; then
              sign_horodate "package/$DAEMON" fr.mozaiklabs.airplay-daemon ""
            fi
            if [ -f package/ffmpeg ]; then
              sign_horodate package/ffmpeg fr.mozaiklabs.ffmpeg ""
            fi
            codesign --verify --strict --verbose=2 package/tune-server
            # Garde #1641 : une signature qui « réussit » sans porter la
            # permission repart pour un train entier de macOS sans analyse
            # acoustique, et personne ne le voit avant le rapport d'un testeur.
            # On relit donc la signature PRODUITE, pas la commande écrite.
            if codesign -d --entitlements - --xml package/tune-server 2>/dev/null \
                 | grep -q "com.apple.security.cs.disable-library-validation"; then
              echo "OK — package/tune-server porte disable-library-validation (#1641)"
            else
              echo "::error::package/tune-server est signé en runtime durci SANS com.apple.security.cs.disable-library-validation — l'analyse acoustique (CLAP) ne pourra pas charger libonnxruntime.dylib sur macOS (#1641)."
              exit 1
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "::warning::APPLE_TEAM_ID is unset — shipping an ad-hoc signed binary. macOS users will lose their Local Network grant on upgrade."
          fi
          cd package && tar czf ../${{ env.ARTIFACT }}.${{ matrix.ext }} tune-server $DAEMON $FFMPEG web/ plugins/
          cd ..

      # ── Signature Authenticode (Windows) ───────────────────────────────────
      #
      # Sans signature, Windows Defender met l'exécutable en quarantaine ou le
      # tue en silence : un binaire non signé qui fait `taskkill` et sonde le
      # port 8888 déclenche l'heuristique. Côté utilisateur ça donne « la
      # fenêtre se ferme après quelques secondes » (Alain Bonnel, Win11, fil
      # #1313) et « le serveur s'arrête tout seul au bout d'une à deux
      # minutes » (#1435). Windows 11 avec des définitions récentes est bien
      # plus agressif que Windows 10 : la population touchée grandit.
      #
      # L'étape ne tourne QUE si le certificat est présent. Sans les secrets
      # elle est ignorée et la release se termine exactement comme aujourd'hui ;
      # poser `WIN_SIGN_CERT_BASE64` (le .pfx en base64) et `WIN_SIGN_CERT_PWD`
      # suffit à l'activer, sans autre changement.
      #
      # Placée AVANT l'empaquetage : le .zip portable et l'installeur NSIS
      # embarquent tous deux ce binaire. Le zip est précisément le contournement
      # donné aux utilisateurs bloqués — le signer aussi est le but même.
      - name: Sign Windows binaries (si le certificat est présent)
        if: runner.os == 'Windows' && env.WIN_SIGN_CERT_BASE64 != ''
        env:
          WIN_SIGN_CERT_PWD: ${{ secrets.WIN_SIGN_CERT_PWD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "tune-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_SIGN_CERT_BASE64))

          # signtool vit dans le SDK Windows, à une version près : prendre la
          # plus récente plutôt que figer un chemin qui cassera à la prochaine
          # image de runner.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe introuvable dans le SDK Windows" }

          $targets = @("target\${{ matrix.target }}\release\tune-server.exe")
          # airplay-daemon vit dans $RUNNER_TEMP\apd\bin (cargo install --root),
          # JAMAIS dans target\release : l'ancien Test-Path ne matchait jamais
          # et le daemon serait parti non signé. Signé en place, la copie vers
          # le zip et l'installeur (toutes deux après cette étape) le propage.
          if (Test-Path "$env:RUNNER_TEMP\apd\bin\airplay-daemon.exe") {
            $targets += "$env:RUNNER_TEMP\apd\bin\airplay-daemon.exe"
          }
          # ffmpeg minimal (#1524) : même motif — signé EN PLACE dans ffbundle,
          # d'où le zip et l'installeur NSIS le copient tous deux APRÈS cette
          # étape. Sans lui, tune-server.exe signé lancerait un ffmpeg.exe non
          # signé — la même heuristique Defender que ce que corrige #1521.
          if (Test-Path "$env:RUNNER_TEMP\ffbundle\ffmpeg.exe") {
            $targets += "$env:RUNNER_TEMP\ffbundle\ffmpeg.exe"
          }
          # ffmpeg minimal (#1524) : signé EN PLACE dans ffbundle, d'où le zip
          # et l'installeur NSIS le copient tous deux APRÈS cette étape. Sans
          # lui, tune-server.exe signé lancerait un ffmpeg.exe non signé — la
          # même heuristique Defender que ce que cette étape corrige (#1521).
          if (Test-Path "$env:RUNNER_TEMP\ffbundle\ffmpeg.exe") {
            $targets += "$env:RUNNER_TEMP\ffbundle\ffmpeg.exe"
          }

          foreach ($t in $targets) {
            # /tr = horodatage : c'est lui qui fait qu'une signature reste
            # valide APRÈS l'expiration du certificat. Sans lui, tout ce qui a
            # été publié deviendrait non signé le jour de l'expiration.
            & $signtool.FullName sign /f $pfx /p $env:WIN_SIGN_CERT_PWD `
              /fd SHA256 /tr http://timestamp.sectigo.com /td SHA256 /v $t
            if ($LASTEXITCODE -ne 0) { throw "échec de signature : $t" }
            & $signtool.FullName verify /pa /v $t
            if ($LASTEXITCODE -ne 0) { throw "signature invalide : $t" }
          }
          Remove-Item $pfx -Force

      - name: Package (windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir package\web
          copy target\${{ matrix.target }}\release\tune-server.exe package\
          # Bundle airplay-daemon.exe next to tune-server.exe if it built.
          if (Test-Path "$env:RUNNER_TEMP\apd\bin\airplay-daemon.exe") {
            copy "$env:RUNNER_TEMP\apd\bin\airplay-daemon.exe" package\
          }
          # ffmpeg minimal (#1524), a cote de tune-server.exe (resolve_tool).
          if (Test-Path "$env:RUNNER_TEMP\ffbundle\ffmpeg.exe") {
            copy "$env:RUNNER_TEMP\ffbundle\ffmpeg.exe" package\
            if (Test-Path "$env:RUNNER_TEMP\ffbundle\FFMPEG-LICENSE.txt") {
              copy "$env:RUNNER_TEMP\ffbundle\FFMPEG-LICENSE.txt" package\
            }
          }
          xcopy web\* package\web\ /E /I /Q
          # Bundle the Party (WASM) plugin next to tune-server.exe (see unix step).
          mkdir package\plugins\party
          copy tune-server\tests\fixtures\plugins\party\main.wasm package\plugins\party\
          copy tune-server\tests\fixtures\plugins\party\manifest.json package\plugins\party\
          cd package
          7z a ..\${{ env.ARTIFACT }}.${{ matrix.ext }} tune-server.exe web\ plugins\
          if (Test-Path "airplay-daemon.exe") { 7z a ..\${{ env.ARTIFACT }}.${{ matrix.ext }} airplay-daemon.exe }
          if (Test-Path "ffmpeg.exe") { 7z a ..\${{ env.ARTIFACT }}.${{ matrix.ext }} ffmpeg.exe FFMPEG-LICENSE.txt }
          cd ..

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Create installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          # Include the AirPlay 2 daemon in the installer only if it built for this
          # target; otherwise the File directive is omitted entirely (no broken or
          # empty binary that would defeat the AirPlay 1 fallback).
          $daemonFile = ""
          if (Test-Path "$env:RUNNER_TEMP\apd\bin\airplay-daemon.exe") {
            copy "$env:RUNNER_TEMP\apd\bin\airplay-daemon.exe" "target\${{ matrix.target }}\release\airplay-daemon.exe"
            $daemonFile = 'File "target\${{ matrix.target }}\release\airplay-daemon.exe"'
          }
          # ffmpeg minimal (#1524) : meme motif que le daemon — la directive
          # File n'apparait que si le binaire existe.
          $ffmpegFile = ""
          if (Test-Path "$env:RUNNER_TEMP\ffbundle\ffmpeg.exe") {
            copy "$env:RUNNER_TEMP\ffbundle\ffmpeg.exe" "target\${{ matrix.target }}\release\ffmpeg.exe"
            $ffmpegFile = 'File "target\${{ matrix.target }}\release\ffmpeg.exe"'
            if (Test-Path "$env:RUNNER_TEMP\ffbundle\FFMPEG-LICENSE.txt") {
              copy "$env:RUNNER_TEMP\ffbundle\FFMPEG-LICENSE.txt" "target\${{ matrix.target }}\release\FFMPEG-LICENSE.txt"
              $ffmpegFile = $ffmpegFile + "`n            File `"target\${{ matrix.target }}\release\FFMPEG-LICENSE.txt`""
            }
          }
          # Stage the Party (WASM) plugin so the installer ships it next to
          # tune-server.exe (plugins\ resolves exe-relative at runtime).
          New-Item -ItemType Directory -Force -Path "plugins\party" | Out-Null
          copy "tune-server\tests\fixtures\plugins\party\main.wasm" "plugins\party\"
          copy "tune-server\tests\fixtures\plugins\party\manifest.json" "plugins\party\"
          @"
          !include "MUI2.nsh"
          Name "Tune Server"
          OutFile "${{ env.ARTIFACT }}-setup.exe"
          ; Per-user install (like VS Code / Discord): a writable location so
          ; the in-app auto-updater can replace tune-server.exe without admin
          ; rights. A Program Files install could not self-update (Dominique).
          InstallDir "`$LOCALAPPDATA\Programs\Tune Server"
          RequestExecutionLevel user

          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "French"

          Section "Install"
            ; Kill any running tune-server.exe so Windows releases the file lock
            nsExec::ExecToLog 'taskkill /F /IM tune-server.exe'
            Sleep 1500

            ; Remove stale web client files and bundled plugins from previous version
            RMDir /r "`$INSTDIR\web"
            RMDir /r "`$INSTDIR\plugins"

            SetOverwrite on
            SetOutPath "`$INSTDIR"
            File "target\${{ matrix.target }}\release\tune-server.exe"
            $daemonFile
            $ffmpegFile
            SetOutPath "`$INSTDIR\web"
            File /r "web\*.*"
            ; Bundled Party (WASM) plugin, next to tune-server.exe
            SetOutPath "`$INSTDIR\plugins\party"
            File "plugins\party\main.wasm"
            File "plugins\party\manifest.json"

            ; Launcher script
            SetOutPath "`$INSTDIR"
            FileOpen `$0 "`$INSTDIR\start-tune-server.bat" w
            FileWrite `$0 '@echo off$\r$\n'
            FileWrite `$0 'cd /d "%~dp0"$\r$\n'
            FileWrite `$0 'set "TUNE_WEB_DIR=%~dp0web"$\r$\n'
            FileWrite `$0 'set "TUNE_PORT=8888"$\r$\n'
            FileWrite `$0 'set "TUNE_OPEN_BROWSER=1"$\r$\n'
            FileWrite `$0 'set "TUNE_LOG_LEVEL=DEBUG"$\r$\n'
            FileWrite `$0 'tune-server.exe$\r$\n'
            FileClose `$0

            ; Start menu
            CreateDirectory "`$SMPROGRAMS\Tune Server"
            CreateShortcut "`$SMPROGRAMS\Tune Server\Tune Server.lnk" "`$INSTDIR\start-tune-server.bat" "" "`$INSTDIR\tune-server.exe"
            CreateShortcut "`$SMPROGRAMS\Tune Server\Uninstall.lnk" "`$INSTDIR\uninstall.exe"
            CreateShortcut "`$DESKTOP\Tune Server.lnk" "`$INSTDIR\start-tune-server.bat" "" "`$INSTDIR\tune-server.exe"

            WriteUninstaller "`$INSTDIR\uninstall.exe"

            ; Registry for Add/Remove Programs
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\TuneServer" "DisplayName" "Tune Server"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\TuneServer" "DisplayVersion" "${version}"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\TuneServer" "UninstallString" "`$INSTDIR\uninstall.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\TuneServer" "Publisher" "Mozaik Labs"
          SectionEnd

          Section "Uninstall"
            ; Kill running process before removing files
            nsExec::ExecToLog 'taskkill /F /IM tune-server.exe'
            Sleep 1000
            RMDir /r "`$INSTDIR"
            Delete "`$DESKTOP\Tune Server.lnk"
            RMDir /r "`$SMPROGRAMS\Tune Server"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\TuneServer"
          SectionEnd
          "@ | Out-File -Encoding ASCII installer.nsi
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer.nsi

      # L'installeur porte sa propre signature, distincte de celle du binaire
      # qu'il contient : c'est CE fichier que l'utilisateur double-clique, et
      # donc celui que SmartScreen juge en premier.
      - name: Sign Windows installer (si le certificat est présent)
        if: runner.os == 'Windows' && env.WIN_SIGN_CERT_BASE64 != ''
        env:
          WIN_SIGN_CERT_PWD: ${{ secrets.WIN_SIGN_CERT_PWD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "tune-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe introuvable dans le SDK Windows" }
          & $signtool.FullName sign /f $pfx /p $env:WIN_SIGN_CERT_PWD `
            /fd SHA256 /tr http://timestamp.sectigo.com /td SHA256 /v "${{ env.ARTIFACT }}-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "échec de signature de l'installeur" }
          & $signtool.FullName verify /pa /v "${{ env.ARTIFACT }}-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signature d'installeur invalide" }
          Remove-Item $pfx -Force

      # The keychain is set up before "Package (unix)" so the tarball binaries
      # get signed too — the DMG below reuses it.

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_NAME="${{ env.ARTIFACT }}.dmg"
          VERSION="${{ env.TUNE_VERSION }}"
          APP="Tune Server.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources/web"
          cp target/${{ matrix.target }}/release/tune-server "$APP/Contents/Resources/"
          # AirPlay 2 daemon: bundle it next to tune-server inside the .app so
          # find_daemon_binary/daemon_available() find it on DMG installs too.
          # The .tar.gz path already bundled it, but the DMG did not — so every
          # macOS DMG user fell back to unauthenticated AirPlay 1 and any AirPlay 2
          # receiver requiring pairing/auth failed with SETUP 403 (Vincent
          # Guillemin / VUmètre, Luxman NT-07, v0.8.359). Only if it built for
          # this target — never ship a placeholder (defeats the AirPlay 1 fallback).
          if [ -f "$RUNNER_TEMP/apd/bin/airplay-daemon" ]; then
            cp "$RUNNER_TEMP/apd/bin/airplay-daemon" "$APP/Contents/Resources/"
          fi
          # ffmpeg minimal (#1524) : dans Resources/, à côté de tune-server —
          # là où resolve_tool() regarde en premier sur une installation DMG.
          if [ -f "$RUNNER_TEMP/ffbundle/ffmpeg" ]; then
            cp "$RUNNER_TEMP/ffbundle/ffmpeg" "$APP/Contents/Resources/"
            chmod 755 "$APP/Contents/Resources/ffmpeg"
            if [ -f "$RUNNER_TEMP/ffbundle/FFMPEG-LICENSE.txt" ]; then
              cp "$RUNNER_TEMP/ffbundle/FFMPEG-LICENSE.txt" "$APP/Contents/Resources/"
            fi
          fi
          cp -r web/* "$APP/Contents/Resources/web/"
          # Bundle the Party (WASM) plugin beside tune-server inside the .app so
          # the plugins-wasm runtime discovers it (plugins/ resolves exe-relative,
          # i.e. Contents/Resources/plugins/). Without this, DMG installs would
          # ship the runtime but never load Party. Sourced from the committed
          # fixture; the wasm is not rebuilt.
          mkdir -p "$APP/Contents/Resources/plugins/party"
          cp tune-server/tests/fixtures/plugins/party/main.wasm "$APP/Contents/Resources/plugins/party/"
          cp tune-server/tests/fixtures/plugins/party/manifest.json "$APP/Contents/Resources/plugins/party/"
          # AppleScript launcher — responds to Apple Events, launches server in background, opens browser
          cat > /tmp/tune-launcher.applescript << 'ASCRIPT'
          on run
            set appPath to (path to me as text)
            set posixApp to POSIX path of appPath
            set resDir to posixApp & "Contents/Resources/"
            set serverBin to quoted form of (resDir & "tune-server")
            set webDir to quoted form of (resDir & "web")
            set logFile to (POSIX path of (path to home folder)) & "Library/Logs/tune-server.log"
            do shell script "export TUNE_WEB_DIR=" & webDir & "; export TUNE_PORT=8888; " & serverBin & " >> " & quoted form of logFile & " 2>&1 &"
            delay 1
            open location "http://localhost:8888"
          end run
          ASCRIPT
          osacompile -o "$APP/Contents/MacOS/Tune Server.app" /tmp/tune-launcher.applescript
          # Move the compiled applet contents into our app structure
          mv "$APP/Contents/MacOS/Tune Server.app/Contents/MacOS/applet" "$APP/Contents/MacOS/Tune Server"
          mv "$APP/Contents/MacOS/Tune Server.app/Contents/Resources/Scripts" "$APP/Contents/Resources/Scripts"
          rm -rf "$APP/Contents/MacOS/Tune Server.app"
          cat > "$APP/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Tune Server</string>
            <key>CFBundleDisplayName</key><string>Tune Server</string>
            <key>CFBundleIdentifier</key><string>fr.mozaiklabs.tune-server</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>Tune Server</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSAppleScriptEnabled</key><true/>
          </dict>
          </plist>
          PLIST
          if [ -n "$APPLE_TEAM_ID" ]; then
            IDENTITY="Developer ID Application: Bertrand Clech ($APPLE_TEAM_ID)"
            # #1641 — même permission que pour le tarball, et pour la même
            # raison : sans elle le runtime durci refuse le `dlopen` de
            # libonnxruntime.dylib et l'analyse acoustique reste à 0 %. Le .app
            # était le SECOND chemin macOS, aussi nu que le premier.
            DROITS="$GITHUB_WORKSPACE/packaging/macos/tune-server.entitlements"
            codesign --force --options runtime --entitlements "$DROITS" --sign "$IDENTITY" "$APP/Contents/Resources/tune-server"
            # Sign the nested AirPlay 2 daemon BEFORE the outer .app (inside-out
            # signing) so the bundle stays valid and notarization does not reject
            # an unsigned executable.
            if [ -f "$APP/Contents/Resources/airplay-daemon" ]; then
              codesign --force --options runtime --sign "$IDENTITY" "$APP/Contents/Resources/airplay-daemon"
            fi
            if [ -f "$APP/Contents/Resources/ffmpeg" ]; then
              codesign --force --options runtime --sign "$IDENTITY" "$APP/Contents/Resources/ffmpeg"
            fi
            codesign --force --options runtime --sign "$IDENTITY" "$APP"
            # Garde #1641, jumelle de celle du tarball : on relit la signature
            # produite sur le binaire IMBRIQUÉ, celui qui fera le `dlopen`.
            # Signer le .app par-dessus ne resigne pas ce binaire, mais un
            # `--force` mal placé le ferait — et la permission repartirait en
            # silence.
            if codesign -d --entitlements - --xml "$APP/Contents/Resources/tune-server" 2>/dev/null \
                 | grep -q "com.apple.security.cs.disable-library-validation"; then
              echo "OK — $APP/Contents/Resources/tune-server porte disable-library-validation (#1641)"
            else
              echo "::error::Le tune-server du .app est signé en runtime durci SANS com.apple.security.cs.disable-library-validation — l'analyse acoustique (CLAP) ne pourra pas charger libonnxruntime.dylib (#1641)."
              exit 1
            fi
          fi
          DMG_DIR="dmg-staging"
          mkdir -p "$DMG_DIR"
          cp -R "$APP" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          sync
          # `hdiutil create` ecrit une image temporaire non compressee AVANT de
          # la compresser : il lui faut plusieurs fois la taille du bundle en
          # espace libre. Sur la v0.9.119 (aarch64-apple-darwin) les trois
          # tentatives sont tombees sur « No space left on device » — le runner
          # GitHub arrive deja bien rempli. On rend donc l'espace occupe par des
          # runtimes de simulateur dont ce workflow ne se sert jamais.
          # Pas de nettoyage de disque ici. Trois tentatives, deux trains morts,
          # zero octet libere :
          #
          #   #2696  supprimait trois chemins choisis de memoire — ils n'existent
          #          pas sur ces images : 105 Gi avant, 105 Gi apres (v0.9.120).
          #   #2721  ajoutait `du -x -d 1 -g /` pour « savoir ce qui occupe la
          #          machine » — il parcourt le disque entier : les deux builds
          #          macOS de la v0.9.122 ont EXPIRE au delai de 75 minutes.
          #   #2757  retirait le `du` mais gardait `sudo rm -rf Xcode_*.app` —
          #          effacer une installation Xcode coute des dizaines de Go en
          #          centaines de milliers de fichiers. Create DMG est passe de
          #          25 s (v0.9.119/120/121) a 23 MINUTES sur la v0.9.123.
          #
          # Le seul incident qui motivait tout ca — `No space left on device` sur
          # la v0.9.119 — ne s'est jamais reproduit : les runners suivants avaient
          # 93 a 105 Gi libres. C'etait une anomalie d'image, pas un manque
          # structurel. On garde donc la seule chose qui ne coute rien et qui
          # aurait suffi a le diagnostiquer : la mesure, et l'alerte.
          # `timeout` n'existe pas sur macOS : on borne a la main. Sans cela une
          # commande reseau qui ne rend jamais la main tient le job jusqu'au
          # delai de 75 minutes, sans une ligne de journal — c'est exactement ce
          # qui a tue la v0.9.123 (36 minutes de silence apres `created: …dmg`).
          avec_borne() {
            local secondes="$1"; shift
            "$@" & local pid=$!
            ( sleep "$secondes"; kill -9 "$pid" 2>/dev/null ) & local chien=$!
            wait "$pid"; local code=$?
            kill "$chien" 2>/dev/null || true
            return $code
          }

          # Nettoyage CONDITIONNEL. Mesure du 29/08 (v0.9.123) : la passe libere
          # bien 51 Gi, mais elle coute 5 min 19 — et le runner avait deja 104 Gi
          # libres. Payer cinq minutes pour de la place dont on n'a pas besoin n'a
          # aucun sens. On ne nettoie donc QUE sous le seuil.
          libre=$(df -g / | awk 'NR==2 {print $4}')
          echo "Espace libre avant hdiutil : ${libre} Gi"
          if [ "$libre" -lt 40 ]; then
            echo "Sous 40 Gi — liberation des installations Xcode inutilisees."
            xcode_actif="$(xcode-select -p 2>/dev/null | sed 's#/Contents/Developer##')"
            echo "  Xcode actif (preserve) : ${xcode_actif:-inconnu}"
            for c in /Applications/Xcode_*.app \
                     /Library/Developer/CoreSimulator/Profiles/Runtimes \
                     ~/Library/Developer/CoreSimulator \
                     ~/Library/Developer/Xcode/DerivedData \
                     ~/Library/Android; do
              [ -e "$c" ] || continue
              [ "$c" = "$xcode_actif" ] && { echo "  garde (actif) : $c"; continue; }
              echo "  supprime : $c"
              sudo rm -rf "$c" || true
            done
            libre=$(df -g / | awk 'NR==2 {print $4}')
            echo "Espace libre apres : ${libre} Gi"
          fi
          if [ "$libre" -lt 15 ]; then
            echo "::warning::moins de 15 Gi libres avant hdiutil — la creation du DMG risque d'echouer"
            df -h /
          fi
          dmg_cree=""
          for i in 1 2 3; do
            sleep 10
            if hdiutil create -volname "Tune Server" -srcfolder "$DMG_DIR" -ov -format UDZO "$DMG_NAME"; then
              dmg_cree="oui"
              break
            fi
            echo "::warning::hdiutil create a echoue (essai $i/3)"
            df -h /
          done
          # Sans ce garde, l'echec ne se voyait qu'une etape plus loin, sur un
          # `codesign` portant un fichier inexistant — un message qui ne parle
          # pas de la vraie cause.
          if [ -z "$dmg_cree" ]; then
            echo "::error::hdiutil create a echoue 3 fois — DMG non produit (voir l'espace disque ci-dessus)"
            exit 1
          fi
          # C'est CE codesign qui a bloque la v0.9.123 : 36 minutes de silence
          # entre `created: …dmg` et l'annulation du job. Il joint les serveurs
          # d'Apple et n'a ni borne ni reprise, contrairement a celui de
          # `Package (unix)`. On lui donne les deux.
          if [ -n "$APPLE_TEAM_ID" ]; then
            signe=""
            for i in 1 2 3 4 5; do
              if avec_borne 180 codesign --force --sign "$IDENTITY" "$DMG_NAME"; then
                signe="oui"; break
              fi
              echo "::warning::codesign du DMG a echoue ou depasse 180 s (essai $i/5) — nouvelle tentative dans $((i * 20)) s"
              sleep $((i * 20))
            done
            if [ -z "$signe" ]; then
              echo "::error::codesign du DMG a echoue 5 fois — serveurs Apple injoignables"
              exit 1
            fi
          fi

      # Le .tar.gz macOS n'a RIEN à voir avec la notarisation : il n'est pas
      # ouvert par Gatekeeper. Tant que l'envoi des artefacts venait après
      # cette étape, un refus d'Apple l'emportait avec le DMG — v0.9.71, 401
      # sur un mot de passe applicatif révoqué : quatre fichiers macOS perdus,
      # dont deux sans aucune raison, et la catégorie macOS a disparu de la
      # page de téléchargement.
      #
      # Un DMG non tamponné, lui, ne doit JAMAIS sortir : Gatekeeper le
      # refuserait chez l'utilisateur, ce qui est pire qu'un fichier absent.
      # On le supprime donc plutôt que de le publier à moitié, et l'étape
      # échoue quand même — la préflight doit continuer de voir le défaut.
      - name: Notarize DMG (macOS)
        if: runner.os == 'macOS'
        env:
          # Preferred path: App Store Connect API key (survives Apple ID
          # account trouble — the password flow started returning 401s even
          # after the account was rehabilitated). Falls back to the legacy
          # Apple ID + app-specific password pair, then to skipping.
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_NAME="${{ env.ARTIFACT }}.dmg"
          JOURNAL_SOUMISSION="$RUNNER_TEMP/notarytool-submit.log"

          # ─── Un refus d'Apple et une coupure réseau ne sont PAS la même
          # panne, et n'appellent pas la même conclusion. ─────────────────
          #
          # Jusqu'à la v0.9.102 elles partageaient la même sortie :
          # `submit --wait || notarize_failed`, qui se déclenchait sur
          # N'IMPORTE quel code non nul, criait « REFUSÉE par Apple » et
          # supprimait le DMG. Le 23/08 à 21:50:15, ce qui a pris cette
          # sortie n'était pas un verdict d'Apple mais un
          # `NSURLErrorDomain Code=-1009 / No network route` côté runner,
          # onze secondes après une soumission qu'Apple a bel et bien
          # ACCEPTÉE. Le DMG Intel a été détruit, la v0.9.102 publiée sans
          # lui, et le message envoyait chercher la panne du côté des
          # secrets ASC_API_KEY_*, qui n'y étaient pour rien.
          #
          # Les reprises ajoutées par #2329 entourent `stapler`, donc
          # s'exécutent APRÈS ce bloc : un `exit 1` parti d'ici ne les
          # atteint jamais. D'où ce correctif, en amont.
          #
          # La règle de sécurité, elle, ne bouge pas : un DMG non tamponné
          # ne sort JAMAIS — Gatekeeper le refuserait chez l'utilisateur,
          # ce qui est pire qu'un fichier absent. Toutes les sorties en
          # échec suppriment donc le DMG. Ce qui change, c'est qu'aucune
          # ne le fait plus sans avoir demandé son verdict à Apple, et
          # qu'aucune ne raconte plus une cause qu'elle n'a pas constatée.
          echec_avant_soumission() {
            echo "::error::Notarisation impossible — « notarytool submit » a échoué (code $1) AVANT d'obtenir un identifiant de soumission : Apple n'a jamais vu ce DMG, il n'y a aucun verdict à interroger. Le DMG ne sera pas publié ; les .tar.gz macOS restent valides et sont publiés. Journal de la soumission ci-dessus."
            rm -f "$DMG_NAME"
            exit 1
          }
          refus_dapple() {
            echo "::error::Notarisation REFUSÉE par Apple — verdict « $1 » relu sur la soumission $2. Le DMG ne sera pas publié ; les .tar.gz macOS restent valides et sont publiés. Détail du refus : « xcrun notarytool log $2 »."
            rm -f "$DMG_NAME"
            exit 1
          }
          verdict_inattendu() {
            echo "::error::Notarisation interrompue et verdict inconnu de ce workflow : la soumission $2 rend l'état « $1 ». Le DMG ne sera pas publié, par précaution. Relire « xcrun notarytool info $2 » avant de conclure."
            rm -f "$DMG_NAME"
            exit 1
          }
          transport_coupe() {
            echo "::error::Notarisation INDÉTERMINÉE — la liaison avec le service Apple a été coupée pendant l'attente du verdict. Ce n'est PAS un refus d'Apple, et ce n'est pas un problème d'identifiants : la soumission $1 est déposée, son état n'a simplement pas pu être relu après 5 tentatives. Le DMG ne sera pas publié ; les .tar.gz macOS restent valides et sont publiés. Vérifier avec « xcrun notarytool info $1 » : si l'état est « Accepted », relancer ce job sur le tag suffit, sans resoumettre."
            rm -f "$DMG_NAME"
            exit 1
          }
          # Relit l'état RÉEL d'une soumission déjà déposée. C'est la seule
          # façon de savoir si le DMG est publiable quand `--wait` s'est
          # fait couper : l'identifiant est toujours connu à ce moment-là,
          # « Submission ID received » précède l'attente du verdict.
          #
          # Cinq essais, 10 s puis 20, 30, 40 : la panne qui amène ici est
          # transitoire par nature, et cent secondes tiennent largement
          # dans un job plafonné à 75 minutes.
          verdict_de_la_soumission() {
            local id="$1"
            local essai statut
            for essai in 1 2 3 4 5; do
              statut=$(xcrun notarytool info "$id" "${AUTH[@]}" 2>/dev/null \
                       | sed -n 's/^ *status: *//p' | head -n 1)
              if [ -n "$statut" ] && [ "$statut" != "In Progress" ]; then
                printf '%s' "$statut"
                return 0
              fi
              if [ "$essai" -lt 5 ]; then
                echo "État de la soumission $id non concluant (« ${statut:-injoignable} ») — nouvel essai dans ${essai}0 s ($essai/5)." >&2
                sleep "${essai}0"
              fi
            done
            return 1
          }
          # Le ticket n'existe pas à l'instant où Apple répond « Accepted » :
          # il apparaît sur son CDN quelques secondes plus tard. D'ici là
          # `stapler` rend « could not find ticket » — et comme cette étape
          # tourne sous `bash -e`, elle mourait là, en emportant un DMG
          # PARFAITEMENT notarisé.
          #
          # Cinq essais, 10 s puis 20, 30, 40 : cent secondes d'attente au
          # pire, dans un job plafonné à 75 minutes.
          staple_avec_reprises() {
            local essai
            for essai in 1 2 3 4 5; do
              if xcrun stapler staple "$DMG_NAME"; then
                echo "Ticket agrafé (essai $essai/5)."
                return 0
              fi
              if [ "$essai" -lt 5 ]; then
                echo "Ticket pas encore publié par Apple — nouvel essai dans ${essai}0 s ($essai/5)."
                sleep "${essai}0"
              fi
            done
            return 1
          }
          # Les identifiants sont rassemblés une fois : `submit` et `info`
          # doivent parler au même compte, sans quoi le rattrapage ci-dessous
          # interrogerait dans le vide.
          if [ -n "$ASC_API_KEY_P8" ]; then
            KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
            # printf '%s' via the env var keeps the PEM newlines intact and
            # avoids any shell interpretation of the key content.
            printf '%s' "$ASC_API_KEY_P8" > "$KEY_FILE"
            trap 'rm -f "$KEY_FILE"' EXIT
            AUTH=(--key "$KEY_FILE" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID")
          elif [ -n "$APPLE_ID" ]; then
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          else
            echo "No notarization credentials, skipping notarization"
            exit 0
          fi
          # La sortie de `submit` est CONSERVÉE : elle porte l'identifiant de
          # soumission, seule prise pour retrouver le verdict si la liaison
          # casse en vol. `tee` la laisse visible dans le journal du job.
          set +e
          xcrun notarytool submit "$DMG_NAME" "${AUTH[@]}" \
            --wait --timeout 600 2>&1 | tee "$JOURNAL_SOUMISSION"
          CODE_SUBMIT=${PIPESTATUS[0]}
          set -e
          if [ "$CODE_SUBMIT" -ne 0 ]; then
            ID_SOUMISSION=$(sed -n 's/^ *id: *//p' "$JOURNAL_SOUMISSION" | head -n 1)
            if [ -z "$ID_SOUMISSION" ]; then
              echec_avant_soumission "$CODE_SUBMIT"
            fi
            echo "::warning::« notarytool submit --wait » s'est interrompu (code $CODE_SUBMIT), mais la soumission $ID_SOUMISSION est déposée chez Apple. Son état réel est relu AVANT toute destruction du DMG."
            STATUT=$(verdict_de_la_soumission "$ID_SOUMISSION") || transport_coupe "$ID_SOUMISSION"
            case "$STATUT" in
              Accepted)
                echo "Verdict relu : Accepted. La coupure était côté transport — le DMG est notarisé et reste publiable."
                ;;
              Invalid|Rejected)
                refus_dapple "$STATUT" "$ID_SOUMISSION"
                ;;
              *)
                verdict_inattendu "$STATUT" "$ID_SOUMISSION"
                ;;
            esac
          fi
          # Un DMG non tamponné ne doit JAMAIS sortir : Gatekeeper le refuserait
          # chez l'utilisateur, ce qui est pire qu'un fichier absent. Mais on
          # ne le jette qu'après avoir vraiment essayé.
          if ! staple_avec_reprises; then
            echo "::error::Notarisation ACCEPTÉE par Apple, mais ticket non agrafé après 5 essais — le DMG ne sera pas publié. Relancer ce job sur le tag suffit : la soumission est déjà acceptée côté Apple."
            rm -f "$DMG_NAME"
            exit 1
          fi

      # `always()` : les artefacts déjà construits partent même si la
      # notarisation a échoué. Le DMG a été supprimé juste au-dessus dans ce
      # cas, donc seul ce qui est publiable monte.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}.${{ matrix.ext }}
            ${{ env.ARTIFACT }}.dmg
            ${{ env.ARTIFACT }}-setup.exe
          retention-days: 1
          if-no-files-found: warn

  # ─── La porte : rien ne se crée avant le préflight ET les builds ───────
  #
  # `needs: build` + `if: always()` faisait tourner ce job MEME quand le
  # préflight était rouge et que toute la chaîne de construction avait été
  # sautée : `always()` neutralise le résultat des `needs`. Le job créait
  # alors un BROUILLON de release, avec un SHA256SUMS vide pour seul actif —
  # le préflight bloquait la construction, mais la porte de la release restait
  # grande ouverte derrière lui.
  #
  # La condition nomme donc les deux dépendances, explicitement :
  # - `preflight` : aucune release, même en brouillon, sur un préflight rouge ;
  # - `build`     : la matrice porte `fail-fast: false`, son résultat n'est
  #                 `success` que si les six cibles ont abouti. Un demi-jeu
  #                 d'artefacts ne crée plus de brouillon — `publish` exigeait
  #                 déjà `needs.build.result == 'success'`, ce brouillon-là
  #                 n'aurait de toute façon jamais été publié.
  #
  # Pas de `always()` ici, à la différence de `publish` : sans fonction d'état
  # dans la condition, GitHub y ajoute son `success()` implicite, et un run
  # ANNULÉ ne crée donc rien non plus. Les deux égalités suffiraient à elles
  # seules ; elles sont écrites en clair pour que la porte se lise sans
  # connaître cette règle.
  release:
    name: Create Release
    needs: [preflight, build]
    if: >-
      needs.preflight.result == 'success'
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Create Release — 1 min ; marge pour les 3 essais minisign (10 min 40 au pire)
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/creer-alias-actifs-release.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Les actifs construits gardent leur nom versionne pour l'auto-update.
      # Ces copies donnent en plus un nom stable a /releases/latest/download :
      # une URL qui contient la version ne peut structurellement pas servir de
      # lien « latest » (#2121, commande d'installation Linux en 404).
      - name: Créer les alias de téléchargement Linux stables
        run: bash scripts/creer-alias-actifs-release.sh artifacts "$GITHUB_REF_NAME"

      # Les sommes sont calculées sur les artefacts DU RUN COURANT. Sur un
      # re-run partiel, ce run n'a rejoué qu'une partie des jobs : les fichiers
      # produits par un run antérieur ne sont pas dans `artifacts/` et
      # disparaissaient donc du SHA256SUMS republié — écrasé par une version
      # plus pauvre que la précédente.
      #
      # Vécu sur v0.9.71 (#1679) : macOS téléversé à 09:31 par un re-run des
      # seuls jobs Apple, SHA256SUMS régénéré à 10:30 par un autre re-run
      # partiel — 5 sommes pour 9 fichiers. Les quatre fichiers macOS étaient
      # publiés mais invérifiables, faute de ligne à comparer.
      #
      # Le fichier ne doit donc JAMAIS rétrécir : on repart de celui déjà
      # publié pour ce tag et on ne remplace que ce que ce run a réellement
      # reconstruit. Le défaut ne se déclenchait que sur une release réparée en
      # deux temps, c'est-à-dire quand quelque chose avait déjà mal tourné.
      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name '*.exe' \) -exec sha256sum {} \; > ../SHA256SUMS.run
          cd ..

          # Le SHA256SUMS déjà publié, s'il existe (absent au premier run).
          if gh release download "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
               --pattern SHA256SUMS --output SHA256SUMS.published 2>/dev/null; then
            echo "SHA256SUMS déjà publié récupéré ($(wc -l < SHA256SUMS.published) entrées)"
          else
            : > SHA256SUMS.published
            echo "aucun SHA256SUMS publié pour ${GITHUB_REF_NAME} — premier run"
          fi

          # Union, le run courant l'emportant : on repart des anciennes lignes
          # dont le NOM DE FICHIER n'a pas été reconstruit par ce run, puis on
          # ajoute tout ce que ce run a produit. Comparaison sur le basename :
          # le chemin porte le nom du répertoire d'artefact, qui varie.
          awk '{ n = $2; sub(/.*\//, "", n); print n }' SHA256SUMS.run | sort -u > .rebuilt
          awk 'NR==FNR { rebuilt[$0]=1; next }
               { n = $2; sub(/.*\//, "", n); if (!(n in rebuilt)) print }' \
              .rebuilt SHA256SUMS.published > SHA256SUMS.kept
          cat SHA256SUMS.kept SHA256SUMS.run | sort -k2 > SHA256SUMS
          rm -f SHA256SUMS.run SHA256SUMS.published SHA256SUMS.kept .rebuilt

          # Garde-fou : republier moins que ce qui existait est toujours une
          # régression, quelle qu'en soit la cause.
          before=$(gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
                     --json assets --jq '[.assets[].name | select(test("SHA256SUMS")|not)] | length' 2>/dev/null || echo 0)
          echo "--- SHA256SUMS republié : $(wc -l < SHA256SUMS) entrées (release : ${before} assets binaires) ---"
          cat SHA256SUMS

      # Sign SHA256SUMS with minisign so the self-update client can verify the
      # release cryptographically (audit item 8). No-ops until MINISIGN_SECRET_KEY
      # is configured, so releases keep working during rollout. The client only
      # enforces once its embedded public key is set (UPDATE_PUBLIC_KEY).
      - name: Sign checksums (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY not set — skipping release signing"
            exit 0
          fi
          # Le pire endroit du workflow pour un blocage apt : tous les binaires
          # sont construits, les sommes calculees, et la release ne sortirait
          # jamais.
          #
          # On BORNE, mais on n'abandonne pas la signature : `UPDATE_PUBLIC_KEY`
          # est renseignee dans routes/system/update.rs, donc le client EXIGE
          # SHA256SUMS.minisig. Une release non signee casserait la mise a jour
          # automatique de tout le parc — bien pire qu'une release en retard.
          # Trois essais bornes, puis on echoue en le disant.
          for essai in 1 2 3; do
            if timeout 100 sudo apt-get update && timeout 100 sudo apt-get install -y minisign; then
              break
            fi
            if [ "$essai" -eq 3 ]; then
              echo "::error::minisign non installable apres 3 essais — SHA256SUMS ne peut pas etre signe, et le client refuserait la mise a jour. Relancer ce job quand le miroir Ubuntu repond."
              exit 1
            fi
            echo "::warning::apt a echoue ou depasse le delai (essai $essai/3) — nouvel essai dans 20 s"
            sudo rm -rf /var/lib/apt/lists/*
            sleep 20
          done
          # minisign needs the 2-line key format (comment + base64). The secret
          # may be stored with or without the leading "untrusted comment:" line,
          # so reconstruct it when absent.
          case "$MINISIGN_SECRET_KEY" in
            "untrusted comment:"*) printf '%s\n' "$MINISIGN_SECRET_KEY" ;;
            *) printf 'untrusted comment: minisign encrypted secret key\n%s\n' "$MINISIGN_SECRET_KEY" ;;
          esac > minisign.key
          minisign -S -s minisign.key -m SHA256SUMS -x SHA256SUMS.minisig
          rm -f minisign.key
          echo "Signed SHA256SUMS -> SHA256SUMS.minisig"

      # `draft: true` — la release naît INVISIBLE des clients.
      #
      # Ce job a longtemps porté `if: always()` : il tournait aussi quand des
      # builds avaient échoué, et publiait ce demi-résultat au monde entier
      # — il ne démarre plus du tout dans ce cas (voir la porte). v0.9.71 :
      # release visible à 19:15 avec 7 assets sur 13, run terminé en échec le
      # lendemain à 07:45 — douze heures pendant lesquelles le client de mise à
      # jour de Jean Valjean a cherché un SHA256SUMS incomplet, et pendant
      # lesquelles on lui a répondu que son réseau était en cause (#1588).
      #
      # La bascule en public est faite par le job `publish`, tout en bas, une
      # fois TOUT déposé — image Tune OS comprise, elle qui s'attachait
      # jusqu'ici à une release déjà visible.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.exe
            SHA256SUMS*
          generate_release_notes: true
          # Pre-release tags carry a suffix (e.g. v0.9.0-rc2); stable tags are
          # plain vX.Y.Z. Mark suffixed tags as pre-releases and keep them off
          # the "Latest" slot so stable clients' auto-update never picks up an RC.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  # ─── Release autonomy phase 4 — Homebrew + forum auto-publish ──────
  # Docker Hub publication is handled separately by docker.yml on the
  # same tag, so no docker job here.

  # L'image appliance DEBIAN n'est plus construite ni publiee.
  #
  # Elle etait declaree depreciee — remplacee par l'ISO Fedora et l'image
  # flashable du depot renesenses/tune-os — mais la chaine continuait de la
  # produire a chaque release. La page /download offrait donc DEUX images x86
  # sous le meme numero de version, l'une Fedora et l'autre Debian, sans que
  # rien ne dise laquelle prendre. Benjithom s'etait deja trompe de fichier
  # entre l'ISO et l'image a graver ; un troisieme candidat d'un AUTRE systeme
  # d'exploitation rendait le choix intenable.
  #
  # Une deprecation qui n'est pas appliquee a la chaine de construction n'est
  # pas une deprecation : c'est un cout de maintenance double d'une confusion
  # chez l'utilisateur.
  #
  # `.github/workflows/tune-os.yml` est conserve avec son `workflow_dispatch` :
  # reconstruire une image Debian a posteriori reste possible a la main, si un
  # utilisateur historique en a besoin. Ce qui disparait, c'est sa production
  # automatique a chaque version.

  # ─── La bascule en public ──────────────────────────────────────────────
  #
  # Seul endroit du workflow qui rend une release visible des clients. Elle
  # ne s'ouvre que si TOUT a abouti : les binaires (`build`), leur dépôt et
  # leurs sommes de contrôle (`release`).
  #
  # `always()` est conservé : il permet au job de s'évaluer même si un `needs`
  # est SAUTÉ, et les conditions qui suivent font le tri — un `failure` ne
  # passe pas. Sans lui, une branche sautée laisserait la release en brouillon
  # pour toujours, ce qui est déjà arrivé.
  #
  # ⚠️ Ce bloc mentionnait un troisième `needs`, `tune-os-image`, qui
  # construisait l'image appliance DEBIAN. Ce job a été retiré (voir plus
  # haut) ; sa dépendance devait l'être aussi, sans quoi le workflow échouait
  # au chargement sur un `needs` vers un job inexistant — et la release ne
  # serait jamais publiée.
  publish:
    name: Stage release (keep the draft)
    needs: [build, release]
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Publish release — <1 min
    permissions:
      contents: write
    outputs:
      promoted: ${{ steps.gate.outputs.promoted }}
      version: ${{ steps.gate.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Vérifier que la release staged est complète
        id: gate
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Ce qui est publié doit être vérifiable : SHA256SUMS est la
          # sentinelle que le client de mise à jour va chercher en premier.
          # S'il manque, ne rien montrer plutôt que montrer un demi-état.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --json assets --jq '.assets[].name' | grep -qx 'SHA256SUMS'; then
            echo "::error::SHA256SUMS absent de $TAG — la release reste en brouillon."
            exit 1
          fi
          DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          [ "$DRAFT" = true ] || {
            echo "::error::$TAG est déjà publique avant la promotion coordonnée"
            exit 1
          }
          echo "promoted=false" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Release $TAG complète et conservée en brouillon."

  stage-docker:
    name: Stage Docker image
    needs: publish
    # Un workflow appele ne peut PAS obtenir plus de permissions que le job
    # qui l'appelle. `docker.yml` demande `packages: write` pour pousser
    # l'image ; ce workflow-ci n'accorde globalement que `contents: write`.
    # Sans ce bloc, GitHub refuse le fichier ENTIER avant de lancer le
    # moindre job — `startup_failure`, zero job, aucun message dans les
    # journaux. C'est ce qui a bloque le train de la v0.9.128 le 30/08 :
    # trois tentatives identiques, et ni actionlint ni le dry-run du
    # controleur ne peuvent l'attraper (l'un ne resout pas les permissions
    # entre workflows, l'autre s'arrete aux tags).
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  stage-os:
    name: Stage Tune OS images
    needs: publish
    uses: ./.github/workflows/trigger-os-images.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  staging-complete:
    name: Release staging complete
    needs: [publish, stage-docker, stage-os]
    if: >-
      always()
      && needs.publish.result == 'success'
      && needs.stage-docker.result == 'success'
      && needs.stage-os.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Attester la matrice staged
        run: |
          {
            echo "## v${{ needs.publish.outputs.version }} entierement staged"
            echo
            echo "- GitHub Release serveur : draft"
            echo "- Docker : staging-v${{ needs.publish.outputs.version }}"
            echo "- Tune OS : trois images et leurs checksums sur une release draft"
            echo "- aucun canal stable promu"
          } >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    name: Update Homebrew tap
    needs: publish
    # Stable tags only — never push a pre-release (vX.Y.Z-rc*) to the tap,
    # or `brew upgrade` would move stable users onto an RC.
    if: >-
      needs.publish.outputs.promoted == 'true'
      && startsWith(github.ref, 'refs/tags/v')
      && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Update Homebrew tap — <1 min
    steps:
      - uses: actions/checkout@v4
        with:
          repository: renesenses/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula with new version and SHAs
        id: vals
        working-directory: homebrew-tap
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          F=Formula/tune-server.rb
          if [ ! -f "$F" ]; then
            echo "::error::$F not found in tap repo"
            exit 1
          fi

          # Extract old version from formula (POSIX-compatible, no grep -P)
          OLD_VERSION=$(sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' "$F")
          if [ -z "$OLD_VERSION" ]; then
            echo "::error::Could not extract version from $F"
            exit 1
          fi
          echo "Updating $OLD_VERSION → $VERSION"

          # Update version string and caveats
          sed -i "s|version \"${OLD_VERSION}\"|version \"${VERSION}\"|g" "$F"
          sed -i "s|Tune Server v${OLD_VERSION}|Tune Server v${VERSION}|g" "$F"

          # Garantir le caveat de redémarrage après mise à jour (vécu v0.9.71 :
          # binaire upgradé mais ancien processus toujours en mémoire → « la
          # MAJ ne marche pas »). Le job ne fait que des sed ciblés, donc la
          # ligne posée sur le tap survit normalement — cette étape la répare
          # si la formule est un jour recréée sans elle. Idempotent.
          if ! grep -q "Après une mise à jour, redémarrez le serveur" "$F"; then
            perl -0pi -e 's/(      Background service: brew services start tune-server\n)/$1\n      Après une mise à jour, redémarrez le serveur :\n      brew services restart tune-server (ou relancez tune-server-launcher).\n/' "$F"
            if ! grep -q "Après une mise à jour, redémarrez le serveur" "$F"; then
              echo "::warning::Caveat de redémarrage introuvable et point d'ancrage absent — à reporter à la main dans le tap"
            fi
          fi

          # Update all download URLs — use regex to catch ANY old version, not just OLD_VERSION
          # This handles cases where the formula has stale versions from failed previous updates
          sed -i -E "s|/v[0-9]+\.[0-9]+\.[0-9]+/|/v${VERSION}/|g" "$F"
          sed -i -E "s|tune-server-v[0-9]+\.[0-9]+\.[0-9]+-|tune-server-v${VERSION}-|g" "$F"

          # Safety: verify all URLs now point to the correct version
          BAD_URLS=$(grep -n "tune-server-v" "$F" | grep -v "tune-server-v${VERSION}" || true)
          if [ -n "$BAD_URLS" ]; then
            echo "::error::Formula still has wrong version in URLs after sed:"
            echo "$BAD_URLS"
            exit 1
          fi

          # Recompute SHA256 for each platform tarball
          BASE="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          for PLATFORM in macos-aarch64 macos-x86_64 linux-aarch64 linux-x86_64; do
            FILE="tune-server-v${VERSION}-${PLATFORM}.tar.gz"
            URL="${BASE}/${FILE}"
            echo "Fetching ${PLATFORM}..."
            for i in 1 2 3 4 5; do
              if curl -fL --retry 0 -o "/tmp/${FILE}" "$URL"; then break; fi
              echo "  attempt $i failed, retrying in 10s..."
              sleep 10
            done
            NEW_SHA=$(sha256sum "/tmp/${FILE}" | cut -d' ' -f1)
            # Find the sha256 line that follows this platform's url line
            OLD_SHA=$(grep -A1 "${PLATFORM}" "$F" | sed -n 's/^[[:space:]]*sha256 "\([0-9a-f]*\)".*/\1/p')
            if [ -n "$OLD_SHA" ]; then
              sed -i "s|${OLD_SHA}|${NEW_SHA}|" "$F"
              echo "  ${PLATFORM}: ${OLD_SHA} → ${NEW_SHA}"
            else
              echo "::warning::Could not find SHA for ${PLATFORM}"
            fi
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "── Updated formula ──"
          cat "$F"

      - name: Commit and push to tap
        working-directory: homebrew-tap
        run: |
          git config user.email "renesenses-bot@users.noreply.github.com"
          git config user.name  "renesenses-bot"
          git add Formula/tune-server.rb
          git diff --cached --quiet && echo "Formula already up to date" && exit 0
          git commit -m "tune-server v${{ steps.vals.outputs.version }}"
          git push origin HEAD

  notify-website:
    name: Update mozaiklabs.fr/download
    # `publish` et non `release` : la page de téléchargement ne doit annoncer
    # qu'une release réellement publique et complète. Le webhook exige ≥3
    # assets, mais rien ne lui disait jusqu'ici que la liste était finie.
    needs: [publish, homebrew]
    # Stable tags only — a pre-release must not update the public download page.
    if: >-
      needs.publish.outputs.promoted == 'true'
      && startsWith(github.ref, 'refs/tags/v')
      && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Update mozaiklabs.fr/download — <1 min
    steps:
      - name: Notify mozaiklabs.fr webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PAYLOAD=$(gh api repos/${{ github.repository }}/releases/tags/${TAG})
          BODY=$(jq -n \
            --arg action "published" \
            --argjson release "$PAYLOAD" \
            --arg repo_name "tune-server-rust" \
            --arg repo_full "${{ github.repository }}" \
            '{action: $action, release: $release, repository: {name: $repo_name, full_name: $repo_full}}')
          SIGNATURE="sha256=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: release" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$BODY" \
            https://mozaiklabs.fr/webhooks/github/release)
          echo "Webhook response: HTTP $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "::warning::Webhook returned HTTP $STATUS — /download may not be updated"
          fi

  android:
    name: Trigger Android build (tune-server-flutter)
    needs: [publish]
    # Stable tags only — un client ne se construit pas sur une pre-release.
    if: >-
      needs.publish.outputs.promoted == 'true'
      && startsWith(github.ref, 'refs/tags/v')
      && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Trigger Android build — <1 min
    steps:
      # La CI Android existe déjà dans tune-server-flutter (APK signé +
      # Firebase App Distribution) mais son déclencheur — poser le tag v* —
      # était MANUEL et régulièrement oublié (point 14, revue 2026-08-15).
      # Ce job pose le tag automatiquement, avec deux garde-fous :
      # - le bump reste la décision de Bertrand : si `bump-all.sh --clients`
      #   n'est pas passé (pubspec ≠ tag serveur), on n'y touche pas ;
      # - jamais bloquant pour la release serveur : tout échec = warning.
      - name: Tag tune-server-flutter (déclenche sa release CI)
        env:
          TOKEN: ${{ secrets.CLIENTS_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLIENTS_REPO_TOKEN absent — Android non déclenché. Créer un PAT (contents:write sur renesenses/tune-server-flutter) et l'ajouter aux secrets."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          AUTH="Authorization: Bearer $TOKEN"
          API="https://api.github.com/repos/renesenses/tune-server-flutter"

          # Garde-fou drift : ne taguer que si le bump clients est passé.
          FLUTTER_VER=$(curl -sf -H "$AUTH" "$API/contents/pubspec.yaml?ref=main" \
            | jq -r .content | base64 -d | grep -E '^version:' | sed 's/version: *//; s/+.*//' || echo "")
          if [ "$FLUTTER_VER" != "$VER" ]; then
            echo "::warning::pubspec.yaml de tune-server-flutter ($FLUTTER_VER) ≠ tag serveur ($VER) — bump-all.sh --clients n'est pas passé, Android non déclenché."
            exit 0
          fi

          SHA=$(curl -sf -H "$AUTH" "$API/git/ref/heads/main" | jq -r .object.sha)
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "::warning::Impossible de lire le HEAD de tune-server-flutter — Android non déclenché."
            exit 0
          fi
          STATUS=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST -H "$AUTH" \
            -d "{\"ref\": \"refs/tags/${TAG}\", \"sha\": \"${SHA}\"}" \
            "$API/git/refs")
          if [ "$STATUS" = "201" ]; then
            echo "Tag ${TAG} posé sur tune-server-flutter (${SHA}) — build Android déclenchée."
          elif [ "$STATUS" = "422" ] && grep -q "already exists" /tmp/resp; then
            echo "Tag ${TAG} déjà présent sur tune-server-flutter — rien à faire."
          else
            echo "::warning::Pose du tag refusée (HTTP $STATUS) : $(cat /tmp/resp)"
          fi

  # ETEINT VOLONTAIREMENT depuis le 03/06/2026 (496fc446, « manual posts have
  # better formatting »). NE PAS rallumer sans lire #2328 : en l'etat, ce job
  # ferait du mal.
  #
  #   1. Il posterait le changelog brut de git-cliff, qui emet un lien vers le
  #      depot — PRIVE — par commit (`cliff.toml`), publiquement sur le forum.
  #   2. Un fil cree par l'API nait `moderation_status = 'pending'` : le POST
  #      repond 200, le job passe au vert, et PERSONNE ne voit le fil.
  #   3. Le corps est du Markdown ; l'API attend du HTML.
  #   4. `category: releases` n'existe pas : le champ est `type`, parmi
  #      release|discussion|bug|feature.
  #   5. Le jeton poste sous `user_id = 1`, affiche « Admin » — les notes sont
  #      signees Bertrand (18).
  #
  # Le filet, en attendant, est `notes-de-version-watch.yml` : il ne poste rien
  # et echoue bruyamment quand une version publiee reste sans fil de notes.
  forum:
    name: Announce on mozaiklabs forum
    needs: release
    if: false  # Disabled — voir le pave ci-dessus et #2328
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Announce on forum — desactive
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Build release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Write git-cliff output to an intermediate file so the
          # following assembly doesn't race with itself (cat reading
          # a file that is also the redirection target crashes with
          # "input file is output file").
          git-cliff --tag "$VERSION" --latest --output CHANGELOG_SECTION.md
          {
            echo "Version $VERSION disponible — résumé :"
            echo
            cat CHANGELOG_SECTION.md
            echo
            echo "Téléchargements : https://github.com/${GITHUB_REPOSITORY}/releases/tag/$VERSION"
            echo "Image Docker : \`renesenses/tune:$VERSION\` (multi-arch amd64/arm64)"
            echo "Homebrew : \`brew tap renesenses/tap && brew install tune-server\`"
          } > FORUM_BODY.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Post forum thread
        env:
          FORUM_TOKEN: ${{ secrets.FORUM_TOKEN }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          # Trim the body to a reasonable size (forum max ~10k).
          BODY=$(head -c 8000 FORUM_BODY.md | python3 -c "import sys, json; print(json.dumps(sys.stdin.read()))")
          TITLE="[Release] tune-server $VERSION disponible"
          PAYLOAD=$(cat <<EOF
          {
            "title": "$TITLE",
            "body": $BODY,
            "category": "releases",
            "pinned": true
          }
          EOF
          )
          STATUS=$(curl -s -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $FORUM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://mozaiklabs.fr/api/v1/forum/threads")
          echo "HTTP $STATUS"
          cat response.json
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "::error::forum POST failed with HTTP $STATUS"
            exit 1
          fi
