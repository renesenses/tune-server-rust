name: Tests (PostgreSQL)

# Dual-engine test workflow.
#
# The default `cargo test` covers SQLite. This workflow boots a real
# PostgreSQL 16 server and runs the `tune-core` AND `tune-server` tests with the
# `postgres` feature enabled.
#
# `tune-server` depuis #3123 : c'est la que vivent les requetes des ROUTES, et
# elles n'avaient jamais ete jouees sur PostgreSQL.

on:
  push:
    branches: [main, release/v0.9, "feature/postgres-support"]
    paths:
      - "tune-core/**"
      # #3123 : sans cette ligne, un push qui ne touche que `tune-server` ne
      # declenchait pas ce workflow — alors qu'il porte desormais les routes.
      - "tune-server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-postgres.yml"
  # PAS de filtre `paths` ici, delibérément (#2808).
  #
  # Avec un filtre de chemins, une PR `rc/* -> main` qui ne touche ni
  # `tune-core/**` ni les manifestes Cargo ne declenche PAS ce workflow --
  # donc une release d'infrastructure pure passait la promotion vers `main`
  # SANS qu'aucune base PostgreSQL vivante n'ait ete exercee. GitHub ne sait
  # pas conditionner `paths` a la branche cible : le filtrage se fait donc
  # dans le `if:` du job ci-dessous, qui reste le seul endroit ou l'on decide.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Meme classifieur que ci.yml, meme script, meme contre-epreuve. Il n'existe
  # ici que pour armer PostgreSQL sur les PR de lot QUI TOUCHENT DU RUST, sans
  # le rearmer sur une PR de documentation vers `batch/*`.
  #
  # Il ne calcule PAS `full` : ce job ne se decide plus sur le profil.
  impact:
    name: Impact (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classer.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classer le diff
        id: classer
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fail-closed comme ci.yml : hors PR, base introuvable ou diff
          # impossible, on declare l'impact Rust et le job PostgreSQL tourne.
          if [ "$EVENEMENT" != pull_request ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "base du diff introuvable : impact Rust par securite"
            exit 0
          fi
          if ! git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > /tmp/chemins-pg; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "diff impossible : impact Rust par securite"
            exit 0
          fi
          if bash scripts/detecter-impact-ci.sh < /tmp/chemins-pg; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Contre-épreuve du classifieur
        run: bash scripts/detecter-impact-ci.sh --autotest

  test-postgres:
    name: Test (PostgreSQL)
    needs: impact
    # Consequence de la levee du filtre `paths` : toute PR vers `main` passe
    # ici, y compris une promotion `rc/* -> main` qui ne touche aucun fichier
    # Rust. C'est exactement le trou que #2808 demandait de fermer, et les trois
    # premieres clauses ci-dessous sont celles de #2808, INTACTES.
    #
    # La quatrieme est neuve (#3123). Une PR de correctif vers `batch/*` ou
    # `rc/*` sautait PostgreSQL en entier : c'est la que vivent les P2, donc la
    # que le SQL s'ecrit, et il n'etait jamais joue sur PG avant la promotion.
    # Elle s'ajoute en UNION : rien de ce qui tournait avant ne cesse de tourner
    # — une promotion `rc/* -> main` sans une ligne de Rust reste couverte par
    # la deuxieme clause, comme #2808 l'exige. Ce qui s'ajoute, c'est la PR de
    # lot qui touche du Rust. Une PR de lot qui ne touche QUE de la
    # documentation reste hors de ce job : les quatre clauses sont fausses.
    if: >-
      github.event_name != 'pull_request'
      || (!startsWith(github.base_ref, 'batch/') && !startsWith(github.base_ref, 'rc/'))
      || contains(github.event.pull_request.labels.*.name, 'ci:full')
      || needs.impact.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # 45 et non 30 : le job compile et execute un paquet de plus (#3123). Mesure
    # du 01/09/2026 — le job tenait en 6 min 21 et 6 min 31 sur les deux
    # dernieres executions reelles, et `tune-server` ajoute une compilation
    # froide de ~4 min. Un plafond ne peut que faire echouer plus tot.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tune
          POSTGRES_PASSWORD: tune
          POSTGRES_DB: tune_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tune -d tune_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tune-core-postgres

      # Suite unique et superset des anciens jobs : elle couvre engine,
      # PostgresDb et tout tune-core avec le meme jeu postgres+oaat que le job
      # retire de ci.yml. On ne compile donc plus deux fois le crate pour deux
      # filtres qui etaient deja inclus dans cette execution.
      #
      # `-p tune-server` depuis #3123. Sur une PR de lot, ce paquet n'etait
      # compile avec la feature `postgres` par AUCUNE porte : `test` de ci.yml
      # ne l'active pas, et `test-shipped-features`, qui l'active, est derriere
      # `full`. Un bloc `#[cfg(feature = "postgres")]` de `tune-server` pouvait
      # donc casser sans que rien ne rougisse avant la promotion vers main.
      # Cout mesure sur Shrek (arbre chaud) : 4 min 47 pour tune-core seul,
      # 5 min 36 pour les deux, soit +49 s. La compilation de `tune-server` est
      # ensuite REUTILISEE par l'etape « Routes de tune-server » plus bas.
      - name: Tests tune-core et tune-server avec PostgreSQL
        run: cargo test --no-fail-fast -p tune-core -p tune-server --no-default-features --features postgres,oaat

      # Real-schema regression for #1706: the self-healing DDL in
      # `ensure_schema` and migration 026 can only be proven against an actual
      # PostgreSQL. Applies the numbered migrations first (as scripts/pg-e2e.sh
      # does), then runs the #1706 test with TUNE_TEST_PG_URL set so it does not
      # skip. Scoped to that one test on purpose: the older E2E tests stay
      # opt-in via scripts/pg-e2e.sh.
      - name: Apply PG migrations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=tune
          psql -h localhost -U tune -d tune_test -c "CREATE EXTENSION IF NOT EXISTS unaccent;"
          for migration in tune-core/migrations/postgres/*.sql; do
            echo "  $(basename "$migration")"
            psql -h localhost -U tune -d tune_test -v ON_ERROR_STOP=1 -q -f "$migration"
          done

      - name: Schema-drift regression (#1706)
        env:
          TUNE_TEST_PG_URL: postgresql://tune:tune@localhost:5432/tune_test
        run: cargo test --no-fail-fast -p tune-core --no-default-features --features postgres pg_1706 -- --nocapture

      # #2860 — « Continuer l'ecoute » et « Ajoutes recemment » sur une VRAIE
      # base. Ces requetes vivaient dans tune-server, que ce job ne compile
      # pas : elles n'etaient donc jouees que sur SQLite, qui tolere
      # precisement ce que PostgreSQL refuse. Elles sont descendues dans
      # tune-core (db/home_queries.rs) pour que cette etape les EXECUTE.
      # Le test porte ses trois contre-epreuves : il rejoue les formes
      # d'avant et exige l'erreur PostgreSQL litterale.
      - name: « Continuer l'écoute » sur PostgreSQL (#2860)
        env:
          TUNE_TEST_PG_URL: postgresql://tune:tune@localhost:5432/tune_test
        run: cargo test --no-fail-fast -p tune-core --no-default-features --features postgres pg_2860 -- --nocapture

      # #2441 — le CONTEXTE de lecture, sur une vraie base. Meme angle mort que
      # ci-dessus, une release plus tard : les deux requetes qui portent
      # « Continuer l'ecoute » depuis listen_history (la derniere ecoute de
      # chaque contexte, et la resolution des albums avec leur avancement)
      # etaient elles aussi redigees dans tune-server, que ce job ne compile
      # pas. Descendues dans tune-core (db/home_queries.rs), elles sont
      # desormais EXECUTEES ici. Le test exige les memes nombres que le test
      # SQLite jumeau : 3/5, 2/5, 1/5 de disque ecoute.
      - name: Contexte de lecture sur PostgreSQL (#2441)
        env:
          TUNE_TEST_PG_URL: postgresql://tune:tune@localhost:5432/tune_test
        run: cargo test --no-fail-fast -p tune-core --no-default-features --features postgres pg_2441 -- --nocapture

      # Parite des DEUX ecritures du schema PG (#2111). Le test monte lui-meme
      # deux bases jetables — les scripts numerotes d'un cote, PG_FULL_SCHEMA de
      # l'autre — et refuse toute colonne que le schema neuf a et qu'aucune
      # migration n'ajoute. Sans lui, la prochaine colonne oubliee se
      # decouvrirait comme les colonnes CUE : par hasard, des mois plus tard.
      # Restauration de sauvegarde : le volume fixe ne se rearme jamais et le
      # volume d'une zone armee ne se propage pas (#2395, #2477). La requete
      # `UPDATE` de `import_zones` est desormais BATIE -- elle porte ou non la
      # colonne `volume` -- et une requete batie doit rendre le meme resultat
      # sur les deux moteurs. Les memes scenarios tournent sur SQLite dans le
      # job `test` de ci.yml ; sans cette etape, PostgreSQL ne les verrait pas :
      # l'etape « Tests tune-core avec PostgreSQL » ci-dessus ne pose pas
      # TUNE_TEST_PG_URL, donc `pg_or_skip!` y saute.
      - name: Volume fixe et restauration de sauvegarde (#2395)
        env:
          TUNE_TEST_PG_URL: postgresql://tune:tune@localhost:5432/tune_test
        run: cargo test --no-fail-fast -p tune-core --no-default-features --features postgres pg_config_backup -- --nocapture

      - name: Parité du schéma PG (#2111)
        env:
          TUNE_TEST_PG_URL: postgresql://tune:tune@localhost:5432/tune_test
        run: cargo test --no-fail-fast -p tune-core --no-default-features --features postgres pg_schema_parity -- --nocapture

      # #3123 — les requetes de tune-server, ENFIN executees sur PostgreSQL.
      #
      # Toutes les etapes ci-dessus visent `tune-core`. Les 419 litteraux SQL
      # ecrits dans `tune-server/src` (54 fichiers, comptes le 01/09/2026)
      # n'avaient jamais tourne sur PostgreSQL, sur aucune branche, avec aucune
      # etiquette. #2860 puis #2441 ont chacun ete refermes en DESCENDANT la
      # requete fautive dans `tune-core` pour qu'une porte l'execute ; cette
      # etape retire cette obligation.
      #
      # Le test monte un `AppState` sur le moteur PostgreSQL — le chemin exact
      # de la production — et fait passer douze requetes HTTP par le vrai
      # routeur, bibliotheque VIDE : l'etat ou un agregat divise par zero.
      # `--test-threads=1` : le test vide ses tables, et les `TRUNCATE CASCADE`
      # s'interbloquent en parallele.
      - name: Routes de tune-server sur PostgreSQL (#3123)
        env:
          TUNE_TEST_PG_URL: postgresql://tune:tune@localhost:5432/tune_test
        run: cargo test --no-fail-fast -p tune-server --no-default-features --features postgres,oaat --test pg_routes_serveur -- --nocapture --test-threads=1

      # #3181 — les sections d'accueil qui rendaient `200 []`.
      #
      # L'etape ci-dessus ne verifie que le STATUT, et ces routes repondent
      # `200` avec un corps vide quand leur requete echoue : `SELECT DISTINCT`
      # trie sur une colonne hors liste de selection pour « Autres versions »,
      # `is_favorite = 0` sur une colonne TEXT pour « Radios recentes ». Un
      # test de statut y est aveugle par construction. Celui-ci seme des
      # lignes, exige qu'elles ressortent, et compare le corps a celui rendu
      # par le meme serveur sur SQLite — meme ensemble, meme ordre.
      - name: Sections d'accueil de #3181 sur PostgreSQL
        env:
          TUNE_TEST_PG_URL: postgresql://tune:tune@localhost:5432/tune_test
        run: cargo test --no-fail-fast -p tune-server --no-default-features --features postgres,oaat --test pg_3181_sections_accueil -- --nocapture --test-threads=1

      # #3182 — le rapport de diagnostic mentait sur son propre moteur.
      #
      # C'est la seule etape qui puisse le voir : la contre-epreuve SQLite du
      # meme fichier tourne dans `ci.yml`, mais sur SQLite le rapport disait
      # « sqlite » AVANT comme APRES la correction. Sans une vraie base
      # PostgreSQL, les deux suppositions — le litteral `- Engine: sqlite` et
      # le `else { 0 }` de la version de schema — restent invisibles a toutes
      # les portes.
      - name: Moteur annoncé dans le rapport de diagnostic (#3182)
        env:
          TUNE_TEST_PG_URL: postgresql://tune:tune@localhost:5432/tune_test
        run: cargo test --no-fail-fast -p tune-server --no-default-features --features postgres,oaat --test pg_3182_moteur_annonce_dans_le_rapport -- --nocapture --test-threads=1
