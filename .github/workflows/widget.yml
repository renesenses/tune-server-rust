name: Widget Release

# Tune Widget is a Tauri desktop mini-player, isolated from the server
# workspace (root Cargo.toml `exclude = ["tune-widget"]`). It ships on its
# own cadence, NOT with every server `v*` tag — trigger with a `widget-v*`
# tag or run manually. Reuses the same Apple signing/notarization secrets as
# release.yml.
on:
  workflow_dispatch:
  push:
    tags: ["widget-v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Sans limite explicite, GitHub laisse tourner 6 HEURES. Le 12 aout 2026, une
    # signature bloquee a consomme 95 min de silence avant une annulation
    # manuelle — elle en aurait consomme 360 sans intervention. Reference : la
    # compilation prend ~5 min, la notarisation ~45 s dans release.yml. 30 min
    # laissent une marge confortable tout en transformant un blocage en echec
    # rapide et lisible.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tune-widget/src-tauri
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tune-widget/src-tauri

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          # Version EXACTE, sans opérateur semver : install-action rejette `^2`
          # (« semver operators are not supported in 'tool' input option »).
          # Le workflow n'ayant jamais tourné avant widget-v0.1.0, l'erreur est
          # restée invisible jusqu'au premier tag.
          tool: tauri-cli@2.11.4

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then echo "No certificate, skipping"; exit 0; fi
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          # Le trousseau doit aussi etre dans la LISTE DE RECHERCHE : codesign
          # parcourt celle-ci, pas seulement le trousseau par defaut.
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p actions build.keychain
          # SANS CECI, LA SIGNATURE PEND INDEFINIMENT. Un trousseau se
          # reverrouille tout seul apres quelques minutes d'inactivite ; codesign
          # attend alors un mot de passe que personne ne saisira jamais, et le job
          # reste muet jusqu'au timeout. release.yml y echappe par chance : il
          # signe 5 secondes apres l'import. Ici `cargo tauri build` compile
          # d'abord ~5 min, et le trousseau a le temps de se refermer — c'est
          # exactement ce qui est arrive au tag widget-v0.1.0 le 12 aout 2026
          # (95 min de silence apres « Signing ... », annule a la main).
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm /tmp/certificate.p12

      # release.yml notarise via une CLE API App Store Connect et ne retombe sur
      # le mot de passe applicatif qu'a defaut. Le widget ne connaissait que la
      # seconde porte — celle qui repond 401. On ecrit donc le .p8 sur disque,
      # comme le fait release.yml, pour que Tauri emprunte la meme.
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          # Test en shell, pas dans un `if:` d'etape : le contexte `secrets`
          # n'y est pas disponible. Meme motif que release.yml.
          if [ -n "$ASC_API_KEY_P8" ]; then
            printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            echo "cle API App Store Connect ecrite"
          else
            echo "::warning::ASC_API_KEY_P8 absent — repli sur le mot de passe applicatif (APPLE_ID/APPLE_PASSWORD)"
          fi

      - name: Build signed + notarized bundle
        env:
          # Tauri v2 signe avec cette identite et, parce que de quoi notariser
          # est fourni ci-dessous, notarise et tamponne le DMG automatiquement.
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Bertrand Clech (${{ secrets.APPLE_TEAM_ID }})"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Cle API App Store Connect — le SEUL chemin d'authentification pose
          # ici, et c'est deliberé.
          #
          # J'avais d'abord garde APPLE_ID / APPLE_PASSWORD « en repli ». Erreur :
          # Tauri v2 PREFERE le couple identifiant + mot de passe applicatif
          # quand il est present, et ne regarde la cle API qu'a defaut. Le repli
          # prenait donc la main sur le chemin voulu, et la notarisation
          # continuait de repondre 401 alors que le .p8 etait bien ecrit
          # (« cle API App Store Connect ecrite » dans le journal du run
          # 31751355295, suivi du meme 401).
          #
          # Ne PAS reintroduire APPLE_ID/APPLE_PASSWORD ici : les reposer, meme
          # « au cas ou », desactive silencieusement la cle API.
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Collect DMG
        run: |
          mkdir -p ../../dist
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg ../../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: tune-widget-${{ matrix.target }}
          path: dist/*.dmg
          retention-days: 3

  release:
    name: Publish Widget Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/widget-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          find . -name '*.dmg' -exec sha256sum {} \; > ../SHA256SUMS-widget
          cd ..

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            SHA256SUMS-widget
          generate_release_notes: true
