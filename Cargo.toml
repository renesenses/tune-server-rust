[workspace]
# Union des deux cotes : ce lot ajoute `tune-http-types` et `tune-smart-http`
# (caisses extraites), `rc` ajoute `plugins/tune-concerts` (#2768). Une liste
# de membres est un inventaire, pas un echantillon — en retirer un le sort de
# `--workspace`, donc de la porte, sans que rien ne rougisse.
members = ["tune-core", "tune-http-types", "tune-server", "tune-smart-http", "tune-stream-http", "tune-streaming-http", "tune-cli", "tune-ffi", "tune-bridge", "tune-plugin-runtime-wasm", "plugins/tune-dj", "plugins/tune-karaoke", "plugins/tune-bandcamp", "plugins/tune-concerts"]
# tune-desktop and tune-widget are Tauri apps, each with its own workspace and
# release pipeline (.github/workflows/widget.yml). They are kept out of the
# server workspace so their GUI/webkit deps never enter the server CI
# (cargo fmt --all, tests, clippy) or its build matrix.
exclude = ["tune-desktop", "tune-widget"]
resolver = "2"

[workspace.package]
version = "0.9.135"
edition = "2024"
# Business Source License 1.1 (see LICENSE). SPDX id BUSL-1.1 — NOT MIT: the
# old value misdeclared far broader rights to audit/SBOM tools (issue #1147).
license = "BUSL-1.1"
authors = ["Bertrand Clech <bertrand.clech@orange.fr>"]
repository = "https://github.com/renesenses/tune-server-rust"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
lofty = "0.24"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "blocking", "query", "form", "multipart"] }
walkdir = "2"
# Décodage des pochettes pour l'empreinte perceptuelle (#1470). Uniquement
# JPEG et PNG : ce sont les seuls formats que `COVER_FILE_NAMES` accepte, et
# les codecs par défaut de la crate (AVIF, TIFF, EXR…) tireraient une dizaine
# de dépendances transitives qui ne serviraient jamais.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.10"
notify = "7"
md-5 = "0.10"
quick-xml = "0.41"
mdns-sd = "0.20"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "fs"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "postgres"] }
rusqlite = { version = "0.39", features = ["bundled", "functions"] }
urlencoding = "2"
toml = "0.8"
cpal = "0.17"
rust_cast = "0.21"
sha2 = "0.10"
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
blowfish = "0.9"
chrono = "0.4"
cbc = "0.1"
regex = "1"
csv = "1"
symphonia = { version = "0.6", features = ["mp3", "flac", "wav", "aac", "alac", "vorbis", "pcm", "isomp4", "ogg", "mkv"] }
rubato = "3"
# libopus — liaison sûre `opus` (SpaceManiac/opus-rs) au-dessus d'`opusic-sys`
# (DoumanAsh), qui embarque libopus 1.6.1 et la construit en statique.
#
# Remplace `audiopus 0.3.0-rc.0` / `audiopus_sys 0.2.2`, abandonnés depuis 2021
# et signalés par RUSTSEC-2026-0150 (#2251). Ce que le changement apporte :
#
#   * la crate est maintenue — `opus 0.4.0` (23/08/2026) et `opusic-sys 0.7.5`
#     (06/08/2026), contre une dernière publication en avril 2021 en face ;
#   * la libopus embarquée passe de la copie de 2021 à la 1.6.1 amont, dont le
#     `CMakeLists.txt` déclare `cmake_minimum_required(VERSION 3.16)`. Le SEUL
#     défaut concret que nomme l'avis — un `cmake_minimum_required` antérieur à
#     3.5 que CMake 4.x refuse — disparaît donc à la source, au lieu d'être
#     contourné par `CMAKE_POLICY_VERSION_MINIMUM=3.5` ;
#   * `opusic-sys` lie TOUJOURS en statique (`rustc-link-lib=static=opus`) et ne
#     sonde jamais `pkg-config`. Le piège hôte/cible de `Cross.toml` (#1288),
#     où le `build.rs` d'`audiopus_sys` décidait statique-vs-dynamique avec des
#     `cfg!` évalués pour l'HÔTE, n'a plus d'objet ;
#   * son `build.rs` gère explicitement le NDK Android (`ANDROID_NDK_HOME`,
#     `android.toolchain.cmake`, `ANDROID_ABI`, variables `CARGO_NDK_*`).
#
# Licences : `opus` en MIT/Apache-2.0, `opusic-sys` en BSD-3-Clause — les trois
# figurent déjà dans la liste `allow` de `deny.toml`.
opus = "0.4.0"
thiserror = "2"
unicode-normalization = "0.1"
oaat-core = { git = "https://github.com/renesenses/oaat", rev = "a5d5503", default-features = false }
oaat-controller = { git = "https://github.com/renesenses/oaat", rev = "a5d5503", default-features = false }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dotenvy = "0.15"

# Chromecast fix (#1185): rust_cast 0.21.0 with a patched TLS verifier that
# tolerates the X.509 v1 self-signed certificates presented by older
# Chromecast devices (rustls-webpki refuses to parse v1 certs, so the stock
# signature-verification helpers abort the handshake with
# `UnsupportedCertVersion` even under connect_without_host_verification).
# See vendor/rust_cast/src/lib.rs, `accept_unparseable_cert`.
[patch.crates-io]
rust_cast = { path = "vendor/rust_cast" }

[profile.dev]
opt-level = 0
debug = 0

[profile.release]
opt-level = 2
lto = "thin"
# `strip = true` est un alias de `strip = "symbols"` : il detruit la table des
# symboles, donc les NOMS dont le backtrace a besoin. Les rapports de crash
# Windows designaient alors des fonctions voisines encore exportees — des
# `onig_*` de la bibliotheque de regex — au lieu du code fautif (#2306).
# `"debuginfo"` retire les informations de debogage, mais garde les symboles.
strip = "debuginfo"
codegen-units = 4
# `panic = "abort"` neutralisait TOUS les `catch_unwind` du binaire : ceux du
# decodeur (`audio/decode.rs`), celui de l'installateur de mise a jour, et le
# hook qui ecrit `tune-crash.log`. Un seul fichier AAC malforme tuait donc le
# serveur entier, au lieu d'echouer sur ce fichier (#2305).
#
# Ce reglage venait de 40002253 (« release profile — 8.3 MB binary », 19 mai),
# une optimisation de TAILLE du debut de la migration : `tune-ffi` n'existait
# pas encore (22 juin) et l'encodeur ALAC non plus (13 aout). Ce n'etait donc
# pas un choix d'architecture lie a l'ABI (arbitrage JP Robbe).
panic = "unwind"
