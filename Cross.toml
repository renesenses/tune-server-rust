# `cross` configuration — cross-compilation inside Docker (arm64 Linux targets).
#
# ## Pourquoi : libopus lié en dynamique dans un binaire statique (#1288)
#
# `audiopus_sys` (libopus vendored, feature Opus natif livrée en v0.9.51 #1260)
# décide statique-vs-dynamique dans son `build.rs` via :
#
#     #[cfg(any(windows, target_os = "macos", target_env = "musl"))] -> statique
#     #[cfg(all(unix, target_env = "gnu"))]                          -> dynamique
#
# Piège : un build script est compilé pour l'**hôte**, pas pour la cible. En
# cross-compilation musl depuis le conteneur `cross` (hôte x86_64-gnu), ces
# `cfg!` voient `gnu` et retiennent le lien **dynamique** — alors que la cible
# est musl et que rustc passe `-static` au linker. Résultat : libopus est bien
# construite (libopus.a via CMake) mais rustc émet `-Wl,-Bdynamic -lopus`, le
# cross-linker cherche un `libopus.so` inexistant et le job
# `aarch64-unknown-linux-musl` de release.yml échoue au linkage — seule cible
# manquante des 7 depuis la v0.9.53.
#
# `LIBOPUS_STATIC` est lu depuis l'environnement (pas via `cfg!`), donc il n'est
# pas affecté par la confusion hôte/cible : il force `rustc-link-lib=static=opus`.
# `LIBOPUS_NO_PKG` court-circuite la sonde `pkg-config` pour garantir qu'on lie
# la libopus vendored de la cible et jamais une libopus système de l'hôte.
#
# Défini ici (et non dans release.yml) pour que le build musl soit reproductible
# à l'identique en local (`cross build --target aarch64-unknown-linux-musl`).
# La cible **gnu** est volontairement laissée telle quelle : elle lie libopus en
# dynamique depuis toujours et fonctionne (Docker bookworm, images Tune OS RPi).
#
# ## Depuis #2251 : ces deux variables sont INERTES
#
# `audiopus_sys` a été remplacé par `opusic-sys 0.7.5`, dont le `build.rs` ne
# lit ni `LIBOPUS_STATIC` ni `LIBOPUS_NO_PKG`. Il n'en a pas besoin : en mode
# `bundled` (celui par défaut, et le nôtre) il construit la libopus 1.6.1
# embarquée et émet TOUJOURS `cargo:rustc-link-lib=static=opus`, sans jamais
# sonder `pkg-config`. Le piège hôte/cible de #1288 n'a donc plus d'objet — il
# venait d'un `cfg!` évalué pour l'hôte, et il n'y a plus de `cfg!` du tout.
#
# Conséquence à connaître : la cible **gnu** ne lie plus libopus en dynamique.
# Toutes les cibles emportent maintenant la même libopus 1.6.1 statique — une
# dépendance d'exécution de moins pour l'image Docker et les images Tune OS.
#
# Les deux lignes sont conservées telles quelles, et non supprimées : elles ne
# coûtent rien (personne ne les lit) et la cible musl n'a PAS été reconstruite
# lors de ce changement. À retirer une fois qu'un
# `cross build --target aarch64-unknown-linux-musl` aura réellement été passé.
# ## Depuis #3613 : les en-tetes ALSA de la CIBLE, pour la sortie locale
#
# `local-audio` tire `cpal`, qui tire `alsa-sys`. Son `build.rs` est un
# `pkg_config::Config::new().statik(false).probe("alsa")` : sans `alsa.pc` ni
# en-tetes POUR LA CIBLE dans le conteneur, il panique — et c'est exactement
# pourquoi `local-audio` a ete CREE le 20/05/2026 (9b181931, « make cpal
# optional for cross-compilation »), puis retire des lignes ARM et jamais
# remis. Consequence mesuree dix versions plus tard sur l'artefact publie
# v0.9.141 : `strings tune-server | grep -c cpal` rend 175 sur linux-x86_64 et
# 0 sur linux-aarch64. Or l'image Tune OS du Raspberry Pi installe EXACTEMENT
# cette archive (`tune-os/scripts/build-rpi-image.sh`, qui embarque
# `tune-server-v<version>-linux-aarch64.tar.gz`) : aucune sortie audio locale
# sur un appareil dont c'est la fonction.
#
# `pre-build` est le mecanisme de `cross` pour completer l'image : on ajoute
# l'architecture Debian de la cible (`$CROSS_DEB_ARCH`, substitue par `cross`)
# et on installe `libasound2-dev` POUR ELLE. Le paquet pose `alsa.pc`, les
# en-tetes et `libasound.so` sous `/usr/lib/aarch64-linux-gnu`.
#
# `PKG_CONFIG_ALLOW_CROSS=1` est pose explicitement plutot que laisse a
# l'image : `pkg-config` refuse par defaut de repondre en compilation croisee,
# et un `cross build` local doit se comporter comme la CI.
#
# La cible **musl** n'est deliberement PAS traitee : voir l'exemption motivee
# de `tune-server/tests/features_livrees_3355.rs` — `alsa-sys` code en dur un
# lien DYNAMIQUE, incompatible avec la garantie statique de cette cible.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get --assume-yes --no-install-recommends install libasound2-dev:$CROSS_DEB_ARCH",
]
[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
]
[target.aarch64-unknown-linux-musl.env]
passthrough = [
    "LIBOPUS_STATIC=1",
    "LIBOPUS_NO_PKG=1",
    # Le CMakeLists de la libopus vendored déclare un `cmake_minimum_required`
    # antérieur à 3.5 ; cf le commentaire détaillé dans .cargo/config.toml.
    # Cargo applique bien son `[env]`, mais on le répète ici pour que la valeur
    # soit présente dans l'environnement du conteneur au moment où CMake tourne.
    "CMAKE_POLICY_VERSION_MINIMUM=3.5",
]
