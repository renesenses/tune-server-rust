# cargo-deny configuration — gates the release preflight (`cargo deny check`).
#
# Policy: Tune ships as a distributed binary. We allow permissive licenses plus
# MPL-2.0 (file-level copyleft, does not infect the binary). Strong/weak-copyleft
# like LGPL is NOT allowed — crates that offer it as one option of a multi-license
# (e.g. r-efi = "MIT OR Apache-2.0 OR LGPL-2.1-or-later") are covered by the
# MIT/Apache-2.0 options instead.

[advisories]
version = 2
ignore = [
    # paste 1.0.15 — unmaintained: the author archived the repo (RUSTSEC-2024-0436).
    # Pulled transitively via lofty / notify. It is a compile-time proc-macro helper
    # with no runtime code path and no known vulnerability; there is no safe upgrade
    # today. Revisit once lofty/notify migrate off paste.
    "RUSTSEC-2024-0436",
    # instant 0.1 — unmaintained (RUSTSEC-2024-0384), superseded by web-time.
    # Transitive only. No vulnerability; a native build never hits its wasm path.
    "RUSTSEC-2024-0384",
    # audiopus_sys 0.2.2 — unmaintained (RUSTSEC-2026-0150). Tiré par audiopus,
    # lui-même dépendance de tune-ffi et tune-karaoke. C'est une crate `-sys` de
    # liaison vers libopus : elle n'a pas de code d'exécution propre, et aucune
    # vulnérabilité n'est signalée — seulement l'absence de mainteneur.
    #
    # C'est CET avis qui faisait échouer le preflight de chaque release depuis
    # la 0.9.58, sans que personne puisse le savoir : le rapport n'affichait que
    # les avertissements de doublons, jamais l'erreur. À revisiter si audiopus
    # migre, ou si un jour un CVE tombe dessus — auquel cas cette ligne saute.
    #
    # Précision d'inventaire (#2251) : la dépendance n'est PAS que mobile.
    # `audiopus` est une dépendance dure, non optionnelle et non conditionnée à
    # la cible, de `tune-core` — donc de TOUTES les cibles livrées, du .so
    # Android au binaire Windows. Le seul défaut concret que l'avis reproche
    # (un `cmake_minimum_required` antérieur à 3.5, que CMake 4.x refuse) est
    # déjà neutralisé ici : `.cargo/config.toml` pose
    # `CMAKE_POLICY_VERSION_MINIMUM=3.5` pour tous les builds, `Cross.toml` le
    # repasse dans le conteneur musl. Le remplacement lui-même reste un
    # arbitrage ouvert — options et coûts dans #2251.
    #
    # Cette liste doit rester identique à celle de `.cargo/audit.toml` et à
    # l'entrée `ignore:` du job `audit` de `.github/workflows/ci.yml`.
    "RUSTSEC-2026-0150",
    # NOTE: the wasmtime advisories RUSTSEC-2026-0222/0223 were resolved by the
    # bump to wasmtime 47.0.3 and are no longer ignored.
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    # First-party: Tune's own crates ship under the Business Source License 1.1
    # (see LICENSE). Declared honestly as BUSL-1.1 since issue #1147 — must be
    # allowed here or cargo-deny rejects our own workspace members. No
    # third-party BUSL-1.1 dependency exists.
    "BUSL-1.1",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
]

[bans]
# Defaults: warn on duplicate crate versions (already "bans ok").
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# First-party git dependencies (oaat-core / oaat-controller live in the
# renesenses/oaat repo, pinned by rev). Everything else must come from crates.io.
[sources.allow-org]
github = ["renesenses"]
