version: "3.8"

services:
  tune:
    image: renesenses/tune:latest
    container_name: tune
    network_mode: host
    restart: unless-stopped
    volumes:
      - /chemin/vers/musique:/music:ro
      # Partage SMB monte sur l'hote (NAS) : Tune ne peut pas le monter
      # lui-meme dans le conteneur. Remplacer la ligne ci-dessus par la forme
      # longue, en propagation rslave, pour qu'un partage monte APRES le
      # demarrage du conteneur y apparaisse. Voir docs/DOCKER-PARTAGE-SMB.md.
      # - type: bind
      #   source: /chemin/vers/musique
      #   target: /music
      #   read_only: true
      #   bind:
      #     propagation: rslave
      - tune-data:/data
      # Depuis la rc12 (#8675), les modeles d'analyse acoustique vont dans
      # /data/embedding_models : ce montage n'est plus necessaire. Une
      # installation qui le monte deja le garde (docs/INSTALL-SYNOLOGY.md).
      # - /volume2/docker/tune/embedding_models:/app/embedding_models
    # Sortie audio locale vers un DAC USB de cette machine (#5968) : les
    # peripheriques son de l'hote, et le groupe qui les ouvre. A retirer si
    # l'hote n'a pas de /dev/snd. Podman/Fedora : voir « Podman » du README.
    devices:
      - /dev/snd:/dev/snd
      # Lecteur CD de cette machine, pour l'extraction (#8141). Retirer le
      # commentaire si l'hote a un lecteur (`ls -ln /dev/sr0`). L'image
      # ajoute d'elle-meme le compte Tune au groupe du lecteur, quel que soit
      # son numero (11 sous ZimaOS, 24 `cdrom` sous Debian, Synology, Unraid).
      # - /dev/sr0:/dev/sr0
    group_add:
      - audio
      # Seulement si le conteneur demarre avec `user:` (sans root) : le numero
      # de groupe du lecteur sur l'hote, 4e colonne de `ls -ln /dev/sr0`.
      # - "11"
    environment:
      # Mettre `[]` pour demarrer SANS aucun dossier de bibliotheque et
      # les choisir depuis Reglages. Un `/music` non monte est un volume
      # anonyme VIDE : il n'est plus seme au premier demarrage (#3686).
      - TUNE_MUSIC_DIRS=["/music"]
      - TUNE_PORT=8888
      - TUNE_AUTO_SCAN=true
      - TUNE_LOG=info
      # Spotify Connect (librespot)
      # - LIBRESPOT_NAME=Tune
      # - LIBRESPOT_BITRATE=320
      # YouTube Music (yt-dlp inclus dans l'image)
      # - TUNE_YOUTUBE_API_KEY=your_key_here

volumes:
  tune-data:
