## Tune Server — Production
##
## Usage:
##   1. Replace /path/to/music with your music library path
##   2. docker compose -f docker-compose.prod.yml up -d
##   3. Open http://localhost:8888
##
## Database: SQLite, stored in the tune-data volume (/data/tune.db, set by the
## image's TUNE_DB_PATH). The published renesenses/tune image is built WITHOUT
## the `postgres` cargo feature: given a TUNE_DATABASE_URL it refuses to start
## ("PostgreSQL engine requested but the `postgres` feature is not enabled").
## PostgreSQL therefore needs an image you build yourself with
## `--features postgres`; it cannot work with this image.
##
## For DLNA/SSDP/mDNS discovery, add network_mode: host to the tune service
## and remove the ports mapping (host mode exposes all ports directly).
##
## AirPlay REQUIRES network_mode: host on a native Linux host: it pushes RTP/UDP
## streams back to the server, which the default bridge NAT drops (DLNA still
## works because the speaker pulls audio over HTTP). Docker Desktop (macOS/
## Windows) has no host mode → AirPlay cannot work from Docker there. AirPlay 2
## receivers (e.g. Devialet Phantom) also need the embedded airplay-daemon,
## shipped for x86_64/amd64 only; arm64 falls back to legacy AirPlay 1.

services:
  tune:
    image: renesenses/tune:latest
    container_name: tune-server
    ports:
      - "8888:8888"
    volumes:
      - tune-data:/data
      - /path/to/music:/music:ro
    environment:
      - TUNE_MUSIC_DIRS=["/music"]
    restart: unless-stopped

volumes:
  tune-data:
