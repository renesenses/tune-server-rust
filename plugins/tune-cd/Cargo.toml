[package]
name = "tune-cd"
version.workspace = true
edition.workspace = true
license.workspace = true

# In-tree native plugin (#4863) : lire un CD audio SANS l'extraire.
#
# NATIF, pas WASM : il parle au lecteur par ioctl (`/dev/sr*`), ce que le bac
# à sable WASM n'offre pas — l'hôte WASM n'expose aucun périphérique. Pas non
# plus un greffon du SDK audio `.tuneplugin` : celui-ci TRAITE un signal que
# l'hôte lui passe, il ne PRODUIT pas de source.
#
# La lecture vers une zone passe par l'hôte : le greffon inscrit un
# `tune_core::source_pcm::FournisseurPcm` sous la source `cd`, et la file, les
# sorties et le WAV progressif sont ceux de l'orchestrateur.

[dependencies]
tune-core = { path = "../../tune-core", default-features = false, features = ["plugin-http"] }
axum = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
# Identifiant de disque MusicBrainz : SHA-1 puis base64 modifiée. `sha1` 0.10
# est déjà dans le graphe (même famille RustCrypto que `sha2` 0.10), `base64`
# 0.22 aussi (tune-core).
sha1 = "0.10"
base64 = "0.22"
# #2466 — l'extraction : balises écrites par `lofty`, la bibliothèque que le
# scan emploie pour les relire (déjà dans le graphe par tune-core) ; le rôle
# de l'appelant (`AuthUser`) que pose le middleware d'authentification ;
# l'identifiant des extractions.
lofty = { workspace = true }
tune-http-types = { path = "../../tune-http-types" }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# macOS : `getfsstat` pour trouver le volume `cddafs` du disque (#4863).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_Cdrom", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# #2466 — une bibliothèque jetable pour les fichiers extraits.
tempfile = "3"
