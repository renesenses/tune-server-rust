[package]
name = "tune-collection-physique"
version.workspace = true
edition.workspace = true
license.workspace = true

# « Ma collection physique » (#7195, go de Bertrand du 27/10/2026).
# Greffon natif du catalogue, sur le modèle de `tune-mon-theme` : ses routes
# sont montées par l'hôte sous `/api/v1/ext/collection-physique`. Il lit la
# collection Discogs de l'utilisateur et la compare à la bibliothèque et aux
# services de streaming.
#
# Aucun appel réseau dans ce crate : Discogs, MusicBrainz, les services et la
# bibliothèque passent par le trait `Hote`, que le serveur implémente (jeton
# résolu par `tune_core::cles_api`, limiteurs partagés). Les essais rejouent
# des réponses enregistrées (`tests/fixtures`).
#
# Feature `collection-physique` de tune-server, dans son `default`, inscrite à
# `sdk/plugins.json`.

[dependencies]
tune-core = { path = "../../tune-core", default-features = false, features = ["plugin-http"] }
axum = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
# Le cache de pochettes (01/11/2026) : la vignette de 300 px se tire de la
# grande image de Discogs (JPEG, PNG, WebP lus ; JPEG écrit).
image = { workspace = true, features = ["webp"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
