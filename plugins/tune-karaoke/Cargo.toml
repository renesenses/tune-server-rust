[package]
name = "tune-karaoke"
version.workspace = true
edition.workspace = true
license.workspace = true

# In-tree native plugin. Sibling of `tune-dj` (#917): a `TunePlugin` gated
# behind tune-server's `karaoke` feature, mounted by the plugin host at
# `/api/v1/ext/karaoke/…`.
#
# Karaoke is a NATIVE plugin (model B), not WASM: synced-lyrics fetching hits
# the network (LRCLIB) and caches in the DB, and the WASM runtime has no
# net/fetch capability. It REUSES `tune_core::lyrics` verbatim — no LRC parsing
# or fetching is reimplemented here (DRY).
#
# A `path` dependency INSIDE this repo is fine — cargo only breaks on optional
# path deps pointing *outside* the clone (see docs/plugins/README.md).

[dependencies]
tune-core = { path = "../../tune-core", default-features = false, features = ["plugin-http"] }
axum = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
