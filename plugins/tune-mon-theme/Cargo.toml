[package]
name = "tune-mon-theme"
version.workspace = true
edition.workspace = true
license.workspace = true

# « Mon thème » (tune-web-client#2527, go de Bertrand du 30/10/2026, rc10).
# Greffon natif du catalogue, sur le modèle de `tune-concerts` : ses routes
# sont montées par l'hôte sous `/api/v1/ext/mon-theme`. Il range le thème de
# chaque profil dans `settings` et déclare au client web qu'il fournit un
# thème (`TunePlugin::theme_web`).
#
# Feature `mon-theme` de tune-server, dans son `default`, inscrite à
# `sdk/plugins.json`. Aucune dépendance que `tune-core` ne porte déjà.

[dependencies]
tune-core = { path = "../../tune-core", default-features = false, features = ["plugin-http"] }
axum = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
