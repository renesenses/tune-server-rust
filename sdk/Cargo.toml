[workspace]
members = ["tune-plugin-sdk", "tune-plugin-testkit", "cargo-tune-plugin", "tune-plugin-audio-support", "tune-plugin-equalizer", "tune-plugin-crossfeed", "tune-plugin-crossfeed-pro", "tune-plugin-converter", "tune-plugin-declick", "tune-plugin-abi", "tune-plugin-native"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
repository = "https://github.com/renesenses/tune-server-rust"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tune-plugin-sdk = { path = "tune-plugin-sdk" }
tune-plugin-testkit = { path = "tune-plugin-testkit" }
