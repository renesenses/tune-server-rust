[workspace]
members = ["tune-plugin-sdk", "tune-plugin-testkit", "cargo-tune-plugin", "tune-plugin-audio-support", "tune-plugin-equalizer", "tune-plugin-crossfeed", "tune-plugin-converter", "tune-plugin-declick", "tune-plugin-channel-remap", "tune-plugin-abi", "tune-plugin-native", "tune-plugin-surechantillonnage"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
repository = "https://github.com/renesenses/tune-server-rust"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tune-plugin-sdk = { path = "tune-plugin-sdk" }
tune-plugin-testkit = { path = "tune-plugin-testkit" }

# #7614 : les gabarits du suréchantillonneur conçoivent des noyaux de 4 096 ×
# 16 coefficients et leur phase minimale par FFT ; sans optimisation, les
# tests de la crate prennent plusieurs minutes.
[profile.dev.package.tune-plugin-surechantillonnage]
opt-level = 2
