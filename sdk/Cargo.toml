[workspace]
members = ["tune-plugin-sdk", "tune-plugin-testkit", "cargo-tune-plugin", "tune-plugin-audio-support", "tune-plugin-equalizer", "tune-plugin-crossfeed", "tune-plugin-converter", "tune-plugin-declick", "tune-plugin-channel-remap", "tune-plugin-abi", "tune-plugin-native", "tune-plugin-surechantillonnage", "tune-plugin-declick-live"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
repository = "https://github.com/renesenses/tune-server-rust"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tune-plugin-sdk = { path = "tune-plugin-sdk" }
tune-plugin-testkit = { path = "tune-plugin-testkit" }

# #7614 : les gabarits du suréchantillonneur conçoivent des noyaux de 4 096 ×
# 16 coefficients et leur phase minimale par FFT ; sans optimisation, les
# tests de la crate prennent plusieurs minutes.
[profile.dev.package.tune-plugin-surechantillonnage]
opt-level = 2

# TESS T13 : le corpus synthétique (piano, cymbales, clavecin) et le
# détecteur font des centaines de millions d'opérations par test.
[profile.dev.package.tune-plugin-declick-live]
opt-level = 2

# TESS T11b : les témoins du modulateur DSD modulent des millions
# d'échantillons à 1 bit et font des FFT de 2^20 points.
[profile.dev.package.tune-plugin-audio-support]
opt-level = 2

# TESS T06 : le banc sonore des moteurs de référence (référence hors ligne par
# convolution directe, réponse en fréquence de 2^19 points).
[profile.dev.package.tune-plugin-equalizer]
opt-level = 2

[profile.dev.package.tune-plugin-crossfeed]
opt-level = 2
