description = "TESS T13 : suppression des clics en temps réel (détection par erreur de prédiction AR, interpolation LSAR, anticipation bornée annoncée à l'hôte). Calcul interne en f64. Premium."

# Aucune dépendance tierce. Le branchement dans l'hôte (chaîne, catalogue,
