# d'où `manifest.embedded.json` (même convention que le suréchantillonneur).
[dependencies]
serde.workspace = true
serde_json.workspace = true
tune-plugin-sdk.workspace = true

[dev-dependencies]
tune-plugin-testkit.workspace = true
