[package]
workspace = ".."
name = "tune-plugin-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
tune-plugin-sdk.workspace = true
tune-plugin-abi = {path = "../tune-plugin-abi"}
serde.workspace = true
serde_json.workspace = true
libloading = "0.8"
sha2 = "0.10"
minisign-verify = "0.2"
# zip 9 (RUSTSEC-2026-0367/0368/0369) : mêmes features que la racine. zip 9
# prend flate2 sans moteur ; `rust_backend` le fournit quand ce crate se
# compile seul (espace de travail `sdk/`), sans basculer sur `zlib-rs`.
zip = {version = "9.0.5", default-features = false, features = ["deflate-flate2", "deflate-zopfli"]}
flate2 = {version = "1", default-features = false, features = ["rust_backend"]}
tempfile = "3"
[dev-dependencies]
tune-plugin-testkit.workspace = true
ed25519-dalek = "2"
blake2 = "0.10"
base64 = "0.22"
[features]
native-conformance = []
[[test]]
name = "native"
required-features = ["native-conformance"]
