[package]
workspace = ".."
name = "tune-plugin-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
tune-plugin-sdk.workspace = true
tune-plugin-abi = {path = "../tune-plugin-abi"}
serde.workspace = true
serde_json.workspace = true
libloading = "0.8"
sha2 = "0.10"
minisign-verify = "0.2"
zip = {version = "2", default-features = false, features = ["deflate"]}
tempfile = "3"
[dev-dependencies]
tune-plugin-testkit.workspace = true
ed25519-dalek = "2"
blake2 = "0.10"
base64 = "0.22"
[features]
native-conformance = []
[[test]]
name = "native"
required-features = ["native-conformance"]
