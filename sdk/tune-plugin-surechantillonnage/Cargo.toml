[package]
workspace = ".."
name = "tune-plugin-surechantillonnage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "#7614 : suréchantillonnage haute qualité (filtres polyphases, phase minimale, dither et formeurs de bruit, test de la machine, banc de mesure). Greffon désactivé par défaut, incompatible PURE."

# Aucune dépendance tierce : FFT, fenêtres, PRNG et écriture SVG sont dans la
# crate. Le serveur l'embarque comme l'égaliseur et le crossfeed.
[dependencies]
serde.workspace = true
serde_json.workspace = true
tune-plugin-sdk.workspace = true

[dev-dependencies]
tune-plugin-testkit.workspace = true

[[bin]]
name = "banc"
path = "src/bin/banc.rs"
