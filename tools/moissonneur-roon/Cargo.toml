[package]
name = "tune-moissonneur-roon"
version = "0.1.0"
edition = "2021"
description = "Moissonne un Core Roon vers le format d'import de Tune. Lecture seule."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "moissonneur-roon"
path = "src/main.rs"

[dependencies]
roon-api = "0.5.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
