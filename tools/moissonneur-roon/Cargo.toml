[package]
name = "tune-moissonneur-roon"
version = "0.1.0"
edition = "2021"
description = "Moissonne un Core Roon vers le format d'import de Tune. Lecture seule."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "moissonneur-roon"
path = "src/main.rs"

[dependencies]
roon-api = "0.5.3"
# La découverte SOOD, en direct : `RoonClient::start_discovery` se connecte et
# s'apparie au PREMIER Core qui répond. Ici on veut d'abord VOIR qui répond.
roon-sood = "0.5.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# zip 9 (RUSTSEC-2026-0367/0368/0369) : mêmes features que la racine ; flate2
# en `rust_backend` parce que zip 9 le prend sans moteur.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# Le dossier d'essai se nettoie par `Drop`, y compris quand le test ÉCHOUE :
# un chemin composé à la main sous /tmp, lui, survit (garde
# `aucune_fuite_de_temporaires` de tune-core, #3030).
tempfile = "3"
