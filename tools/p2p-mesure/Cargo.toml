[package]
name = "tune-p2p-mesure"
version = "0.1.0"
edition = "2021"
description = "Banc de mesure pair-à-pair (iroh) pour l'écoute à distance. Hors produit, pour la rc8."
license = "MIT OR Apache-2.0"
publish = false

# Hors workspace (`exclude` du Cargo.toml racine), comme tools/moissonneur-roon :
# iroh n'entre ni dans l'arbre de dépendances du produit, ni dans release.yml,
# ni dans les portes clippy du dépôt.

[[bin]]
name = "p2p-mesure"
path = "src/main.rs"

[dependencies]
# Version EXACTE : la branche 1.x d'iroh enchaîne les versions (cahier § 6).
# 1.3.0 = max_stable_version sur crates.io au 20/10/2026.
iroh = "=1.3.0"
n0-future = "0.3"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
data-encoding = "2"
humantime = "2"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# Dossier d'essai nettoyé par `Drop`, même quand le test échoue (garde
# `aucune_fuite_de_temporaires` de tune-core, #3030).
tempfile = "3"
