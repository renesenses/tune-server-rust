[package]
name = "tune-calibration"
version = "0.1.0"
edition = "2021"
description = "Prototype C1/C2 de calibration de la pièce d'écoute (#7632) : balayage de Farina, déconvolution, réponse en fréquence, RT60, étalonnage micro, égaliseur paramétrique automatique. Hors serveur, aucun son joué ni capté."
license = "BUSL-1.1"
publish = false

# Hors workspace (`exclude` du Cargo.toml racine), comme tools/p2p-mesure :
# l'étude ne doit entrer ni dans l'arbre de dépendances du produit, ni dans
# release.yml, ni dans les portes clippy du dépôt tant que le chantier n'est
# pas décidé. Toutes les dépendances sont MIT ou Apache-2.0 (cargo deny).

[lib]
name = "tune_calibration"
path = "src/lib.rs"

[[bin]]
name = "calib-demo"
path = "src/bin/calib_demo.rs"

[dependencies]
# Mêmes versions que le Cargo.lock du serveur (realfft 3.5, rustfft 6.4).
realfft = "3.5"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
