[package]
name = "tune-core"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
tune-plugin-native = { path = "../sdk/tune-plugin-native" }
tune-plugin-sdk = { path = "../sdk/tune-plugin-sdk" }
tune-plugin-audio-support = { path = "../sdk/tune-plugin-audio-support" }
tune-plugin-equalizer = { path = "../sdk/tune-plugin-equalizer" }
tune-plugin-crossfeed = { path = "../sdk/tune-plugin-crossfeed" }
# Temporary streaming downloads must be removed on cancellation (#4234).
tempfile = "3"
tune-output-api = { path = "../tune-output-api" }
# Only for the plugin SDK's router registration — see the `plugin-http` feature.
axum = { workspace = true, optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
lofty = { workspace = true }
reqwest = { workspace = true }
quick-xml = { workspace = true }
mdns-sd = { workspace = true }
socket2 = { workspace = true }
if-addrs = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
image = { workspace = true }
zip = { workspace = true }
realfft = "3"
rayon = { workspace = true }
notify = { workspace = true }
md-5 = { workspace = true }
rusqlite = { workspace = true }
async-stream = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
urlencoding = { workspace = true }
cpal = { path = "../vendor/cpal", version = "0.17.3", optional = true }
rust_cast = { workspace = true }
sha2 = { workspace = true }
# Authenticated backup encryption (audit item 7): Argon2id KDF + XChaCha20-Poly1305.
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"

# --- Sendspin (#3326) : cryptographie et encodage, sur TOUTES les plateformes.
#
# Ces dependances ne doivent PAS retourner sous
# `[target.'cfg(unix)'.dependencies]`. Ce bloc-là existe pour l'appairage
# AirPlay 2, qui est effectivement unix ; Sendspin, lui, tourne partout où Tune
# tourne — Windows compris. La CI « Windows + ASIO » est la garde : elle a
# rougi sur `unresolved import snow / base64 / x25519_dalek / rand_core`
# quand ces lignes étaient du mauvais côté du manifeste.
#
# `snow` : Noise KKpsk2, en pur Rust. Le résolveur par défaut s'appuie sur
# `curve25519-dalek`, `chacha20poly1305`, `aes-gcm` et `sha2` — les mêmes
# familles que le reste du manifeste ; le résolveur accéléré `ring` n'est pas
# activé. Mesuré : les DEUX suites imposées au serveur
# (`25519_ChaChaPoly_SHA256` et `25519_AESGCM_SHA256`) aboutissent. On
# n'écrit pas Noise à la main : c'est de la cryptographie.
snow = { version = "0.10", default-features = false, features = [
    "default-resolver",
    "default-resolver-crypto",
    "std",
] }
# L'identifiant d'un pair Sendspin EST sa clé publique X25519, en base64url
# sans remplissage.
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
# S2-b : Elligator2 du groupe X25519, confirme contre CPace draft-21.
# Version epinglee : le mode Legacy conserve le bit 254 requis par CPace.
curve25519-elligator2 = { version = "=0.1.0-alpha.2", default-features = false, features = ["alloc", "digest", "zeroize"] }
hmac = "0.12" # meme famille digest 0.10 que sha2
aes-gcm = "0.10"
subtle = "2.6"
zeroize = "1"
data-encoding = "2.11"
blowfish = { workspace = true }
chrono = { workspace = true }
cbc = { workspace = true }
regex = { workspace = true }
csv = { workspace = true }
symphonia = { workspace = true }
# Native Monkey's Audio decoder, MIT/Apache-2.0.
# Local pre-3990 entropy support (#4191): vendor/ape-decoder/TUNE-PATCH.md.
ape-decoder = { path = "../vendor/ape-decoder", version = "0.3.2" }
opus = { workspace = true }
rubato = { workspace = true }
unicode-normalization = { workspace = true }
oaat-core = { workspace = true, optional = true }
oaat-controller = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio-stream = "0.1.18"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"], optional = true }
# Shared HTTP client TLS: webpki roots via reqwest use_preconfigured_tls, so
# Android never hits the uninitialised rustls-platform-verifier. Must track the
# rustls version reqwest resolves (0.23).
rustls = "0.23"
webpki-roots = "0.26"
# Real OS hostname (gethostname(2)) for network identity — mDNS instance name +
# peer-info name. Env HOSTNAME/COMPUTERNAME is unset under systemd, so the old
# env-only derivation collided every instance on "tune-server" (#1112, #1127).
# Already in the lockfile transitively, so this is a near-free direct dep.
hostname = "0.4"
# Décodeur DST (DSD compressé sans perte des SACD), pur Rust, sans FFmpeg (#4378).
# Sortie vérifiée bit à bit contre libdstdec (référence ISO/Philips) et, en
# PCM flottant, contre FFmpeg, sur l'échantillon FATE `dst-64fs44-2ch.dff`.
# DÉSARMÉ par défaut : son README reproduit l'en-tête ISO/Philips du code de
# référence (« Copyright is not released for non MPEG-4 Audio conforming
# products ») — l'armer dans une version livrée est une décision de licence.
dst-decoder = { version = "0.1.2", optional = true }
# ONNX runtime for the CLAP audio embedder (acoustic Smart Radio). `load-dynamic`
# keeps the BUILD pure-Rust — no target-specific onnxruntime binary fetched at
# compile time — and the shared lib is loaded at runtime next to the model
# (downloaded on activation). Feature-gated so the default build never pulls it.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"], optional = true }
# Sonde de la dylib onnxruntime AVANT `ort::init_from` (#4248) : même version
# que celle qu'`ort` rc.13 tire, pour que le `dlopen` de la sonde et le sien
# soient le même appel — un fichier que la sonde ouvre, `ort` l'ouvrira.
libloading = { version = "0.9", optional = true }
# Runtime provisioning of the onnxruntime shared lib for `load-dynamic`: we fetch
# Microsoft's official onnxruntime release archives (which ship real shared libs,
# unlike ort's static-link dists) and unpack them — `.tgz` via flate2+tar,
# Windows `.zip` via the `zip` crate already in deps. Gated behind
# `audio-embedding`, so the default build pulls none of this.
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
# CLAP text tower tokenizer (natural-language acoustic search, Phase 3). Loads the
# published RoBERTa `tokenizer.json`. `default-features = false` drops the CLI-only
# extras (progressbar/hf-hub/esaxx training), but `onig` is kept: on native targets
# tokenizers routes its regex `SysRegex` through oniguruma, and the RoBERTa
# ByteLevel pre-tokenizer's split IS a regex — so `onig` is required for correct
# tokenization, not optional. Gated behind `audio-embedding` with the ONNX stack.
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }

[target.'cfg(unix)'.dependencies]
# Linux : nice/ionice des threads du pool de scan (scanner/walker.rs).
# macOS + Linux : statfs pour détecter les montages réseau (scanner/watcher.rs).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.14", default-features = false, features = ["audio_toolbox", "core_audio"], optional = true }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "objc2-core-audio-types", "AudioHardware", "AudioHardwareDeprecated"], optional = true }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"], optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
axum = { workspace = true }
# Lean criterion (no plotters/rayon) — just the bench harness.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Test-only : `#[tokio::test(start_paused = true)]`. Le chien de garde du budget
# de transcodage (#3140) compte en MINUTES — un DSD256 de 20 min à × 2,2 met
# 545 s à se décoder. Sans horloge virtuelle, l'éprouver coûterait ce temps-là
# pour de vrai, et un test de budget qui dort est un test intermittent.
# `test-util` n'entre que dans les cibles de test : le binaire publié ne le
# compile pas. Même déclaration que `tune-server` (#2073).
tokio = { workspace = true, features = ["test-util"] }

# `autotests = false` en tête de ce manifeste : sans cette cible, le fichier
# ne serait JAMAIS compilé et la porte rendrait un vert contre rien (#3326,
# S2-a).
[[test]]
name = "sendspin_poignee_s2a"
path = "tests/sendspin_poignee_s2a.rs"

[[test]]
name = "integration_contracts"
path = "tests/integration_contracts.rs"

# `autotests = false` en tete de ce manifeste : sans cette cible, le temoin de
# la pause des traitements de fond ne serait JAMAIS compile et la porte rendrait
# un vert contre rien (#4574). Binaire a lui seul : la pause est un etat de
# PROCESSUS (masque de bits atomique), comme l'avancement ReplayGain — un voisin
# qui suspendrait une passe dans le meme binaire le rendrait intermittent.
[[test]]
name = "pause_taches_de_fond"
path = "tests/pause_taches_de_fond.rs"

# Meme raison : `autotests = false`. Binaire a lui seul : le temoin de lecture
# des taches de fond est un etat de PROCESSUS ; un voisin qui mettrait une zone
