[package]
name = "tune-core"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
tune-output-api = { path = "../tune-output-api" }
# Only for the plugin SDK's router registration — see the `plugin-http` feature.
axum = { workspace = true, optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
lofty = { workspace = true }
reqwest = { workspace = true }
quick-xml = { workspace = true }
mdns-sd = { workspace = true }
socket2 = { workspace = true }
if-addrs = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
image = { workspace = true }
zip = { workspace = true }
realfft = "3"
rayon = { workspace = true }
notify = { workspace = true }
md-5 = { workspace = true }
rusqlite = { workspace = true }
async-stream = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
urlencoding = { workspace = true }
cpal = { version = "0.17", optional = true }
rust_cast = { workspace = true }
sha2 = { workspace = true }
# Authenticated backup encryption (audit item 7): Argon2id KDF + XChaCha20-Poly1305.
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
blowfish = { workspace = true }
chrono = { workspace = true }
cbc = { workspace = true }
regex = { workspace = true }
csv = { workspace = true }
symphonia = { workspace = true }
# SPIKE (#1145): pure-Rust Monkey's Audio (.ape) decoder, MIT/Apache-2.0.
# Evaluated as a replacement for the "not supported" fallback. Not production.
ape-decoder = "0.3.2"
opus = { workspace = true }
rubato = { workspace = true }
unicode-normalization = { workspace = true }
oaat-core = { workspace = true, optional = true }
oaat-controller = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio-stream = "0.1.18"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"], optional = true }
# Shared HTTP client TLS: webpki roots via reqwest use_preconfigured_tls, so
# Android never hits the uninitialised rustls-platform-verifier. Must track the
# rustls version reqwest resolves (0.23).
rustls = "0.23"
webpki-roots = "0.26"
# Real OS hostname (gethostname(2)) for network identity — mDNS instance name +
# peer-info name. Env HOSTNAME/COMPUTERNAME is unset under systemd, so the old
# env-only derivation collided every instance on "tune-server" (#1112, #1127).
# Already in the lockfile transitively, so this is a near-free direct dep.
hostname = "0.4"
# ONNX runtime for the CLAP audio embedder (acoustic Smart Radio). `load-dynamic`
# keeps the BUILD pure-Rust — no target-specific onnxruntime binary fetched at
# compile time — and the shared lib is loaded at runtime next to the model
# (downloaded on activation). Feature-gated so the default build never pulls it.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"], optional = true }
# Runtime provisioning of the onnxruntime shared lib for `load-dynamic`: we fetch
# Microsoft's official onnxruntime release archives (which ship real shared libs,
# unlike ort's static-link dists) and unpack them — `.tgz` via flate2+tar,
# Windows `.zip` via the `zip` crate already in deps. Gated behind
# `audio-embedding`, so the default build pulls none of this.
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
# CLAP text tower tokenizer (natural-language acoustic search, Phase 3). Loads the
# published RoBERTa `tokenizer.json`. `default-features = false` drops the CLI-only
# extras (progressbar/hf-hub/esaxx training), but `onig` is kept: on native targets
# tokenizers routes its regex `SysRegex` through oniguruma, and the RoBERTa
# ByteLevel pre-tokenizer's split IS a regex — so `onig` is required for correct
# tokenization, not optional. Gated behind `audio-embedding` with the ONNX stack.
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }

[target.'cfg(unix)'.dependencies]
# Linux : nice/ionice des threads du pool de scan (scanner/walker.rs).
# macOS + Linux : statfs pour détecter les montages réseau (scanner/watcher.rs).
libc = "0.2"

# AirPlay 2 HomeKit-style pairing (pair-setup SRP-6a + pair-verify Curve25519).
# All pinned to the RustCrypto digest 0.10 / sha2 0.10 generation used across
# the workspace so no duplicate hashing stack is pulled in.
srp = "0.6"
hkdf = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.14", default-features = false, features = ["audio_toolbox", "core_audio"], optional = true }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "objc2-core-audio-types", "AudioHardware", "AudioHardwareDeprecated"], optional = true }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"], optional = true }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
axum = { workspace = true }
# Lean criterion (no plotters/rayon) — just the bench harness.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Test-only : `#[tokio::test(start_paused = true)]`. Le chien de garde du budget
# de transcodage (#3140) compte en MINUTES — un DSD256 de 20 min à × 2,2 met
# 545 s à se décoder. Sans horloge virtuelle, l'éprouver coûterait ce temps-là
# pour de vrai, et un test de budget qui dort est un test intermittent.
# `test-util` n'entre que dans les cibles de test : le binaire publié ne le
# compile pas. Même déclaration que `tune-server` (#2073).
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "integration_contracts"
path = "tests/integration_contracts.rs"

# `autotests = false` ci-dessus : un fichier posé dans tests/ ne se compile pas
# tout seul, il faut le déclarer. Cible volontairement minuscule — elle ne tire
# que tune_core, déjà construit (#2213).
[[test]]
name = "terminologie_eq"
path = "tests/terminologie_eq.rs"

# Meme raison : `autotests = false`. Cible minuscule, elle ne tire que
# tune_core et trois fixtures de quelques centaines d octets (#1405).
[[test]]
name = "autoeq_profils_reels"
path = "tests/autoeq_profils_reels.rs"

# Binaire de test a lui seul, DELIBEREMENT (#2665). `tracing` met en cache pour
# tout le processus la decision « ce point d appel interesse-t-il quelqu un ? »
# et le niveau maximal utile ; un abonne pose le temps d un await, dans un
# binaire qui en cree des dizaines en parallele, se voit priver d evenements de
# facon imprevisible — capture vide 1 execution sur 6 de la suite du crate,
# quand le meme test seul passait 8 fois sur 8. Ici l abonne est GLOBAL et ce
# fichier ne contient qu un test : plus aucun ordonnancement n entre en jeu.
[[test]]
name = "journal_descriptif_illisible"
path = "tests/journal_descriptif_illisible.rs"

# Meme famille, meme raison (#2890) : abonne `tracing` GLOBAL, donc un binaire
# a lui seul. Il tient les deux bords du journal d insertion par lot — le lot
# nominal est muet au niveau livre, l echec d insertion reste dit.
[[test]]
name = "journal_insertion_par_lot"
path = "tests/journal_insertion_par_lot.rs"

# Meme famille, meme raison (#2566) : abonne `tracing` GLOBAL, donc un binaire
# a lui seul. Il compte les lignes qu une panne de sondage coute au journal —
# 79 avant, 9 apres — sans toucher au reseau ni au recul exponentiel.
[[test]]
name = "journal_sondage_repos"
path = "tests/journal_sondage_repos.rs"

# Meme famille, meme raison (#2566), site frere : la zone EN LECTURE. Abonne
# `tracing` GLOBAL, donc un binaire a lui seul et un seul essai dedans.
[[test]]
name = "journal_sondage_lecture"
path = "tests/journal_sondage_lecture.rs"

# #2505 : `.ape` decode incremental. `autotests = false` ci-dessus — un fichier
# pose dans tests/ ne se compile pas tout seul.
[[test]]
name = "ape_incremental_i2505"
path = "tests/ape_incremental_i2505.rs"

# Binaire de test a lui seul, DELIBEREMENT (#2505) : il installe un
# `#[global_allocator]` qui mesure le pic d'octets vivants. L'allocateur est
# PROCESSUS-global — un test voisin qui allouerait en parallele fausserait la
# mesure. `tests/ape_fixture_i2505.rs` n'est PAS une cible : c'est un module
# partage, inclus par `#[path]` dans les deux binaires ci-dessus.
[[test]]
name = "ape_pic_memoire_i2505"
path = "tests/ape_pic_memoire_i2505.rs"

# `autotests = false` : sans cette cible, le fichier ne serait jamais compile.
# Il tient le resume de fin de scan (#2939) — un scan qui perd des pistes ne
# peut plus annoncer zero echec, et un scan qui reussit annonce toujours zero.
[[test]]
name = "scan_refus_insertion_comptes_2939"
path = "tests/scan_refus_insertion_comptes_2939.rs"

# `autotests = false` : sans cette cible, le fichier ne serait jamais compile.
# #2569 / #2775 — l'instantane de file d'attente ne doit pas etre ecrase par une
# base momentanement illisible, et DOIT l'etre quand l'utilisateur vide sa file.
[[test]]
name = "instantane_de_file_i2569_f4c821"
path = "tests/instantane_de_file_i2569_f4c821.rs"

[[bench]]
name = "dsd_to_pcm"
harness = false

[features]
default = ["local-audio"]
local-audio = ["cpal", "coreaudio-rs", "objc2-core-audio", "objc2-core-audio-types"]
# Lets plugins mount HTTP routes through `PluginContext::register_router`.
# Gated so tune-cli — which links tune-core but serves no HTTP — does not
# have to build axum. tune-server enables it.
plugin-http = ["dep:axum"]
asio = ["cpal/asio"]
oaat = ["dep:oaat-core", "dep:oaat-controller"]
cloud-relay = ["dep:tokio-tungstenite"]
postgres = ["dep:sqlx"]
# Acoustic Smart Radio: CLAP audio embeddings via onnxruntime. NOT in default —
# only builds that opt in pull `ort`, so the standard 6-target matrix is
# untouched. The onnxruntime shared lib + model are provided at runtime.
audio-embedding = ["dep:ort", "dep:flate2", "dep:tar", "dep:tokenizers"]

# #3248 : sur PostgreSQL, un INSERT conditionnel qui n'ecrit rien annulait la
# transaction entiere, et la branche `returning` rendait `Ok(1)` en dur.
# `autotests = false` ci-dessus — sans cette cible le fichier ne serait JAMAIS
# compile, et la porte rendrait un vert contre rien. La garde de site et la
# contre-epreuve SQLite s executent SANS base ; les trois epreuves PostgreSQL
# demandent `TUNE_TEST_PG_URL` (absente = saut annonce, posee mais injoignable
# = echec).
[[test]]
name = "pg_insert_conditionnel_f7c250"
path = "tests/pg_insert_conditionnel_f7c250.rs"

# #3256 : sur PostgreSQL, ` RETURNING id` etait ajoute a TOUT INSERT nu, y
# compris vers les tables qui n'ont pas de colonne `id` (`task_runs`,
# `streaming_auth`), et PostgreSQL refusait la requete entiere. `autotests =
# false` ci-dessus — sans cette cible le fichier ne serait JAMAIS compile, et
# la porte rendrait un vert contre rien. La garde de site et la contre-epreuve
# SQLite s executent SANS base ; les quatre epreuves PostgreSQL demandent
# `TUNE_TEST_PG_URL` (absente = saut annonce, posee mais injoignable = echec).
[[test]]
name = "pg_returning_id_hors_table_a_id_3256"
path = "tests/pg_returning_id_hors_table_a_id_3256.rs"

# #3205 : compteur de famine de l'anneau audio. `autotests = false` ci-dessus —
# sans cette cible le fichier ne serait JAMAIS compile, et la porte rendrait un
# vert contre rien.
[[test]]
name = "famine_anneau_i3205"
path = "tests/famine_anneau_i3205.rs"

# #3180 : une pochette de plus d un mebioctet n emporte plus le titre et l
# artiste d un DSF. `autotests = false` ci-dessus — sans cette cible le fichier
# ne serait JAMAIS compile, et la porte rendrait un vert contre rien.
[[test]]
name = "dsf_tag_volumineux_i3180_e7d445"
path = "tests/dsf_tag_volumineux_i3180_e7d445.rs"

# Meme famille que #2665 / #2890 : abonne `tracing` GLOBAL, donc un binaire a
# lui seul et UN SEUL test dedans. Il tient les deux bords du journal du lecteur
# de tag DSF — un tag ecarte nomme son motif, un fichier ordinaire se tait.
[[test]]
name = "journal_dsf_tag_ecarte_i3180_e7d445"
path = "tests/journal_dsf_tag_ecarte_i3180_e7d445.rs"

# #2394 : « zero octet servi » et « je ne sais pas » etaient le meme chiffre, et
# c est ce chiffre qui coupe la zone. `autotests = false` ci-dessus — sans cette
# cible le fichier ne serait JAMAIS compile, et la porte rendrait un vert contre
# rien.
[[test]]
name = "octets_servis_inconnus_2394"
path = "tests/octets_servis_inconnus_2394.rs"

[build-dependencies]
cc = "1"

# AAC natif Windows (#1527) : Media Foundation via le crate `windows` —
# même version 0.62 que celle que cpal tire déjà, donc aucune compilation
# dupliquée sur les cibles Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_MediaFoundation",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Power",
] }
