path = "tests/instantane_de_file_i2569_f4c821.rs"

[[bench]]
name = "dsd_to_pcm"
harness = false

[features]
default = ["local-audio"]
local-audio = ["cpal", "coreaudio-rs", "objc2-core-audio", "objc2-core-audio-types"]
# Lets plugins mount HTTP routes through `PluginContext::register_router`.
# Gated so tune-cli — which links tune-core but serves no HTTP — does not
# have to build axum. tune-server enables it.
plugin-http = ["dep:axum"]
asio = ["cpal/asio"]
oaat = ["dep:oaat-core", "dep:oaat-controller"]
cloud-relay = ["dep:tokio-tungstenite"]
postgres = ["dep:sqlx"]
# Acoustic Smart Radio: CLAP audio embeddings via onnxruntime. NOT in default —
# only builds that opt in pull `ort`, so the standard 6-target matrix is
# untouched. The onnxruntime shared lib + model are provided at runtime.
audio-embedding = ["dep:ort", "dep:libloading", "dep:flate2", "dep:tar", "dep:tokenizers"]
# #4378 : lecture des DSDIFF compressés DST. DÉSARMÉE — hors `default` et hors
# de toute ligne de build publiée : la licence de `dst-decoder` n'est pas
# tranchée (Apache-2.0 déclarée contre l'en-tête ISO/Philips reproduit dans
# son README). L'allumer demande un arbitrage juridique de Bertrand. Garde :
# tests/dst_desarmee_4378.rs.
dst = ["dep:dst-decoder"]

# #3248 : sur PostgreSQL, un INSERT conditionnel qui n'ecrit rien annulait la
# transaction entiere, et la branche `returning` rendait `Ok(1)` en dur.
# `autotests = false` ci-dessus — sans cette cible le fichier ne serait JAMAIS
# compile, et la porte rendrait un vert contre rien. La garde de site et la
# contre-epreuve SQLite s executent SANS base ; les trois epreuves PostgreSQL
# demandent `TUNE_TEST_PG_URL` (absente = saut annonce, posee mais injoignable
# = echec).
[[test]]
name = "pg_insert_conditionnel_f7c250"
path = "tests/pg_insert_conditionnel_f7c250.rs"

# #3256 : sur PostgreSQL, ` RETURNING id` etait ajoute a TOUT INSERT nu, y
# compris vers les tables qui n'ont pas de colonne `id` (`task_runs`,
# `streaming_auth`), et PostgreSQL refusait la requete entiere. `autotests =
# false` ci-dessus — sans cette cible le fichier ne serait JAMAIS compile, et
# la porte rendrait un vert contre rien. La garde de site et la contre-epreuve
# SQLite s executent SANS base ; les quatre epreuves PostgreSQL demandent
# `TUNE_TEST_PG_URL` (absente = saut annonce, posee mais injoignable = echec).
[[test]]
name = "pg_returning_id_hors_table_a_id_3256"
path = "tests/pg_returning_id_hors_table_a_id_3256.rs"

# #3205 : compteur de famine de l'anneau audio. `autotests = false` ci-dessus —
# sans cette cible le fichier ne serait JAMAIS compile, et la porte rendrait un
# vert contre rien.
[[test]]
name = "famine_anneau_i3205"
path = "tests/famine_anneau_i3205.rs"

# #3180 : une pochette de plus d un mebioctet n emporte plus le titre et l
