[build-dependencies]
cc = "1"

# AAC natif Windows (#1527) : Media Foundation via le crate `windows` —
# même version 0.62 que celle que cpal tire déjà, donc aucune compilation
# dupliquée sur les cibles Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_MediaFoundation",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Power",
] }

# #2219 — témoin de `resolve_streaming_url` par sa porte publique, avant que
# la famille resolve_stream quitte orchestrator.rs. `autotests = false` ci-dessus :
# sans cette cible, le fichier ne serait jamais compilé.
