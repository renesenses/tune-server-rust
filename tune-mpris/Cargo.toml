[package]
name = "tune-mpris"
description = "Compagnon MPRIS pour Linux : touches multimedia, applets du bureau et playerctl pilotent une zone Tune (#8824)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tune-mpris"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
# Meme version et memes options que `tune-server` et `tune-bridge` : aucune
# nouvelle copie dans Cargo.lock, et `wss://` pour un serveur derriere HTTPS.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

# MPRIS vit sur le bus D-Bus de la session : Linux seulement. Le reste de la
# caisse (etat, metadonnees, volume, requetes) compile et se teste partout.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
