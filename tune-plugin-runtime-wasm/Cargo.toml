[package]
name = "tune-plugin-runtime-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = { workspace = true }
# Compiler + runtime + WAT parsing only: no async, component model, GC,
# threads, profiling, pooling, coredump or debug support.
wasmtime = { version = "48.0.3", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }

[dev-dependencies]
tempfile = "3"
