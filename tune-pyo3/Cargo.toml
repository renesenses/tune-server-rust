# Standalone workspace: tune-pyo3 is a native Python extension (cdylib) that
# links libpython and needs Python headers. It is kept out of the parent
# tune-server-rust workspace (see root Cargo.toml `exclude`) so those deps
# never enter the server CI or build matrix.
[workspace]

[package]
name = "tune-pyo3"
version = "0.9.47"
edition = "2024"
# Business Source License 1.1 (see repo LICENSE), not MIT — cf issue #1147.
license = "BUSL-1.1"
authors = ["Bertrand Clech <bertrand.clech@orange.fr>"]

[lib]
name = "tune_native"
crate-type = ["cdylib"]

[dependencies]
tune-core = { path = "../tune-core" }
# pyo3 0.24 is in the RUSTSEC-2026-0176/0177 vulnerable range (fixed >= 0.29).
# The 0.24 -> 0.29 bump is a breaking API migration (allow_threads -> detach,
# IntoPyObject conversion for PyObject returns, ~42 compile errors across the
# wrappers) and needs a dedicated pass — tracked separately. Kept at 0.24 for
# now; standalone-workspace exclusion above is the immediate fix.
pyo3 = { version = "0.24", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
