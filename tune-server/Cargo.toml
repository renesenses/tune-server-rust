[package]
name = "tune-server"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
default = ["local-audio", "oaat", "cloud-relay", "bandcamp"]
local-audio = ["tune-core/local-audio"]
asio = ["tune-core/asio"]
oaat = ["tune-core/oaat"]
cloud-relay = ["tune-core/cloud-relay"]
postgres = ["tune-core/postgres"]
# Acoustic Smart Radio: CLAP audio embeddings (onnxruntime). Opt-in build — NOT
# in default, so the standard matrix never links ort.
audio-embedding = ["tune-core/audio-embedding"]
# P2 of the plugin ABI: wire the isolated Wasmtime runtime into the real
# server — AppState-backed HostContext, a
# registry of loaded wasm plugins, and the `/api/v1/plugins/{id}/…` route
# mount. NOT in default: the stock server build must not pull in wasmtime.
plugins-wasm = ["dep:tune-plugin-runtime-wasm"]
# P5 of the plugin ABI (#917): DJ mode extracted from the always-on core into a
# native in-tree plugin. NOT in default: the stock server no longer serves /dj;
# build `--features dj` to mount the plugin's routes at /api/v1/ext/dj.
dj = ["dep:tune-dj"]
# Karaoke: native synced-lyrics plugin (model B, sibling of `dj`). Reuses
# `tune_core::lyrics` (no LRC parse/fetch reimplemented). NOT in default; build
# `--features karaoke` to mount its routes at /api/v1/ext/karaoke.
karaoke = ["dep:tune-karaoke"]
# Bandcamp (#1768) : la recherche/découverte quittent le cœur toujours-compilé
# pour un plugin natif, comme `dj` avant elle.
#
# DANS default, contrairement à `dj` et `karaoke`, et c'est délibéré. Le double
# verrou — feature à la compilation ET installation dans le gestionnaire —
# rendait le second inatteignable : sans la feature, le plugin n'est pas
# enregistré, donc jamais proposé à l'installation. Or la demande était
# « AJOUTER le plugin Bandcamp » : il faut qu'il y ait quelque chose à ajouter.
#
# La feature décide si le code est COMPILÉ ; `default_enabled = false` décide
# s'il TOURNE. Le plugin est donc présent et visible, mais dormant jusqu'à ce
# que l'utilisateur l'installe.
#
# `dj` et `karaoke` sont tranchés depuis #2090 : compilés dans tous les binaires
# publiés (voir les lignes `--features` de release.yml) mais HORS CATALOGUE
# (`catalogued() == false`), donc jamais proposés à l'installation tant qu'aucun
# écran ne les atteint. Voir docs/plugins/README.md.
bandcamp = ["dep:tune-bandcamp"]
# Concerts (#2363) : la tache d'abonnement et la route de lecture, sorties du
# coeur toujours-compile. Hors catalogue tant qu'aucun ecran ne les consomme.
concerts = ["dep:tune-concerts"]

[dependencies]
libc = "0.2"
tune-core = { path = "../tune-core", default-features = false, features = ["plugin-http"] }
tune-http-types = { path = "../tune-http-types" }
tune-smart-http = { path = "../tune-smart-http" }
tune-stream-http = { path = "../tune-stream-http" }
tune-streaming-http = { path = "../tune-streaming-http" }
tune-plugin-runtime-wasm = { path = "../tune-plugin-runtime-wasm", optional = true }
tune-dj = { path = "../plugins/tune-dj", optional = true }
tune-karaoke = { path = "../plugins/tune-karaoke", optional = true }
tune-bandcamp = { path = "../plugins/tune-bandcamp", optional = true }
tune-concerts = { path = "../plugins/tune-concerts", optional = true }
tokio = { workspace = true }
rayon = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
async-stream = { workspace = true }
bytes = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
lofty = { workspace = true }
quick-xml = { workspace = true }
mdns-sd = { workspace = true }
urlencoding = { workspace = true }
sha2 = { workspace = true }
# Verifies minisign signatures over release checksums (self-update, audit
# item 8). Pure-Rust, no libsodium — verify-only, the trusted key is embedded.
minisign-verify = "0.2"
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
unicode-normalization = { workspace = true }
futures-util = { workspace = true }
socket2 = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
time = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
dotenvy = { workspace = true }

[dev-dependencies]
tower = "0.5"
# Test-only : fabriquer des horodatages passés pour rejouer une machine restée
# hors ligne (tests/licence_grace_visible.rs, #1999).
chrono = { workspace = true }
# Test-only: implementing `TunePlugin` and giving it a scratch data dir in
# tests/plugin_routes.rs.
async-trait = { workspace = true }
tempfile = "3"
# Test-only : fabriquer de vraies pochettes JPEG/PNG et relire les dimensions
# servies, pour que la contre-épreuve de `?size=` porte sur des pixels et non
# sur une longueur d'octets (#2996).
image = { workspace = true }
# Test-only : `#[tokio::test(start_paused = true)]`. La sonde d'avancement des
# images d'artistes se relit toutes les trois secondes et la passe qu'elle
# observe dure des heures — sans horloge virtuelle, l'éprouver coûterait ce
# temps-là pour de vrai (routes/library/artwork.rs, #2073). `test-util` n'entre
# que dans les cibles de test : le binaire publié ne le compile pas.
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "server_contracts"
path = "tests/server_contracts.rs"

[[test]]
name = "appliance_contracts"
path = "tests/appliance_contracts.rs"

[[test]]
name = "plugin_contracts"
path = "tests/plugin_contracts.rs"

[[test]]
name = "plugin_wasm_contracts"
path = "tests/plugin_wasm_contracts.rs"
required-features = ["plugins-wasm"]

# Cible à elle seule, et NON un module de `server_contracts` : le test installe
# un abonné `tracing` GLOBAL pour lire le journal. `tracing` met en cache, pour
# tout le processus, la décision « ce point d'appel intéresse-t-il quelqu'un ? »
# — un abonné posé au milieu d'un binaire qui lance des tests en parallèle rend
# des captures vides de façon imprévisible (leçon de
# `tune-core/tests/journal_descriptif_illisible.rs`). Un binaire, un test.
[[test]]
name = "panne_sql_journalisee"
path = "tests/panne_sql_journalisee.rs"

# Même raison, mot pour mot : abonné `tracing` GLOBAL, donc un binaire à lui
# seul et un seul essai dedans. Celui-ci lit le journal au niveau TRACE pour
# prouver qu'aucune clef d'API développeur ni chemin d'adresse de webhook n'y
# apparaît (#2795).
[[test]]
name = "cles_developpeur_hors_journal"
path = "tests/cles_developpeur_hors_journal.rs"

# Meme raison, mot pour mot : abonne `tracing` GLOBAL, donc un binaire a lui
# seul et un seul essai dedans. Celui-ci compte les lignes qu'un sondeur
# HQPlayer en panne coute au journal, et les tours de boucle qu'il fait sur
# vingt-quatre heures (#2566).
[[test]]
name = "journal_sondage_hqplayer"
path = "tests/journal_sondage_hqplayer.rs"
# Les requêtes SQL de `tune-server` sur une VRAIE base PostgreSQL (#3123).
# Cible à elle seule, derrière `required-features`, pour deux raisons : elle
# monte un `AppState` sur le moteur PostgreSQL (impossible sans la feature), et
# `test-postgres.yml` la lance seule, avec `TUNE_TEST_PG_URL` posée, sans
# rejouer les 467 contrats SQLite de `server_contracts`.
[[test]]
name = "pg_routes_serveur"
path = "tests/pg_routes_serveur.rs"
required-features = ["postgres"]

# Les deux sections d'accueil de #3181 sur PostgreSQL, et la contre-epreuve
# SQLite dans le meme test. Cible separee de `pg_routes_serveur`, qui sonde une
# bibliotheque VIDE et n'exige qu'un statut : celle-ci seme des lignes et exige
# qu'elles ressortent, ce qu'un test de statut ne peut pas voir quand la panne
# est avalee en `200 []`.
[[test]]
name = "pg_3181_sections_accueil"
path = "tests/pg_3181_sections_accueil.rs"
required-features = ["postgres"]

# #2372 : la route par piste `GET /library/tracks/{id}/versions`. Ce n'est PAS
# la route de `pg_3181_sections_accueil` — sa SQL est distincte et n'a jamais
# porté de `DISTINCT`. Depuis ce lot, le TRI des versions descend de la requête
# vers Rust : `ORDER BY al.title` ne range pas pareil sous la collation binaire
# de SQLite et sous la collation locale de PostgreSQL. Cette cible sème
# exactement les titres qui divergent et exige le même ordre des deux côtés.
# `autotests = false` plus haut — sans cette entrée, le fichier ne serait
# jamais compilé, donc vert contre rien.
[[test]]
name = "pg_2372_versions_par_piste"
path = "tests/pg_2372_versions_par_piste.rs"
required-features = ["postgres"]

# Depuis #3039, la fenetre des ajouts recents est un parametre borne.
[[test]]
name = "ajouts_recents_fenetre"
path = "tests/ajouts_recents_fenetre.rs"

# Canal stable / beta : quelles versions `/update/check` a le droit de proposer
# (#2266). Le defaut `auto` reproduit le comportement d'avant.
[[test]]
name = "canal_de_mise_a_jour"
path = "tests/canal_de_mise_a_jour.rs"

# #2939 : la carte de dedoublonnage du scan et la contrainte `file_path UNIQUE`
# n'avaient pas la meme portee. `autotests = false` plus haut — sans cette
# cible, le fichier ne serait jamais compile, donc vert contre rien.
[[test]]
name = "portee_unicite_file_path_2939"
path = "tests/portee_unicite_file_path_2939.rs"

# #3185 : la base ne doit plus dependre du repertoire de lancement (fil forum
# 616). La regle et sa migration vivent hors de tout `cfg`, donc ce fichier
# s'execute sur Linux comme sur macOS. `autotests = false` plus haut — sans
# cette cible, il ne serait jamais compile, donc vert contre rien.
[[test]]
name = "base_unique_lancement_i3185"
path = "tests/base_unique_lancement_i3185.rs"

# La migration Windows vers %LOCALAPPDATA% copiait le `.db` SEUL, sans son
# `-wal` ni son `-shm`. `autotests = false` plus haut — sans cette cible, le
# fichier ne serait jamais compile, donc vert contre rien. Et le test lui-meme
# ne porte AUCUN `cfg` : il eprouve sur Linux la regle et ses effets de bord,
# que `#[cfg(target_os = "windows")]` derobait a toute machine de compilation.
[[test]]
name = "migration_windows_annexes_sqlite"
path = "tests/migration_windows_annexes_sqlite.rs"

# #3182 : le rapport de diagnostic se declarait « sqlite » sur toute
# installation PostgreSQL, et « Migration version: 0 » sur une base de 77 291
# pistes. `autotests = false` plus haut — sans cette cible, le fichier ne
# serait jamais compile, donc vert contre rien.
#
# PAS de `required-features`, contrairement a `pg_routes_serveur` et
# `pg_3181_sections_accueil` : la contre-epreuve SQLite de ce fichier ne
# demande aucune base externe, et doit tourner dans le `cargo test --workspace`
# ordinaire — sinon reparer PostgreSQL en cassant SQLite passerait toutes les
# portes. Seule l'epreuve PostgreSQL porte `#[cfg(feature = "postgres")]`.
[[test]]
name = "pg_3182_moteur_annonce_dans_le_rapport"
path = "tests/pg_3182_moteur_annonce_dans_le_rapport.rs"
