#
# Pas de `required-features` : elle ne lit que des fichiers du depot (manifestes,
# sources, workflows) et doit tourner sur CHAQUE porte `cargo test -p
# tune-server`, y compris la plus etroite.
[[test]]
name = "derive_des_garde_fous_2816"
path = "tests/derive_des_garde_fous_2816.rs"
# #3529 : le recensement des chemins qui creent une zone. Il lit la SOURCE de
# `tune-server/src` et echoue sur tout site nouveau qui ne consulte pas
# « Creer automatiquement les zones ». Cible a elle seule parce qu'elle ne
# monte aucun `AppState` et n'a besoin d'aucune feature — et `autotests = false`
# plus haut : sans cette entree, le fichier ne serait JAMAIS compile, donc vert
# contre rien.
[[test]]
name = "zones_auto_create_recension"
path = "tests/zones_auto_create_recension.rs"

# #2732 : la borne d'une collection intelligente. Deux trous sur la meme valeur —
# rien ne gardait le NOM (le banc de contrats n'exige que la PRESENCE des champs,
# jamais l'absence des autres : reintroduire `max_albums` laissait tout vert), et
# rien ne gardait la VALEUR (`max_limit` partait tel quel dans `LIMIT {n}` : `0`
# vidait la collection, un negatif faisait diverger SQLite et PostgreSQL). Le
# temoin passe par les ROUTES MONTEES. `autotests = false` plus haut : sans cette
# cible, le fichier ne serait JAMAIS compile, donc vert contre rien.
#
# Posée ICI, au milieu du fichier, et non à la fin : deux lots qui ajoutent
# chacun leur cible en queue de `Cargo.toml` se conflictent à chaque fois.
[[test]]
name = "borne_smart_collections_2732"
path = "tests/borne_smart_collections_2732.rs"
