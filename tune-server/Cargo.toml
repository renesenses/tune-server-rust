[package]
name = "tune-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["local-audio", "oaat", "cloud-relay"]
local-audio = ["tune-core/local-audio"]
asio = ["tune-core/asio"]
oaat = ["tune-core/oaat"]
cloud-relay = ["tune-core/cloud-relay"]
postgres = ["tune-core/postgres"]
# P2 of the plugin ABI: wire the embedded wasmtime runtime (tune-core's
# `plugins-wasm`) into the real server — AppState-backed HostContext, a
# registry of loaded wasm plugins, and the `/api/v1/plugins/{id}/…` route
# mount. NOT in default: the stock server build must not pull in wasmtime.
plugins-wasm = ["tune-core/plugins-wasm"]

[dependencies]
tune-core = { path = "../tune-core", default-features = false, features = ["plugin-http"] }
tokio = { workspace = true }
rayon = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
async-stream = { workspace = true }
bytes = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
lofty = { workspace = true }
quick-xml = { workspace = true }
mdns-sd = { workspace = true }
urlencoding = { workspace = true }
sha2 = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
unicode-normalization = { workspace = true }
futures-util = { workspace = true }
socket2 = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
time = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
dotenvy = { workspace = true }

[dev-dependencies]
tower = "0.5"
# Test-only: implementing `TunePlugin` and giving it a scratch data dir in
# tests/plugin_routes.rs.
async-trait = { workspace = true }
tempfile = "3"
