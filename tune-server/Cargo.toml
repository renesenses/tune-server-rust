[[test]]
name = "sources_trois_routes_i3226"
path = "tests/sources_trois_routes_i3226.rs"

# #3578 : une adresse de station qui rend une PAGE WEB etait acceptee a
# l'enregistrement et ne se decouvrait qu'a la lecture. Le juge
# (`non_audio_content_type`) existait deja et n'avait qu'UN appelant.
# `autotests = false` plus haut : sans cette cible, le fichier ne serait JAMAIS
