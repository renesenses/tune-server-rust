#
# Pas de `required-features` : le banc monte un faux serveur de station sur
# 127.0.0.1 et une base SQLite en memoire, il ne demande ni base externe ni
# reseau sortant.
[[test]]
name = "radio_adresse_pas_un_flux_3578"
path = "tests/radio_adresse_pas_un_flux_3578.rs"
# #3664 : le marqueur de journal du refus qui propose une station. Binaire a
# part parce quil lit le JOURNAL : deux essais paralleles installant chacun
# leur abonne tracing se disputent le cache dinteret des points demission, et
# le verdict depend alors de lordre dordonnancement (mesure le 11/09/2026).
[[test]]
name = "radio_suggestion_marqueur_3664"
path = "tests/radio_suggestion_marqueur_3664.rs"

# #3543 : l'annuaire du site sert dix entrees Radio Paradise pour sept canaux,
# dont trois adresses de flux servies DEUX fois sous deux noms. Chaque entree
# porte son bouton « + Ajouter a Tune », qui tombe sur `GET /radios/add` et
