[package]
name = "tune-smart-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# #5438 — `spawn_blocking` : les lectures des collections intelligentes hors
# de l'exécuteur. Déjà au graphe (tune-core, tune-server) ; rien de nouveau.
tokio = { workspace = true }
tune-core = { path = "../tune-core", default-features = false }
async-trait = { workspace = true }
tune-http-types = { path = "../tune-http-types" }
# #6122 — « dans les N derniers jours » : l'instant « il y a N jours » se lit
# à l'horloge quand la règle se traduit. Déjà au graphe (tune-core).
chrono = { workspace = true }

# Recette du 13/11 (n° 73) — l'épreuve PostgreSQL des comptes en une passe
# (`pg_comptes_collections_en_une_passe`, `TUNE_TEST_PG_URL`) : elle ouvre une
# base par `tune_core::db::postgres`. Aucun effet sur le code servi.
[features]
postgres = ["tune-core/postgres"]

# Pour éprouver le HANDLER, et pas seulement les fonctions qu'il appelle : le
# débranchement d'un appel ne se voit dans aucune garde textuelle (#1231).
[dev-dependencies]
tokio = { workspace = true }
