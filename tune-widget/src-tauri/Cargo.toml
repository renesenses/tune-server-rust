# Standalone workspace: keeps tune-widget isolated from the parent
# tune-server-rust workspace (see root Cargo.toml `exclude`).
[workspace]

[package]
name = "tune-widget"
version = "0.1.7"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
tracing-appender = "0.2"
urlencoding = "2"
url = "2"
# Découverte des Tune Server du réseau local (#9255) : la même caisse que le
# serveur (`tune-core`), qui les annonce sur `_tune-server._tcp`.
mdns-sd = "0.20"

# Option « démarrer le serveur local » : le dossier d'installation de Tune
# Server se lit dans la clé de désinstallation écrite par son installeur.
# Plein écran natif de la fenêtre complète (#9255) : `collectionBehavior` de
# NSWindow, que Tauri n'expose pas. Déjà dans l'arbre par Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Les bancs lisent les raccourcis du menu avec l'analyseur de Tauri lui-même
# (`muda`, déjà dans l'arbre par Tauri).
[dev-dependencies]
muda = "0.19"

[build-dependencies]
tauri-build = { version = "2", features = [] }
